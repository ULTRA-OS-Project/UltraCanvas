<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="256" height="256" viewBox="0 0 256 256">
  <title>UltraPress</title>
  <desc>A page built of blocks - a dark header band, a red hero block, lines of text and a button - the website and shop builder that publishes WebAssembly. Flat colours only, so every SVG renderer draws it the same.</desc>
  <!-- the sheet, with a shadow -->
  <rect x="40" y="26" width="176" height="212" rx="18" fill="#000000" opacity="0.18"/>
  <rect x="34" y="18" width="176" height="212" rx="18" fill="#f6f6f9" stroke="#c9c9d2" stroke-width="3"/>
  <!-- header band -->
  <path d="M34 36 a18 18 0 0 1 18 -18 h140 a18 18 0 0 1 18 18 v30 h-176 z" fill="#18193f"/>
  <circle cx="58" cy="42" r="7" fill="#ffffff" opacity="0.9"/>
  <rect x="74" y="38" width="30" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
  <rect x="112" y="38" width="22" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
  <rect x="142" y="38" width="26" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
  <!-- hero block -->
  <rect x="52" y="82" width="140" height="56" rx="10" fill="#a90707"/>
  <rect x="66" y="96" width="84" height="10" rx="5" fill="#ffffff" opacity="0.95"/>
  <rect x="66" y="114" width="56" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
  <!-- text lines -->
  <rect x="52" y="154" width="140" height="8" rx="4" fill="#9a9aa6"/>
  <rect x="52" y="170" width="112" height="8" rx="4" fill="#9a9aa6"/>
  <rect x="52" y="186" width="126" height="8" rx="4" fill="#9a9aa6"/>
  <!-- a button -->
  <rect x="52" y="204" width="54" height="16" rx="8" fill="#a90707"/>
</svg>
