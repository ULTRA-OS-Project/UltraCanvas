<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4F9C"/>
      <stop offset="1" stop-color="#16B9B5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#F5A800"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="url(#bg)"/>

  <!-- Ledger / document -->
  <path d="M126 92 H302 L356 146 V399 H126 Z"
        fill="#FFFFFF"/>
  <path d="M302 92 V146 H356" fill="#B9D9F2"/>

  <!-- Ledger lines -->
  <g fill="#5689B4">
    <rect x="155" y="154" width="125" height="13" rx="6.5"/>
    <rect x="155" y="190" width="160" height="13" rx="6.5"/>
    <rect x="155" y="226" width="125" height="13" rx="6.5"/>
  </g>

  <!-- Rising bar chart -->
  <g fill="#36D79A">
    <rect x="292" y="292" width="38" height="107" rx="10"/>
    <rect x="346" y="246" width="38" height="153" rx="10"/>
    <rect x="400" y="188" width="38" height="211" rx="10"/>
  </g>

  <!-- Calculator -->
  <rect x="80" y="238" width="190" height="190" rx="30"
        fill="#123F73" stroke="#FFFFFF" stroke-width="10"/>
  <rect x="105" y="265" width="140" height="39" rx="10" fill="#B9D9F2"/>

  <!-- Calculator keys -->
  <g fill="#B9D9F2">
    <rect x="105" y="326" width="31" height="31" rx="8"/>
    <rect x="153" y="326" width="31" height="31" rx="8"/>
    <rect x="201" y="326" width="31" height="31" rx="8"/>
    <rect x="105" y="372" width="31" height="31" rx="8"/>
    <rect x="153" y="372" width="31" height="31" rx="8"/>
    <rect x="201" y="372" width="31" height="31" rx="8"/>
  </g>
  <rect x="201" y="372" width="31" height="31" rx="8" fill="#20C99A"/>

  <!-- Euro coin -->
  <circle cx="362" cy="386" r="73" fill="#FFBF24"/>
  <circle cx="362" cy="386" r="57" fill="url(#gold)"/>
  <text x="362" y="410"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="91"
        font-weight="700"
        fill="#FFFFFF">€</text>
</svg>