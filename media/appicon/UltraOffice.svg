<?xml version="1.0" encoding="UTF-8"?>
<!-- UltraOffice app icon: a page, a grid and a slide fanned out on the ULTRA OS
     blue - the three kinds of document the program opens. Paths only, so it
     renders the same without any font. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#2e66bf"/>
  <g transform="translate(134 136) scale(0.76) translate(-128 -138)">
  <!-- the slide, behind -->
  <g transform="rotate(-12 128 128)">
    <rect x="40" y="70" width="120" height="84" rx="12" fill="#f08a5d"/>
    <path d="M58 98h56M58 118h72" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- the spreadsheet, in the middle -->
  <g transform="rotate(8 128 128)">
    <rect x="96" y="60" width="104" height="104" rx="12" fill="#3cb37a"/>
    <path d="M96 95h104M96 130h104M131 95v69" stroke="#ffffff" stroke-width="7"/>
  </g>
  <!-- the page, in front -->
  <path d="M84 104h62l30 30v76a10 10 0 0 1-10 10H84a10 10 0 0 1-10-10v-96a10 10 0 0 1 10-10z" fill="#ffffff"/>
  <path d="M146 104v30h30" fill="#cfdcf3"/>
  <path d="M94 160h62M94 180h62M94 200h40" stroke="#2e66bf" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
