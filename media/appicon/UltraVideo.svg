<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 768 768" width="256" height="256">
  <!-- UltraVideo: a film frame of four colour fields with a pencil across it - the video editor's mark -->
  <defs>
    <g id="uv-fields">
      <rect x="133" y="75" width="251" height="309" fill="#7FFF81"/>
      <rect x="384" y="75" width="251" height="309" fill="#FF7FFE"/>
      <rect x="133" y="384" width="251" height="309" fill="#FFFE7F"/>
      <rect x="384" y="384" width="251" height="309" fill="#7FFFFF"/>
    </g>
    <clipPath id="uv-cuts">
      <rect transform="rotate(-45)" x="-123" y="502.2" width="234.7" height="11" rx="5.5"/>
      <polygon points="219,488 244,463 314,536 289,561 258,561 258,524 219,524"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="768" height="768" rx="70" fill="#000000"/>
  <g fill="#E5E5E5">
    <rect x="30" y="75" width="75" height="75" rx="12"/><rect x="30" y="255" width="75" height="75" rx="12"/>
    <rect x="30" y="435" width="75" height="75" rx="12"/><rect x="30" y="615" width="75" height="75" rx="12"/>
    <rect x="663" y="75" width="75" height="75" rx="12"/><rect x="663" y="255" width="75" height="75" rx="12"/>
    <rect x="663" y="435" width="75" height="75" rx="12"/><rect x="663" y="615" width="75" height="75" rx="12"/>
  </g>
  <use xlink:href="#uv-fields" href="#uv-fields"/>
  <g fill="#000000">
    <polygon points="180,475 430,228 552,350 305,600 180,600"/>
    <g transform="rotate(-45)">
      <rect x="173.2" y="463.9" width="50" height="176"/>
      <rect x="173.2" y="463.9" width="95.5" height="176" rx="32"/>
    </g>
  </g>
  <g clip-path="url(#uv-cuts)">
    <use xlink:href="#uv-fields" href="#uv-fields"/>
  </g>
</svg>
