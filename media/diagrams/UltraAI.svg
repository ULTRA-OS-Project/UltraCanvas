<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>UltraAI module overview (16:9)</title>
<desc>UltraAI exposes ten stable C++ capability interfaces backed by swappable, self-registering adapter APIs, which optionally route through UltraNet for networking and UltraVault for credentials.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:15px;font-weight:500}
.ts{font-size:13px;font-weight:400}
.blue-fill{fill:#E6F1FB;stroke:#185FA5}
.blue-t{fill:#0C447C}.blue-s{fill:#185FA5}
.teal-fill{fill:#E1F5EE;stroke:#0F6E56}
.teal-sub{fill:#9FE1CB;stroke:#0F6E56}
.teal-t{fill:#085041}.teal-s{fill:#0F6E56}
.coral-fill{fill:#FAECE7;stroke:#993C1D}
.coral-sub{fill:#F3CFC2;stroke:#993C1D}
.coral-t{fill:#712B13}.coral-s{fill:#993C1D}
.amber-fill{fill:#FAEEDA;stroke:#854F0B}
.amber-sub{fill:#F2D9A6;stroke:#854F0B}
.amber-t{fill:#633806}.amber-s{fill:#854F0B}
.purple-fill{fill:#EEEDFE;stroke:#534AB7}
.purple-sub{fill:#CECBF6;stroke:#534AB7}
.purple-t{fill:#3C3489}.purple-s{fill:#534AB7}
.pchip{font-size:13px;font-weight:500}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
</defs>

<!-- UltraAI surface (full width) -->
<rect class="blue-fill" x="40" y="30" width="1200" height="58" rx="10" stroke-width="0.5"/>
<text class="th blue-t" x="640" y="53" text-anchor="middle" dominant-baseline="central">UltraAI</text>
<text class="ts blue-s" x="640" y="72" text-anchor="middle" dominant-baseline="central">Single stable C++ surface for AI features</text>

<line x1="640" y1="88" x2="640" y2="114" class="arr" marker-end="url(#arrow)"/>

<!-- Capabilities band (full width) -->
<rect class="purple-fill" x="40" y="116" width="1200" height="278" rx="10" stroke-width="0.5"/>
<text class="th purple-t" x="62" y="139" dominant-baseline="central">UltraAI API capabilities</text>
<text class="ts purple-s" x="1218" y="139" text-anchor="end" dominant-baseline="central">10 modalities · mock adapter each</text>
<rect class="purple-sub" x="60" y="156" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="199" y="177" text-anchor="middle" dominant-baseline="central">ITextLLM</text>
<text class="ts purple-s" x="199" y="197" text-anchor="middle" dominant-baseline="central">Chat, tools, stream</text>
<rect class="purple-sub" x="354" y="156" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="493" y="177" text-anchor="middle" dominant-baseline="central">IEmbeddings</text>
<text class="ts purple-s" x="493" y="197" text-anchor="middle" dominant-baseline="central">Batched vectors</text>
<rect class="purple-sub" x="648" y="156" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="787" y="177" text-anchor="middle" dominant-baseline="central">ISpeechToText</text>
<text class="ts purple-s" x="787" y="197" text-anchor="middle" dominant-baseline="central">Transcribe, live mic</text>
<rect class="purple-sub" x="942" y="156" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="1081" y="177" text-anchor="middle" dominant-baseline="central">ITextToSpeech</text>
<text class="ts purple-s" x="1081" y="197" text-anchor="middle" dominant-baseline="central">Synthesis, clone</text>
<rect class="purple-sub" x="60" y="232" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="199" y="253" text-anchor="middle" dominant-baseline="central">IImageGen</text>
<text class="ts purple-s" x="199" y="273" text-anchor="middle" dominant-baseline="central">txt2img, inpaint</text>
<rect class="purple-sub" x="354" y="232" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="493" y="253" text-anchor="middle" dominant-baseline="central">IVisionAnalyzer</text>
<text class="ts purple-s" x="493" y="273" text-anchor="middle" dominant-baseline="central">Caption, OCR, VQA</text>
<rect class="purple-sub" x="648" y="232" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="787" y="253" text-anchor="middle" dominant-baseline="central">ITranslator</text>
<text class="ts purple-s" x="787" y="273" text-anchor="middle" dominant-baseline="central">Auto-detect, glossary</text>
<rect class="purple-sub" x="942" y="232" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="1081" y="253" text-anchor="middle" dominant-baseline="central">IVideoGen</text>
<text class="ts purple-s" x="1081" y="273" text-anchor="middle" dominant-baseline="central">txt2vid, upscale</text>
<rect class="purple-sub" x="60" y="308" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="199" y="329" text-anchor="middle" dominant-baseline="central">IMusicGen</text>
<text class="ts purple-s" x="199" y="349" text-anchor="middle" dominant-baseline="central">Song, SFX, stems</text>
<rect class="purple-sub" x="354" y="308" width="278" height="62" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="493" y="329" text-anchor="middle" dominant-baseline="central">ICodeAssist</text>
<text class="ts purple-s" x="493" y="349" text-anchor="middle" dominant-baseline="central">Refactor, bugs, FIM</text>
<rect class="purple-sub" x="648" y="308" width="572" height="62" rx="6" stroke-width="0.5" stroke-dasharray="4 3" style="fill:#EEEDFE"/>
<text class="ts purple-t" x="934" y="339" text-anchor="middle" dominant-baseline="central">Each interface ships a programmable mock</text>

<line x1="640" y1="394" x2="640" y2="428" class="arr" marker-end="url(#arrow)"/>

<!-- Adapters (full width) -->
<rect class="teal-fill" x="40" y="430" width="1200" height="110" rx="10" stroke-width="0.5"/>
<text class="th teal-t" x="62" y="453" dominant-baseline="central">Self-registering adapters</text>
<rect class="teal-sub" x="60" y="472" width="278" height="48" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="199" y="496" text-anchor="middle" dominant-baseline="central">Mock API</text>
<rect class="teal-sub" x="354" y="472" width="278" height="48" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="493" y="496" text-anchor="middle" dominant-baseline="central">Anthropic API</text>
<rect class="teal-sub" x="648" y="472" width="278" height="48" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="787" y="496" text-anchor="middle" dominant-baseline="central">OpenAI API</text>
<rect class="teal-sub" x="942" y="472" width="278" height="48" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="1081" y="496" text-anchor="middle" dominant-baseline="central">Local Llama API · …</text>

<line x1="335" y1="540" x2="335" y2="598" class="arr" marker-end="url(#arrow)"/>
<line x1="945" y1="540" x2="945" y2="598" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="640" y="569" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">opt-in</text>

<!-- Opt-in sibling modules -->
<rect class="coral-fill" x="40" y="600" width="590" height="80" rx="10" stroke-width="0.5"/>
<text class="th coral-t" x="335" y="628" text-anchor="middle" dominant-baseline="central">UltraNet</text>
<text class="ts coral-s" x="335" y="652" text-anchor="middle" dominant-baseline="central">HTTP · WebSocket · TLS · DNS</text>
<rect class="coral-fill" x="650" y="600" width="590" height="80" rx="10" stroke-width="0.5"/>
<text class="th coral-t" x="945" y="628" text-anchor="middle" dominant-baseline="central">UltraVault</text>
<text class="ts coral-s" x="945" y="652" text-anchor="middle" dominant-baseline="central">Named-secret resolution</text>
</svg>
