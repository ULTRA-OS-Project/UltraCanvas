name: Image codecs

# The image codec tests on a libvips that has the codecs the framework
# offers, and the chart-free core linked by something.
#
# JPEG XL: build.yml's Linux rows run on ubuntu-22.04 (the glibc floor of the
# packages they make), whose libvips is built without libjxl, so there
# ImageJxlTest can only report SKIP and the format went untested - it was
# taken out of DemoApp's performance page in 0.1.35 for that reason. Ubuntu
# 24.04's libvips 8.15 has it (libjxl 0.7). This job builds the core and the
# headless image tests there, runs them, and fails when ImageJxlTest skipped
# instead of passing.
#
# Charts off: the core is configured with ULTRACANVAS_ENABLE_CHARTS=OFF (and
# every app and optional module off), the chart-free core no other job
# builds. Until 2026-10 that core compiled and then failed to link anything
# that used a diagram or the progress dialog: both are built on chart
# classes the option dropped. ImageJxlTest reaches the progress dialog
# through UltraCanvasFileLoader, and MatrixDiagramRenderTest draws a diagram,
# so linking them is the check.
#
# Trigger policy matches doc-examples.yml: `pull_request` covers feature
# branches, so listing them under `push` too would run this twice per commit.
# Any change to the core can add a dependency on chart code, hence the paths.
on:
  push:
    branches: [main]
    paths: &paths
      - 'UltraCanvas/**'
      - 'Tests/ImageJxlTest.cpp'
      - 'Tests/ImageJxlTests.cmake'
      - 'Tests/ImageIcoQoiTest.cpp'
      - 'Tests/ImageGifSaverTest.cpp'
      - 'Tests/MatrixDiagramRenderTest.cpp'
      - 'Tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/ci-apt.sh'
      - '.github/workflows/image-codecs.yml'
  pull_request:
    branches:
      - main
      - 'claude/**'
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Pinned, not ubuntu-latest: the point is a libvips with libjxl, which a
    # later image could drop.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # What the core needs with every optional module off: the graphics
      # stack, libvips (24.04's pulls in libjxl, libheif and librsvg), X11 and
      # GTK for the Linux backend, tinyxml2 and fmt. The optional libraries
      # the core finds when present (zbar, sodium, cups, sane, udev, hunspell)
      # are left out on purpose: the core must build without them.
      - name: Install the core's dependencies
        run: |
          scripts/ci-apt.sh update
          scripts/ci-apt.sh install --no-install-recommends \
            cmake ninja-build clang pkg-config build-essential \
            libcairo2-dev libpango1.0-dev libharfbuzz-dev libvips-dev \
            libglib2.0-dev libfreetype-dev libtinyxml2-dev libfmt-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxfixes-dev \
            libgl1-mesa-dev libgtk-3-dev

      # Every BUILD_* option and every ULTRACANVAS_{PLUGIN,USE,ENABLE}_*
      # option off, read from the CMake files so a new app or module is off
      # here too, then the tests on.
      - name: Configure the chart-free core
        run: |
          off=$(grep -h -oE '^option\((BUILD_[A-Z_]+|ULTRACANVAS_(PLUGIN|USE|ENABLE)_[A-Z_]+)' \
                  CMakeLists.txt UltraCanvas/CMakeLists.txt |
                sed 's/^option(/-D/; s/$/=OFF/' | sort -u)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $off \
                -DBUILD_TESTS=ON 2>&1 | tee configure.log
          grep -q 'Charts: DISABLED' configure.log

      - name: Build the core and the tests
        run: cmake --build build --target ImageJxlTest ImageIcoQoiTest ImageGifSaverTest MatrixDiagramRenderTest

      - name: Run the tests
        run: |
          cd build
          ctest --output-on-failure --no-tests=error -V \
                -R '^(ImageJxlTest|ImageIcoQoiTest|ImageGifSaverTest|MatrixDiagramRenderTest)$' 2>&1 |
            tee ctest.log
          test "${PIPESTATUS[0]}" -eq 0

      # ImageJxlTest exits 0 on SKIP (a libvips without libjxl). Here that
      # would mean this job no longer checks what it exists for.
      - name: JPEG XL was tested, not skipped
        run: |
          if ! grep -q 'All JPEG XL checks passed' build/ctest.log; then
            echo "::error::ImageJxlTest did not run its checks - has this runner's libvips lost libjxl?"
            grep -n 'SKIP' build/ctest.log || true
            exit 1
          fi
