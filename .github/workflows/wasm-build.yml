name: WebAssembly build

# Builds the demo application (UltraCanvasDemo.html) and the WebAssembly
# backend's validation apps (wasm-demo and the ultraos.eu front page) with
# Emscripten, so OS/WASM/, the core's __EMSCRIPTEN__ branches and the demo's
# get compiled somewhere other than one developer's machine.
#
# Four variants, one job each, so the "Demo sizes" tables answer what a
# visitor downloads and which lever shrinks it (Phase 0 of
# Docs/Research/UltraPressDesignProposal.md): the baseline (-O2, threads,
# libvips, every bundled font), MinSizeRel (-Os), the four fonts the front
# page uses instead of the fourteen, and a single-threaded build against a
# sysroot built without -pthread (no SharedArrayBuffer, so no isolation
# headers on the host). libvips is part of UltraCanvas, so there is no
# variant without it but the single-threaded one, where it cannot run. The
# four-fonts variant is a measurement that may fail to build or link; it
# never fails the run.
# A fifth job, dbadmin-browser, takes the baseline's UltraDBAdmin page and
# tests it end to end against a relay it builds natively. Every variant
# builds the UltraWeb runtime too (Apps/UltraWeb/browser); the
# single-threaded one, the runtime that ships, also runs it in Chromium.
# The single-threaded one is required: it is the build a static host
# without cross-origin isolation headers must serve, and since run 24 it
# builds and passes its smoke test like the baseline.
#
# Runs on a pull request, and on a push to main, that touches what the
# browser build is made of (the paths below): the backend, the sysroot
# script and its patches, the CMake files with their EMSCRIPTEN branches,
# the image loader with its libvips-free roads, the demo. Everything else
# leaves it alone: the wasm sysroot (glib, cairo, pango, fontconfig,
# harfbuzz, libvips and their dependencies) takes the better part of an hour
# to cross-compile and needs Ubuntu source packages, but it is cached on the
# hash of the script and its patches, so a run on a warm cache only builds
# the framework and the demo, about 25 minutes for the four variants. A
# manual dispatch from the Actions tab still works, against any branch,
# with the Emscripten version as its one input.

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-build.yml'
      - 'UltraCanvas/OS/WASM/**'
      - 'cmake/UltraCanvasWasmSysroot.cmake'
      - 'cmake/UltraCanvasWasmApp.cmake'
      - 'CMakeLists.txt'
      - 'UltraCanvas/CMakeLists.txt'
      - 'UltraCanvas/libspecific/Cairo/**'
      - 'UltraCanvas/third_party/stb/**'
      - 'Apps/DemoApp/**'
      - 'Apps/UltraDBAdmin/**'
      - 'Apps/UltraStore/**'
      - 'cmake/UltraStoreKeys.cmake'
      - 'Tests/UltraDBAdmin/e2e/**'
      - 'UltraCanvas/core/UltraDatabase/**'
      - 'UltraCanvas/include/UltraDatabase/**'
      - 'UltraCanvas/include/WasmHost/**'
      - 'Apps/UltraWeb/**'
      - 'UltraWeb/guest/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasm-build.yml'
      - 'UltraCanvas/OS/WASM/**'
      - 'cmake/UltraCanvasWasmSysroot.cmake'
      - 'cmake/UltraCanvasWasmApp.cmake'
      - 'CMakeLists.txt'
      - 'UltraCanvas/CMakeLists.txt'
      - 'UltraCanvas/libspecific/Cairo/**'
      - 'UltraCanvas/third_party/stb/**'
      - 'Apps/DemoApp/**'
      - 'Apps/UltraDBAdmin/**'
      - 'Apps/UltraStore/**'
      - 'cmake/UltraStoreKeys.cmake'
      - 'Tests/UltraDBAdmin/e2e/**'
      - 'UltraCanvas/core/UltraDatabase/**'
      - 'UltraCanvas/include/UltraDatabase/**'
      - 'UltraCanvas/include/WasmHost/**'
      - 'Apps/UltraWeb/**'
      - 'UltraWeb/guest/**'
  workflow_dispatch:
    inputs:
      # Pinned, not 'latest': latest moves to a new release, major ones
      # included, on emsdk's schedule, and the sysroot cache below is keyed on
      # this string, so under 'latest' a new compiler kept linking against a
      # sysroot built by whichever release 'latest' named first. Raise it
      # together with the version named in UltraCanvas/OS/WASM/README.md.
      emsdk_version:
        description: 'Emscripten SDK version (default: the one UltraCanvas/OS/WASM/README.md names)'
        required: false
        default: '6.0.11'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # The dispatch input, or the pinned default on a pull request or push.
  EMSDK_VERSION: ${{ inputs.emsdk_version || '6.0.11' }}

jobs:
  wasm:
    name: wasm (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The baseline also builds UltraDBAdmin's browser build
          # (Apps/UltraDBAdmin/README.md): a threaded page, as its relay
          # connections wait on worker threads, so the single-threaded
          # variant leaves it out.
          - variant: baseline
            threads: 1
            configure: -DCMAKE_BUILD_TYPE=Release -DBUILD_ULTRADBADMIN=ON
            experimental: false
          - variant: min-size
            threads: 1
            configure: -DCMAKE_BUILD_TYPE=MinSizeRel
            experimental: false
          - variant: four-fonts
            threads: 1
            configure: -DCMAKE_BUILD_TYPE=Release "-DUC_WASM_FONTS=Ubuntu-R.ttf;Ubuntu-B.ttf;Ubuntu-RI.ttf;Ubuntu-BI.ttf"
            experimental: true
          # Without libvips: it runs every image on a worker thread, which a
          # program built without -pthread cannot start (run 23 ended every
          # page on GLib's "error 'Not supported' during 'pthread_create'"),
          # so the library's CMake leaves it out of a single-threaded build -
          # the one build UltraCanvas has without it. Required, not
          # experimental: a static host serves this one.
          - variant: single-thread
            threads: 0
            configure: -DCMAKE_BUILD_TYPE=Release -DULTRACANVAS_WASM_THREADS=OFF
            experimental: false
          # The UltraCanvas runtime (UltraCanvas/OS/WASM/runtime,
          # Docs/UltraCanvas/UltraCanvasWasmRuntime.md): everything -fPIC
          # against a sysroot built WASM_PIC=1, so apps load as side modules
          # into one UltraCanvas main module. Single-threaded, as dynamic
          # linking in a browser is; the pages and tests of the single-thread
          # variant run here too, on the -fPIC build.
          - variant: dynamic
            threads: 0
            pic: 1
            configure: -DCMAKE_BUILD_TYPE=Release -DULTRACANVAS_WASM_THREADS=OFF -DULTRACANVAS_WASM_DYNAMIC=ON
            experimental: false
    env:
      # One sysroot per thread setting: objects built with -pthread do not
      # link without it, so the two never share a directory or a cache key.
      SYSROOT: ${{ github.workspace }}/wasm-sysroot-threads${{ matrix.threads }}${{ matrix.pic && '-pic' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install host tools
        # A stalled mirror is retried by scripts/ci-apt.sh; this is the
        # backstop, long enough for one that crawls (15-27 min on a bad day,
        # as the Build rows allow). The job has 120.
        timeout-minutes: 45
        run: |
          # deb-src entries for the fontconfig / pixman / cairo / pango
          # source packages the sysroot script fetches with apt-get source.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          scripts/ci-apt.sh update
          scripts/ci-apt.sh install --no-install-recommends \
            build-essential cmake ninja-build gperf pkg-config \
            python3 curl git dpkg-dev
          # meson from PyPI, not apt: the sysroot's glib (wasm-vips-2.89.3)
          # needs meson 1.4 or newer and Ubuntu 24.04 packages 1.3.2.
          pipx install meson==1.12.1
          meson --version

      # emsdk itself, not mymindstorm/setup-emsdk: v14 of that action targets
      # Node.js 20, which the runners no longer run, and it only wrapped these
      # same commands. The later steps get what the action exported: emsdk and
      # emcc on PATH, EMSDK and EMSDK_NODE. Not cached - the download is a
      # minute or two on a manually dispatched job, while a cached toolchain
      # would take a share of the repository's 10 GB cache from the Build
      # workflow's ccache.
      - name: Set up Emscripten
        timeout-minutes: 15
        run: |
          # The clone and the toolchain download retried (scripts/ci-retry.sh),
          # the clone into an emptied folder each time. `emsdk install` needs
          # no cleaning between tries: without EMSDK_KEEP_DOWNLOADS it fetches
          # every archive again rather than reusing a cut-off one.
          scripts/ci-retry.sh --clean "$RUNNER_TEMP/emsdk" -- \
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          scripts/ci-retry.sh -- "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk activate "$EMSDK_VERSION"
          source ./emsdk_env.sh
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          emcc --version

      # Restore and save are separate steps so a sysroot is kept as soon as it
      # is built: the combined action saves only when the whole job passes, so
      # a demo that failed to configure or compile threw away ~20 minutes of
      # sysroot and the next run built it again.
      - name: Restore wasm sysroot
        id: sysroot-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SYSROOT }}
          key: wasm-sysroot-${{ runner.os }}-${{ env.EMSDK_VERSION }}-threads${{ matrix.threads }}${{ matrix.pic && '-pic' || '' }}-${{ hashFiles('UltraCanvas/OS/WASM/build-wasm-sysroot.sh', 'UltraCanvas/OS/WASM/patches/**') }}

      - name: Build wasm sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        working-directory: UltraCanvas/OS/WASM
        env:
          WASM_THREADS: ${{ matrix.threads }}
          WASM_PIC: ${{ matrix.pic || 0 }}
        run: ./build-wasm-sysroot.sh "$SYSROOT" "${{ runner.temp }}/wasm-sysroot-build"

      - name: Save wasm sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.SYSROOT }}
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}

      # CMake's pkg-config is the host's (/usr/bin/pkg-config), and emcmake
      # does not hand it EM_PKG_CONFIG_PATH: with that alone, run 2 of this
      # workflow built the whole sysroot and then found no cairo. So the
      # sysroot goes on PKG_CONFIG_PATH, and PKG_CONFIG_LIBDIR keeps the
      # host's own .pc files out of a wasm build.
      #
      # The repository root, not OS/WASM/demo: under emcmake the root's
      # WebAssembly defaults block leaves the core library and
      # UltraCanvasDemo.html, and BUILD_WASM_DEMOS adds the two validation
      # apps to the same build, so the library is compiled once for all three.
      - name: Configure
        env:
          EM_PKG_CONFIG_PATH: ${{ env.SYSROOT }}/lib/pkgconfig:${{ env.SYSROOT }}/share/pkgconfig
          PKG_CONFIG_PATH: ${{ env.SYSROOT }}/lib/pkgconfig:${{ env.SYSROOT }}/share/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ env.SYSROOT }}/lib/pkgconfig:${{ env.SYSROOT }}/share/pkgconfig
        run: |
          # The dynamic variant also builds the UltraStore web store
          # (Apps/UltraStore/web) as a side module, with the browser test's
          # fixture key compiled in beside the store's keys: the fixture
          # catalog (test/fixture) is signed with it. A test build only.
          extra=""
          if [ "${{ matrix.pic }}" = "1" ]; then
            extra="-DULTRASTORE_WEB_TEST_KEYS=$(cat Apps/UltraStore/web/test/fixture/trusted-key.hex)"
          fi
          emcmake cmake -B build-wasm -S . ${{ matrix.configure }} -DBUILD_WASM_DEMOS=ON $extra

      # A job count, not a bare --parallel: under the Makefile generator that
      # is `make -j` with no limit, and run 3 of this workflow had hundreds of
      # emcc processes going at once until the kernel killed them for memory.
      - name: Build
        run: cmake --build build-wasm --parallel "$(nproc)"

      # What a visitor downloads: each page's .wasm, .js and .data, raw and
      # as a server would compress them (gzip, and Brotli when the runner
      # has it). The .wasm carries the framework with cairo, pango, glib,
      # fontconfig, libvips and the bundled fonts in the .data, so this
      # table is the number every "UltraCanvas as a web page" decision rests
      # on (Docs/Research/UltraPressDesignProposal.md §4.3). UltraCanvasDemo
      # is the whole element catalogue with its samples; the two validation
      # apps are what a small page costs. Measurement only: it never fails
      # the job. No separate worker file (<page>.ww.js): emsdk 6.0.11 puts
      # the pthread worker into the .js, as run 11 of this workflow showed.
      - name: Demo sizes
        continue-on-error: true
        working-directory: build-wasm
        env:
          # Through the environment, not interpolated into the script: the
          # four-fonts configure string holds semicolons, which the shell
          # read as command separators (run 12).
          CONFIGURE: ${{ matrix.configure }}
        run: |
          kb() { du -k "$1" | cut -f1; }
          mb() { awk -v k="$1" 'BEGIN { printf "%.2f MB", k / 1024 }'; }
          gz() { gzip -9 -c "$1" | wc -c | awk '{ printf "%.2f MB", $1 / 1048576 }'; }
          br() { if command -v brotli >/dev/null; then brotli -q 11 -c "$1" | wc -c | awk '{ printf "%.2f MB", $1 / 1048576 }'; else echo "n/a"; fi; }
          {
            echo "### WebAssembly demo sizes: ${{ matrix.variant }} (emsdk ${{ env.EMSDK_VERSION }}, \`$CONFIGURE\`)"
            echo ""
            echo "| File | Raw | gzip -9 | brotli -q 11 |"
            echo "|---|---:|---:|---:|"
            for demo in UltraCanvasDemo wasm-demo ultraos-frontpage UltraDBAdmin; do
              [ -f "$demo.wasm" ] || continue      # UltraDBAdmin: the baseline only
              total=0
              for f in "$demo".wasm "$demo".js "$demo".data "$demo".ww.js; do
                [ -f "$f" ] || continue
                k=$(kb "$f"); total=$((total + k))
                echo "| $f | $(mb "$k") | $(gz "$f") | $(br "$f") |"
              done
              echo "| **$demo, all files** | **$(mb "$total")** | | |"
            done
            # The web store's side module (the dynamic variant): what a
            # visitor pays on top of the runtime, against its 150 KB
            # Brotli budget (Docs/UltraStore/WebstoreBrief.md).
            if [ -f Apps/UltraStore/web/ultrastore-web.wasm ]; then
              f=Apps/UltraStore/web/ultrastore-web.wasm
              echo "| ultrastore-web.wasm (the web store, a side module) | $(mb "$(kb "$f")") | $(gz "$f") | $(br "$f") |"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # One folder with the three pages and serve.py, so the artifact works
      # as unzipped: run `python3 serve.py 8080` in it and open
      # UltraCanvasDemo.html, wasm-demo.html or ultraos-frontpage.html (the
      # pages need the server's cross-origin isolation headers, see
      # UltraCanvas/OS/WASM/README.md). A worker file is copied when an
      # emsdk emits one again; without it the threads would not start.
      - name: Collect the pages
        env:
          CONFIGURE: ${{ matrix.configure }}
        run: |
          mkdir wasm-demo
          cp UltraCanvas/OS/WASM/demo/serve.py wasm-demo/
          for page in UltraCanvasDemo wasm-demo ultraos-frontpage; do
            cp "build-wasm/$page".{html,js,wasm,data} wasm-demo/
            [ -f "build-wasm/$page.ww.js" ] && cp "build-wasm/$page.ww.js" wasm-demo/
          done
          # UltraDBAdmin's page, where the variant builds it. Not in the smoke
          # test below: without its relay the page's first act, opening the
          # relay's WebSocket, puts the browser's own error on the console -
          # the dbadmin-browser job tests it against a relay of its own.
          case "$CONFIGURE" in
            *BUILD_ULTRADBADMIN=ON*)
              cp build-wasm/UltraDBAdmin.{html,js,wasm,data} wasm-demo/ ;;
          esac
          ls -l wasm-demo

      - name: Upload the pages
        uses: actions/upload-artifact@v6
        with:
          name: wasm-demo-${{ matrix.variant }}
          path: wasm-demo
          if-no-files-found: error

      # The pages opened in the runner's Google Chrome, headless, served by
      # serve.py as a visitor's host would serve them: each must present a
      # frame and keep a clean console. A page whose builder threw says
      # "Error creating example for ..." there and fails the job, which is
      # how the JPEG page's blank came to light (#845) - after the download.
      # The variant that builds a reduced catalogue (single-thread, without
      # libvips) skips the pages that catalogue does not register.
      # Playwright's package only; the browser is the runner's.
      - name: Smoke test the pages in Chrome
        env:
          SMOKE_CHANNEL: chrome
          SMOKE_OUT: smoke-${{ matrix.variant }}
          CONFIGURE: ${{ matrix.configure }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          pages="UltraCanvasDemo.html wasm-demo.html ultraos-frontpage.html
                 UltraCanvasDemo.html?component=svg
                 UltraCanvasDemo.html?component=piecharts"
          case "$CONFIGURE" in
            *ULTRACANVAS_WASM_THREADS=OFF*) ;;
            *) pages="$pages
                 UltraCanvasDemo.html?component=pngimages
                 UltraCanvasDemo.html?component=jpegimages
                 UltraCanvasDemo.html?component=tiffimages
                 UltraCanvasDemo.html?component=webpimages
                 UltraCanvasDemo.html?component=gifimages
                 UltraCanvasDemo.html?component=bmpimages" ;;
          esac
          # shellcheck disable=SC2086
          node UltraCanvas/OS/WASM/demo/smoke.mjs wasm-demo $pages

      - name: Upload the smoke screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wasm-smoke-${{ matrix.variant }}
          path: smoke-${{ matrix.variant }}
          if-no-files-found: ignore

      # The UltraWeb runtime (Docs/UltraWeb/UltraWebInTheBrowser.md): the
      # browser engine behind WasmHost under Node, then the sample site in
      # Chromium - without the extension (the runtime from the site, clicks,
      # timer, fetch, storage across a reload), and with it (the site sends
      # no runtime). Single-threaded only: that is the runtime that ships.
      # Playwright's Chromium, not the runner's Chrome: branded Chrome no
      # longer loads an unpacked extension from the command line (Chrome 137).
      - name: UltraWeb runtime in Chromium
        if: matrix.threads == 0
        env:
          UWR_OUT: uwr-${{ matrix.variant }}
        run: |
          node build-wasm/Apps/UltraWeb/browser/wasmhost-browser-test.js
          npx playwright install chromium
          node Apps/UltraWeb/browser/test/runtime-test.mjs build-wasm/Apps/UltraWeb/browser

      # The UltraCanvas runtime: the sample C++ app, a side module, in
      # Chromium without the extension (the runtime from the site) and with it
      # (the site sends only the page, the loader and the app). Its button,
      # checkbox and own element must answer real clicks.
      - name: UltraCanvas runtime in Chromium
        if: matrix.pic == 1
        env:
          UCR_OUT: ucr-${{ matrix.variant }}
        run: |
          npx playwright install chromium
          node UltraCanvas/OS/WASM/runtime/test/runtime-test.mjs build-wasm/UltraCanvas/OS/WASM/runtime

      # The UltraStore web store (Apps/UltraStore/web, Docs/UltraStore/WebstoreBrief.md):
      # the fixture site the admin backend published, with this build's
      # module, loader and runtime laid over it, in Chromium - the runtime
      # from the site (Discover paints, the catalog verifies in the browser,
      # an app page and a category open by address, the budgets hold), a
      # tampered catalog refused, and the runtime from the extension.
      - name: UltraStore web store in Chromium
        if: matrix.pic == 1
        env:
          UWS_OUT: uws-${{ matrix.variant }}
        run: node Apps/UltraStore/web/test/webstore-test.mjs build-wasm/Apps/UltraStore/web build-wasm/UltraCanvas/OS/WASM/runtime

      - name: Upload the UltraStore web store screenshots and logs
        if: always() && matrix.pic == 1
        uses: actions/upload-artifact@v6
        with:
          name: ultrastore-web-${{ matrix.variant }}
          path: uws-${{ matrix.variant }}
          if-no-files-found: ignore

      - name: Upload the UltraCanvas runtime screenshots and logs
        if: always() && matrix.pic == 1
        uses: actions/upload-artifact@v6
        with:
          name: ultracanvas-runtime-${{ matrix.variant }}
          path: ucr-${{ matrix.variant }}
          if-no-files-found: ignore

      - name: Upload the UltraWeb runtime screenshots and logs
        if: always() && matrix.threads == 0
        uses: actions/upload-artifact@v6
        with:
          name: ultraweb-runtime-${{ matrix.variant }}
          path: uwr-${{ matrix.variant }}
          if-no-files-found: ignore

  # UltraDBAdmin's page end to end (Tests/UltraDBAdmin/e2e/run_e2e.sh): the
  # baseline variant's UltraDBAdmin.html in the runner's Chrome against a real
  # ultradbadmin-relay built here natively, and a test OpenID provider. The
  # page signs in through the relay's OpenID Connect sign-in, browses a
  # SQLite table through it and runs a query the relay's statement time-out
  # stops; the relay's audit log is what each step is checked against. The
  # relay needs a native configure of the repository, so the UI library's
  # build dependencies are installed, though only the relay is built.
  dbadmin-browser:
    name: UltraDBAdmin in the browser (end to end)
    needs: wasm
    # The pages come from the baseline variant; an experimental variant's
    # failure does not hold this back.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Download the baseline pages
        uses: actions/download-artifact@v6
        with:
          name: wasm-demo-baseline
          path: pages

      # The packages the last run on main downloaded, as the Build workflow's
      # Linux rows keep theirs: on 2026-11-04 the Azure mirror served this
      # step at a few kilobytes per second and the 20 minutes it had ran out
      # on package 130 of the list, before anything was built or tested.
      # ci-apt.sh retries a download that stops dead, and waits out one that
      # trickles on purpose; with the .deb files restored, apt fetches only
      # what changed. The runner image differs from the Build rows' (24.04,
      # not 22.04), so the cache is this job's own.
      - name: Restore the apt package cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-dbadmin-browser-
          restore-keys: apt-debs-dbadmin-browser-

      - name: Put the cached packages in apt's cache
        run: scripts/ci-apt.sh cache-in "${{ runner.temp }}/apt-debs"

      - name: Install what the relay builds with
        # A mirror that crawls still finishes (15-27 min on a bad day, against
        # about 3 normally), as the Build rows allow; the job has 60.
        timeout-minutes: 45
        run: |
          scripts/ci-apt.sh update
          scripts/ci-apt.sh install --no-install-recommends \
            cmake ninja-build pkg-config build-essential \
            libcairo2-dev libpango1.0-dev libharfbuzz-dev libglib2.0-dev libtinyxml2-dev \
            libvips-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev libgtk-3-dev libfmt-dev \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev libsodium-dev
          # The runner's libcurl has no WebSockets, so UltraNet builds the
          # bundled curl (third_party/curl), which needs libpsl - as the
          # Build workflow's Linux rows install it.
          scripts/ci-apt.sh install --no-install-recommends libpsl-dev

      - name: Build the relay
        run: |
          cmake -B build-relay -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee relay-configure.log
          # The sign-in is what the test is for: a relay built without it fails here, not later.
          grep -q "ultradbadmin-relay sign-in (OpenID Connect) - ENABLED" relay-configure.log
          cmake --build build-relay --target ultradbadmin-relay --parallel "$(nproc)"

      - name: Sign in, browse and time out in Chrome
        env:
          E2E_CHANNEL: chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          Tests/UltraDBAdmin/e2e/run_e2e.sh build-relay/ultradbadmin-relay pages e2e-out

      - name: Upload the end-to-end screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dbadmin-browser-e2e
          path: e2e-out
          if-no-files-found: ignore

      - name: Keep the downloaded packages (main)
        if: github.ref == 'refs/heads/main'
        id: apt-keep
        run: echo "hash=$(scripts/ci-apt.sh cache-out "${{ runner.temp }}/apt-debs")" >> "$GITHUB_OUTPUT"

      - name: Save the apt package cache (main)
        if: github.ref == 'refs/heads/main' && steps.apt-keep.outputs.hash != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/apt-debs
