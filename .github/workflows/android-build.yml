name: Android build

# Builds the framework for Android against a real cross-compiled sysroot:
# scripts/android-bootstrap-sysroot.sh builds cairo, pango, glib, harfbuzz,
# fontconfig, freetype, tinyxml2, fmt and libvips (with its JPEG, PNG, WebP,
# TIFF, EXIF and colour management codecs) with vcpkg and the runner's NDK,
# and the core library is then compiled with the NDK's toolchain against them
# - libvips included, as on every platform - and so is the demo, linked into
# libUltraCanvasDemo.so and packaged with scripts/android-package-apk.sh into
# a debug-signed APK, uploaded as the run's UltraCanvasDemo-<abi> artifact.
# Two ABIs: arm64-v8a is what phones run, x86_64 what an emulator on a Linux
# host or a CI runner runs at full speed (AndroidOnLinuxInvestigation.md).
# The x86_64 APK is then installed on an emulator and must present a first
# frame with something drawn in it (the emulator job below). The Build
# workflow's "Android backend check" only syntax-checks OS/Android with host
# headers standing in; this is the build those headers stand in for.
#
# Runs on a pull request, and on a push to main, that touches what the
# Android build is made of (the paths below). The sysroot takes the better
# part of an hour to build from nothing; vcpkg's binary cache keeps every
# library it built, so a run on a warm cache only builds the framework. A
# manual dispatch from the Actions tab works against any branch.
#
# MobilePC (Apps/MobilePC: UltraDesktop and the applications it starts, on
# the framework's desktop mode) is built in the same job against the same
# sysroot, packaged as the run's MobilePC-<abi> artifact, and run by the
# emulator-mobilepc job with a simulated second display.
#
# The chatcube job builds ChatCube for Android the same way: the sysroot with
# its chatcube feature as well (UltraNet's OpenSSL, c-ares and curl, SQLite,
# libsodium, Opus - android-bootstrap-sysroot.sh --with-chatcube), the core
# with UltraNet and UltraDatabase on, libChatCube.so with the providers
# linked in, packaged with ChatCube's own manifest and assets
# (Apps/ChatCube/android/) into the ChatCube-<abi> artifact. It restores the
# demo job's vcpkg cache when it has none of its own: a package's archive is
# keyed by what it was built from, so only the libraries the demo lacks are
# built again.
#
# Also once a week on main, to keep that cache warm for everyone. A cache a
# pull request saves can be read by that pull request alone; only main's are
# shared. Main otherwise builds this only when the Android build itself
# changes, so most pull requests found nothing there and each rebuilt all 46
# libraries from source on its first run. The weekly run restores main's
# cache, which also keeps GitHub from evicting it after 7 days unused; when
# eviction has come first, the scheduled run pays for the cold build, not a
# pull request. It saves only what it built.

on:
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/android-bootstrap-sysroot.sh'
      - 'scripts/vcpkg_seed_gnu_sources.py'
      - 'scripts/android-package-apk.sh'
      - 'scripts/strip_method_parameters.py'
      - 'scripts/android-emulator-smoke.sh'
      - 'scripts/android-mobilepc-smoke.sh'
      - 'UltraCanvas/OS/Android/**'
      - 'UltraCanvas/core/UltraCanvasEmbedded*'
      - 'UltraCanvas/core/UltraCanvasHostedApps.cpp'
      - 'UltraCanvas/core/UltraCanvasDesktopShell.cpp'
      - 'Apps/DemoApp/**'
      - 'Apps/ChatCube/**'
      - 'Apps/MobilePC/**'
      - 'Apps/UltraDesktop/**'
      - 'Apps/Texter/**'
      - 'Apps/UltraViewer/**'
      - 'Apps/UltraPaint/**'
      - 'Apps/ArtCreator/**'
      - 'MacOS/deps/ports/libvips/**'
      - 'CMakeLists.txt'
      - 'UltraCanvas/CMakeLists.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/android-bootstrap-sysroot.sh'
      - 'scripts/vcpkg_seed_gnu_sources.py'
      - 'scripts/android-package-apk.sh'
      - 'scripts/strip_method_parameters.py'
      - 'scripts/android-emulator-smoke.sh'
      - 'scripts/android-mobilepc-smoke.sh'
      - 'UltraCanvas/OS/Android/**'
      - 'UltraCanvas/core/UltraCanvasEmbedded*'
      - 'UltraCanvas/core/UltraCanvasHostedApps.cpp'
      - 'UltraCanvas/core/UltraCanvasDesktopShell.cpp'
      - 'Apps/DemoApp/**'
      - 'Apps/ChatCube/**'
      - 'Apps/MobilePC/**'
      - 'Apps/UltraDesktop/**'
      - 'Apps/Texter/**'
      - 'Apps/UltraViewer/**'
      - 'Apps/UltraPaint/**'
      - 'Apps/ArtCreator/**'
      - 'MacOS/deps/ports/libvips/**'
      - 'CMakeLists.txt'
      - 'UltraCanvas/CMakeLists.txt'
  workflow_dispatch:
  # Mondays 03:17 UTC: off the hour, when GitHub's scheduler is least
  # crowded. A schedule always runs on the default branch.
  schedule:
    - cron: '17 3 * * 1'

# A newer push cancels a pull request's run in progress; on main nothing is
# cancelled, so the weekly run and a push's run each finish (as build.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    name: android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      # One ABI failing says nothing about the other; let both finish.
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
          - abi: x86_64
            triplet: x64-android
    env:
      ABI: ${{ matrix.abi }}
      TRIPLET: ${{ matrix.triplet }}
      VCPKG_CACHE: ${{ github.workspace }}/.vcpkg/binary-cache
      # Where vcpkg keeps the source archives and patches it fetched (it
      # honours VCPKG_DOWNLOADS over its own downloads/ folder).
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg/downloads
    steps:
      - uses: actions/checkout@v5

      # The packages and package lists of the last run on main, as build.yml's
      # Linux rows keep them (scripts/ci-apt.sh cache-in): fetched only when
      # changed, and an `apt-get update` that cannot reach the mirror goes on
      # with these lists, so the packages install from the cache.
      - name: Restore the apt package cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-android-host-ubuntu-24.04-
          restore-keys: apt-debs-android-host-ubuntu-24.04-

      - name: Put the cached packages in apt's cache
        run: scripts/ci-apt.sh cache-in "${{ runner.temp }}/apt-debs"

      # What vcpkg's ports build with on a Linux host besides the compilers
      # (the NDK's) and cmake / ninja / meson (vcpkg fetches its own):
      # autotools for gettext, libiconv and libffi, gperf for fontconfig,
      # bison and flex for the odd generator. ImageMagick: the APK's launcher
      # icons, sized from media/appicon/Demo.png (android-package-apk.sh).
      - name: Install host tools
        # A crawling mirror still finishes (15-27 min on a bad day, against a
        # few normally), as the Build rows allow; scripts/ci-apt.sh retries
        # one that stops dead. The job has 180.
        timeout-minutes: 45
        run: |
          scripts/ci-apt.sh update
          scripts/ci-apt.sh install --no-install-recommends \
            autoconf autoconf-archive automake libtool gperf bison flex \
            pkg-config python3 python3-venv curl zip unzip tar git imagemagick

      - name: Keep the downloaded packages (main)
        if: github.ref == 'refs/heads/main'
        id: apt-keep
        run: echo "hash=$(scripts/ci-apt.sh cache-out "${{ runner.temp }}/apt-debs")" >> "$GITHUB_OUTPUT"

      - name: Save the apt package cache (main)
        if: github.ref == 'refs/heads/main' && steps.apt-keep.outputs.hash != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-android-host-ubuntu-24.04-${{ steps.apt-keep.outputs.hash }}

      # vcpkg's binary cache: each library it built, as one archive per
      # package. Keyed by the manifest, the libvips overlay and the script
      # (which pins the vcpkg commit), and `restore-keys` falls back to the
      # newest cache. Saved only when the run built something - a failed run
      # too, so the libraries it did build are kept - because a cache saved
      # by every run regardless (about 350 MB each) is what pushes the
      # repository past its cache quota, and GitHub then evicts the oldest
      # entries, this one included: on 2026-10-20 a run on a PR found none of
      # the cache an earlier run of the same PR had saved two hours before and
      # rebuilt all 46 packages. The key carries the run attempt: a key can be
      # written once, so a re-run that finished what the first attempt could
      # not would otherwise be refused its save and the half-built set kept.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: android-vcpkg-${{ env.TRIPLET }}-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-vcpkg-${{ env.TRIPLET }}-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-
            android-vcpkg-${{ env.TRIPLET }}-

      # vcpkg's downloads: the source archives and patches a port fetches
      # before it builds. The binary cache above makes a rebuild rare, but
      # any port it misses is rebuilt from source - and its sources then come
      # from the internet again. On 2026-10-20 fmt's backport patch got HTTP
      # 503 from github.com three times and failed the whole job before a
      # line of the framework was compiled. vcpkg checks every file it finds
      # here against the SHA512 in its port, so a stale entry is harmless:
      # it is fetched again. Saved, like the binary cache, only when a run
      # added something, under a key that names the triplet: the two ABI jobs
      # run at once and a key can be written once, so a shared one would keep
      # only the first job's. Either restores the other's (restore-keys).
      #
      # The `path` here must be the save step's, line for line: actions/cache
      # files a cache under a version made from its paths, and a restore
      # with any other list - even the folder alone - finds nothing. The
      # first cut had the exclusions only on the save, and its 316 MB were
      # never found again.
      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            !${{ env.VCPKG_DOWNLOADS }}/tools
            !${{ env.VCPKG_DOWNLOADS }}/temp
          key: android-vcpkg-downloads-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-${{ env.TRIPLET }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-vcpkg-downloads-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-
            android-vcpkg-downloads-

      # What the two caches held when restored, as a hash of their file names
      # and sizes; the same listing after the build tells whether a save would
      # store anything new. Downloads: the archives at the top level only -
      # downloads/tools holds tools vcpkg unpacked, fetched once and cheaply.
      - name: List the restored caches
        id: caches-before
        run: |
          mkdir -p "$VCPKG_CACHE" "$VCPKG_DOWNLOADS"
          echo "binary=$(find "$VCPKG_CACHE" -type f -printf '%P %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "downloads=$(find "$VCPKG_DOWNLOADS" -maxdepth 1 -type f -printf '%f %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The runner's NDK (ANDROID_NDK_LATEST_HOME, preinstalled on GitHub's
      # Ubuntu images).
      - name: Build the sysroot
        timeout-minutes: 120
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # Outside the workspace: CMake refuses to export a link directory
          # from inside the source tree, and the core library exports the
          # sysroot's.
          export UC_ANDROID_SYSROOT="$RUNNER_TEMP/android-sysroot"
          mkdir -p "$VCPKG_CACHE"
          export VCPKG_BINARY_SOURCES="clear;files,$VCPKG_CACHE,readwrite"
          scripts/android-bootstrap-sysroot.sh "$ABI"

      - name: List the caches after the build
        id: caches-after
        if: always()
        run: |
          mkdir -p "$VCPKG_CACHE" "$VCPKG_DOWNLOADS"
          echo "binary=$(find "$VCPKG_CACHE" -type f -printf '%P %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "downloads=$(find "$VCPKG_DOWNLOADS" -maxdepth 1 -type f -printf '%f %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg binary cache
        if: always() && steps.caches-after.outputs.binary != steps.caches-before.outputs.binary
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: android-vcpkg-${{ env.TRIPLET }}-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save vcpkg downloads
        if: always() && steps.caches-after.outputs.downloads != steps.caches-before.outputs.downloads
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            !${{ env.VCPKG_DOWNLOADS }}/tools
            !${{ env.VCPKG_DOWNLOADS }}/temp
          key: android-vcpkg-downloads-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-${{ env.TRIPLET }}-${{ github.run_id }}-${{ github.run_attempt }}

      # What vcpkg's logs say when a port fails: the build trees hold them.
      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-vcpkg-logs-${{ matrix.abi }}
          path: |
            .vcpkg/vcpkg/buildtrees/*/*.log
          if-no-files-found: ignore

      # The command the script prints (plus --error-limit=0, so a link that
      # fails lists every undefined symbol, not lld's first 20): the NDK's
      # toolchain file, the sysroot
      # as pkg-config's only search path and as CMake's find root, static
      # pkg-config link lists (vcpkg's Android triplets build static
      # libraries).
      - name: Configure
        run: |
          sysroot="$RUNNER_TEMP/android-sysroot/$TRIPLET"
          export PKG_CONFIG_LIBDIR="$sysroot/lib/pkgconfig:$sysroot/share/pkgconfig"
          cmake -G Ninja -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_FIND_ROOT_PATH="$sysroot" \
            -DPKG_CONFIG_ARGN=--static \
            -DCMAKE_SHARED_LINKER_FLAGS=-Wl,--error-limit=0 \
            -DCMAKE_BUILD_TYPE=Release

      # -k 0: past a failing source, so one run lists every one (the core
      # was never compiled for Android before this workflow).
      - name: Build the core library
        run: |
          sysroot="$RUNNER_TEMP/android-sysroot/$TRIPLET"
          export PKG_CONFIG_LIBDIR="$sysroot/lib/pkgconfig:$sysroot/share/pkgconfig"
          cmake --build build-android --target UltraCanvas --parallel "$(nproc)" -- -k 0

      # The app library an APK carries: DemoApp's main() as
      # ultracanvas_app_main(), linked against the static core. The NDK links
      # shared libraries with --no-undefined, so this is where a dependency
      # missing from the sysroot's link lists shows, which the static core
      # cannot show.
      - name: Build the demo app library
        run: |
          sysroot="$RUNNER_TEMP/android-sysroot/$TRIPLET"
          export PKG_CONFIG_LIBDIR="$sysroot/lib/pkgconfig:$sysroot/share/pkgconfig"
          cmake --build build-android --target UltraCanvasDemo --parallel "$(nproc)" -- -k 0

      # What is called into the library from outside, by name: NativeActivity
      # looks up ANativeActivity_onCreate, and each native method of
      # UltraCanvasActivity resolves to a Java_* function. A static core hands
      # the link only the objects something references, so each must be in
      # the library's dynamic symbol table - one missing is an app that shows
      # nothing, or one that crashes on its first keystroke.
      - name: Check the demo library's entry points
        run: |
          lib="$(find build-android -name libUltraCanvasDemo.so -print -quit)"
          if [ -z "$lib" ]; then
            echo "::error::libUltraCanvasDemo.so was not built"
            exit 1
          fi
          readelf="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          exported="$("$readelf" --dyn-syms --wide "$lib" | awk '$7 != "UND" {print $8}')"
          missing=0
          for sym in ANativeActivity_onCreate $(grep -ho 'Java_org_ultraos_[A-Za-z0-9_]*(' UltraCanvas/OS/Android/*.cpp | tr -d '(' | sort -u); do
            if grep -qx "$sym" <<<"$exported"; then
              echo "exported: $sym"
            else
              echo "::error::$lib does not export $sym"
              missing=1
            fi
          done
          ls -l "$lib"
          exit "$missing"

      # The installable app: the library stripped, UltraCanvasActivity as
      # dex, the manifest from packaging/, the demo's assets, a debug
      # signature. The script verifies the signature and prints what a device
      # reads from the package (name, SDK levels, native code).
      - name: Package the demo APK
        run: |
          scripts/android-package-apk.sh --abi "$ABI" \
            --lib build-android/lib/libUltraCanvasDemo.so \
            --out "apk/UltraCanvasDemo-$ABI.apk" \
            --ndk "$ANDROID_NDK_LATEST_HOME"

      - name: Upload the demo APK
        uses: actions/upload-artifact@v6
        with:
          name: UltraCanvasDemo-${{ matrix.abi }}
          path: apk/UltraCanvasDemo-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 14

      # MobilePC: UltraDesktop, Texter, UltraViewer, UltraPaint and ArtCreator in one
      # app library on the desktop mode, against the same sysroot.
      - name: Build the MobilePC app library
        run: |
          sysroot="$RUNNER_TEMP/android-sysroot/$TRIPLET"
          export PKG_CONFIG_LIBDIR="$sysroot/lib/pkgconfig:$sysroot/share/pkgconfig"
          cmake --build build-android --target MobilePC --parallel "$(nproc)" -- -k 0

      # As the demo's: the activity's entry point and every native method.
      - name: Check the MobilePC library's entry points
        run: |
          lib="$(find build-android -name libMobilePC.so -print -quit)"
          if [ -z "$lib" ]; then
            echo "::error::libMobilePC.so was not built"
            exit 1
          fi
          readelf="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          exported="$("$readelf" --dyn-syms --wide "$lib" | awk '$7 != "UND" {print $8}')"
          missing=0
          for sym in ANativeActivity_onCreate $(grep -ho 'Java_org_ultraos_[A-Za-z0-9_]*(' UltraCanvas/OS/Android/*.cpp | tr -d '(' | sort -u); do
            if ! grep -qx "$sym" <<<"$exported"; then
              echo "::error::$lib does not export $sym"
              missing=1
            fi
          done
          ls -l "$lib"
          exit "$missing"

      # Its own manifest, assets and icon, and its own version (line 1 of
      # Docs/MobilePC/CHANGELOG.md).
      - name: Package the MobilePC APK
        run: |
          version="$(sed -n '1s/^#### [0-9-]* \*\([0-9.]*\)\*.*/\1/p' Docs/MobilePC/CHANGELOG.md)"
          scripts/android-package-apk.sh --abi "$ABI" \
            --lib build-android/lib/libMobilePC.so \
            --out "apk/MobilePC-$ABI.apk" \
            --ndk "$ANDROID_NDK_LATEST_HOME" \
            --manifest Apps/MobilePC/android/AndroidManifest.xml \
            --assets Apps/MobilePC/android/assets.txt \
            --icon media/appicon/MobilePC.png \
            --version-name "$version"

      - name: Upload the MobilePC APK
        uses: actions/upload-artifact@v6
        with:
          name: MobilePC-${{ matrix.abi }}
          path: apk/MobilePC-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the CMake logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-cmake-logs-${{ matrix.abi }}
          path: |
            build-android/CMakeFiles/CMakeOutput.log
            build-android/CMakeFiles/CMakeError.log
            build-android/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  # ChatCube for Android: as the demo above, with the sysroot's chatcube
  # feature and ChatCube's library, manifest and assets.
  chatcube:
    name: android chatcube (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
          - abi: x86_64
            triplet: x64-android
    env:
      ABI: ${{ matrix.abi }}
      TRIPLET: ${{ matrix.triplet }}
      VCPKG_CACHE: ${{ github.workspace }}/.vcpkg/binary-cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg/downloads
    steps:
      - uses: actions/checkout@v5

      - name: Restore the apt package cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-android-host-ubuntu-24.04-
          restore-keys: apt-debs-android-host-ubuntu-24.04-

      - name: Put the cached packages in apt's cache
        run: scripts/ci-apt.sh cache-in "${{ runner.temp }}/apt-debs"

      # As the demo job's, plus perl for OpenSSL's configure.
      - name: Install host tools
        timeout-minutes: 45
        run: |
          scripts/ci-apt.sh update
          scripts/ci-apt.sh install --no-install-recommends \
            autoconf autoconf-archive automake libtool gperf bison flex \
            pkg-config python3 python3-venv curl zip unzip tar git imagemagick perl

      # Its own cache, falling back to the demo job's (see the top).
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: android-vcpkg-chatcube-${{ env.TRIPLET }}-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-vcpkg-chatcube-${{ env.TRIPLET }}-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-
            android-vcpkg-chatcube-${{ env.TRIPLET }}-
            android-vcpkg-${{ env.TRIPLET }}-

      - name: Restore vcpkg downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            !${{ env.VCPKG_DOWNLOADS }}/tools
            !${{ env.VCPKG_DOWNLOADS }}/temp
          key: android-vcpkg-chatcube-downloads-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-${{ env.TRIPLET }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-vcpkg-chatcube-downloads-
            android-vcpkg-downloads-

      - name: List the restored caches
        id: caches-before
        run: |
          mkdir -p "$VCPKG_CACHE" "$VCPKG_DOWNLOADS"
          echo "binary=$(find "$VCPKG_CACHE" -type f -printf '%P %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "downloads=$(find "$VCPKG_DOWNLOADS" -maxdepth 1 -type f -printf '%f %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build the sysroot (with ChatCube's libraries)
        timeout-minutes: 120
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export UC_ANDROID_SYSROOT="$RUNNER_TEMP/android-sysroot"
          mkdir -p "$VCPKG_CACHE"
          export VCPKG_BINARY_SOURCES="clear;files,$VCPKG_CACHE,readwrite"
          scripts/android-bootstrap-sysroot.sh --with-chatcube "$ABI"

      - name: List the caches after the build
        id: caches-after
        if: always()
        run: |
          mkdir -p "$VCPKG_CACHE" "$VCPKG_DOWNLOADS"
          echo "binary=$(find "$VCPKG_CACHE" -type f -printf '%P %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "downloads=$(find "$VCPKG_DOWNLOADS" -maxdepth 1 -type f -printf '%f %s\n' | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg binary cache
        if: always() && steps.caches-after.outputs.binary != steps.caches-before.outputs.binary
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: android-vcpkg-chatcube-${{ env.TRIPLET }}-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save vcpkg downloads
        if: always() && steps.caches-after.outputs.downloads != steps.caches-before.outputs.downloads
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            !${{ env.VCPKG_DOWNLOADS }}/tools
            !${{ env.VCPKG_DOWNLOADS }}/temp
          key: android-vcpkg-chatcube-downloads-${{ hashFiles('UltraCanvas/OS/Android/packaging/vcpkg*.json', 'MacOS/deps/ports/libvips/**', 'scripts/android-bootstrap-sysroot.sh') }}-${{ env.TRIPLET }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-chatcube-vcpkg-logs-${{ matrix.abi }}
          path: |
            .vcpkg/vcpkg/buildtrees/*/*.log
          if-no-files-found: ignore

      # The demo job's configure, with UltraNet and UltraDatabase on: what
      # ChatCube and its providers are built on.
      - name: Configure
        run: |
          sysroot="$RUNNER_TEMP/android-sysroot/$TRIPLET"
          export PKG_CONFIG_LIBDIR="$sysroot/lib/pkgconfig:$sysroot/share/pkgconfig"
          cmake -G Ninja -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_FIND_ROOT_PATH="$sysroot" \
            -DPKG_CONFIG_ARGN=--static \
            -DCMAKE_SHARED_LINKER_FLAGS=-Wl,--error-limit=0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DULTRACANVAS_ENABLE_NET=ON \
            -DULTRACANVAS_ENABLE_DATABASE=ON

      # -k 0: every failing source in one run.
      - name: Build the ChatCube app library
        run: |
          sysroot="$RUNNER_TEMP/android-sysroot/$TRIPLET"
          export PKG_CONFIG_LIBDIR="$sysroot/lib/pkgconfig:$sysroot/share/pkgconfig"
          cmake --build build-android --target ChatCube --parallel "$(nproc)" -- -k 0

      # As the demo's check, and ChatCube's providers must be in it: a
      # provider the configure left out shows here, not on a phone.
      - name: Check the ChatCube library
        run: |
          lib="$(find build-android -name libChatCube.so -print -quit)"
          if [ -z "$lib" ]; then
            echo "::error::libChatCube.so was not built"
            exit 1
          fi
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          exported="$("$bin/llvm-readelf" --dyn-syms --wide "$lib" | awk '$7 != "UND" {print $8}')"
          missing=0
          for sym in ANativeActivity_onCreate $(grep -ho 'Java_org_ultraos_[A-Za-z0-9_]*(' UltraCanvas/OS/Android/*.cpp | tr -d '(' | sort -u); do
            if grep -qx "$sym" <<<"$exported"; then
              echo "exported: $sym"
            else
              echo "::error::$lib does not export $sym"
              missing=1
            fi
          done
          symbols="$("$bin/llvm-nm" -C --defined-only "$lib" 2>/dev/null || true)"
          for provider in UltraIMDirect::DirectProvider UltraIMMatrix::MatrixProvider; do
            if grep -q "$provider::" <<<"$symbols"; then
              echo "linked in: $provider"
            else
              echo "::error::$lib has no $provider"
              missing=1
            fi
          done
          ls -l "$lib"
          exit "$missing"

      - name: Package the ChatCube APK
        run: |
          version="$(head -1 Docs/ChatCube/CHANGELOG.md | grep -o '\*[0-9][0-9.]*\*' | tr -d '*')"
          scripts/android-package-apk.sh --abi "$ABI" \
            --lib build-android/lib/libChatCube.so \
            --out "apk/ChatCube-$ABI.apk" \
            --ndk "$ANDROID_NDK_LATEST_HOME" \
            --manifest Apps/ChatCube/android/AndroidManifest.xml \
            --assets Apps/ChatCube/android/assets.txt \
            --icon media/appicon/ChatCube.png \
            --version-name "$version"

      - name: Upload the ChatCube APK
        uses: actions/upload-artifact@v6
        with:
          name: ChatCube-${{ matrix.abi }}
          path: apk/ChatCube-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the CMake logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-chatcube-cmake-logs-${{ matrix.abi }}
          path: |
            build-android/CMakeFiles/CMakeOutput.log
            build-android/CMakeFiles/CMakeError.log
            build-android/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  # The demo, run: the x86_64 APK installed on an API 30 emulator on the
  # runner's KVM, started, and required to present a first frame with content
  # (scripts/android-emulator-smoke.sh, which waits for the window backend's
  # "first frame presented" logcat line). It fails when the app dies first,
  # draws nothing, or shows nothing in four minutes. The screenshot and the
  # logcat are kept whatever the outcome. arm64 is not run: GitHub's arm64
  # runners have no KVM, and emulating the whole CPU is too slow for a UI.
  #
  # Two displays. The emulator's default (320x640 at 160 dpi, scale 1) and a
  # phone's (the pixel_6 profile: 1080x2400 at 420 dpi, scale 2.625), where
  # the smoke test's density checks have something to catch: the frame must
  # fill the window to the pixel, at the scale the density gives. At 2.625
  # a logical size scaled back up loses a pixel (1080 -> 411 -> 1079), so a
  # backend that builds its surface that way fails here and not at 160 dpi.
  emulator:
    name: android emulator (${{ matrix.label }})
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            profile: ''
            artifact: android-emulator-smoke
          - label: x86_64, 420 dpi
            profile: pixel_6
            artifact: android-emulator-smoke-420dpi
    steps:
      - uses: actions/checkout@v5

      - name: Download the x86_64 APK
        uses: actions/download-artifact@v6
        with:
          name: UltraCanvasDemo-x86_64
          path: apk

      # The runner has /dev/kvm, readable only by its group; the emulator
      # without KVM is the whole-CPU emulation the x86_64 build exists to avoid.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 30 sits between the minSdk (28) and the targetSdk (34). The
      # backend draws into the window buffer on the CPU, so SwiftShader's
      # GL is only there for the system UI.
      - name: Run the demo on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: scripts/android-emulator-smoke.sh apk/UltraCanvasDemo-x86_64.apk emulator-smoke

      - name: Upload the screenshot and logcat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: emulator-smoke/
          if-no-files-found: ignore
          retention-days: 14

  # MobilePC on the emulator with a second display: the desktop must be drawn
  # there, UltraPaint must start on it, and the desktop must come back to the
  # phone's screen when the display goes (scripts/android-mobilepc-smoke.sh).
  # It needs only the x86_64 APK: an arm64 leg that failed (a vcpkg mirror
  # timing out on a source download) must not keep it from running, and the
  # download step below fails it when the x86_64 leg built no APK.
  emulator-mobilepc:
    name: android emulator (MobilePC, second display)
    needs: android
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Download the x86_64 MobilePC APK
        uses: actions/download-artifact@v6
        with:
          name: MobilePC-x86_64
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run MobilePC on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: scripts/android-mobilepc-smoke.sh apk/MobilePC-x86_64.apk mobilepc-smoke

      - name: Upload the screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-mobilepc-smoke
          path: mobilepc-smoke/
          if-no-files-found: ignore
          retention-days: 14
