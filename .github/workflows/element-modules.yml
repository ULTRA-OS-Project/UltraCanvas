# The selectable widgets and charts as runtime modules (element plugin
# system: ULTRACANVAS_WIDGETS, ULTRACANVAS_CHARTS - "Widgets as runtime
# modules" in Docs/UltraCanvas/UltraCanvasElementPlugins.md). build.yml's
# rows compile every widget into the core, so the module form - each widget
# as ultracanvas-widget-<name>, the parallel coordinate chart as
# ultracanvas-chart-parallel-coordinate - was never built in CI. Two faults
# went unseen that way: the chart modules carried no framework headers id and
# the loader refused every one, and a widget module that needs a core object
# its host does not link fails at dlopen.
#
# This row configures the lean build (no widget and no selectable chart
# compiled in, so the applications that use them by their classes are off),
# builds the core, the modules and the tests that change with the selection,
# and runs them: ElementModulesTest loads every module into a static host
# and creates its element by name. It also checks that the configure refuses
# an application that needs a widget left out.
name: Element modules

on:
  push:
    branches: [main]
    paths:
      - 'UltraCanvas/**'
      - 'Tests/ElementModulesTest.cpp'
      - 'Tests/UltraCanvasThemeTest.cpp'
      - 'Tests/VectorEditTest.cpp'
      - 'Tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/element-modules.yml'
  pull_request:
    paths:
      - 'UltraCanvas/**'
      - 'Tests/ElementModulesTest.cpp'
      - 'Tests/UltraCanvasThemeTest.cpp'
      - 'Tests/VectorEditTest.cpp'
      - 'Tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/element-modules.yml'
  workflow_dispatch:

concurrency:
  group: element-modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    # Both cores: the shipping one (shared - every module links
    # libUltraCanvas, and the MediaViewer module exists only here) and a
    # static one (the modules resolve the core from the host, through the
    # anchors UltraCanvas_RegisterSelectedWidgets keeps).
    strategy:
      fail-fast: false
      matrix:
        core: [static, shared]
    name: element modules (ubuntu-24.04, ${{ matrix.core }} core)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # ccache as the other Linux rows keep it, small enough not to evict
      # their caches.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The packages and package lists of the last run on main, as build.yml's
      # and wayland-build.yml's Linux rows keep them (scripts/ci-apt.sh
      # cache-in): fetched only when changed, and an `apt-get update` that
      # cannot reach the mirror goes on with these lists. Without them this
      # step downloaded every package on every run, and on 2026-11-18 a mirror
      # serving 64 kB/s ran it out of its 45 minutes (#1323). Both rows install
      # the same set on the same image, so they share one cache; until main
      # has saved one, wayland-build's - the same image - covers part of it.
      - name: Restore the apt package cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-element-modules-ubuntu-24.04-
          restore-keys: |
            apt-debs-element-modules-ubuntu-24.04-
            apt-debs-wayland-ubuntu-24.04-

      - name: Put the cached packages in apt's cache
        run: scripts/ci-apt.sh cache-in "${{ runner.temp }}/apt-debs"

      - name: Install dependencies
        timeout-minutes: 45
        run: |
          scripts/ci-apt.sh update
          scripts/ci-apt.sh install cmake ninja-build pkg-config build-essential ccache
          # The framework's libraries, as wayland-build.yml installs them on
          # this image (build.yml's 22.04 rows build some from source).
          scripts/ci-apt.sh install libcairo2-dev libpango1.0-dev libharfbuzz-dev
          scripts/ci-apt.sh install libvips-dev libglib2.0-dev libfreetype6-dev dbus dbus-daemon
          scripts/ci-apt.sh install libheif-dev libheif-plugin-libde265 libheif-plugin-aomdec libjxl-dev
          scripts/ci-apt.sh install libtinyxml2-dev libfmt-dev
          scripts/ci-apt.sh install libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
          scripts/ci-apt.sh install libcdr-dev librevenge-dev zlib1g-dev
          scripts/ci-apt.sh install libboost-dev liblcms2-dev libicu-dev
          scripts/ci-apt.sh install libzbar-dev libhunspell-dev hunspell-en-us
          scripts/ci-apt.sh install libudev-dev libcups2-dev libsane-dev
          scripts/ci-apt.sh install libpaho-mqtt-dev librabbitmq-dev libcoap3-dev libsnmp-dev libssh-dev
          scripts/ci-apt.sh install libavahi-client-dev
          scripts/ci-apt.sh install libmupdf-dev libjbig2dec0-dev libmujs-dev libgumbo-dev libopenjp2-7-dev libjpeg-dev
          scripts/ci-apt.sh install freerdp3-dev
          scripts/ci-apt.sh install libcurl4-openssl-dev libpsl-dev libssh2-1-dev libssl-dev
          scripts/ci-apt.sh install libgpgme-dev gnupg libsodium-dev libunwind-dev libarchive-dev
          scripts/ci-apt.sh install libsqlite3-dev libpq-dev libmariadb-dev
          scripts/ci-apt.sh install libaom-dev libdav1d-dev libde265-dev libbrotli-dev
          scripts/ci-apt.sh install libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          scripts/ci-apt.sh install libflac-dev libogg-dev libopus-dev libopusfile-dev libvorbis-dev libmp3lame-dev
          scripts/ci-apt.sh install libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libswscale-dev

      # After the job's last apt install. Saved by main alone, as ccache is,
      # and by one row: the two rows' caches are the same files, and two jobs
      # saving one key race for it.
      - name: Keep the downloaded packages (main)
        if: github.ref == 'refs/heads/main' && matrix.core == 'static'
        id: apt-keep
        run: echo "hash=$(scripts/ci-apt.sh cache-out "${{ runner.temp }}/apt-debs")" >> "$GITHUB_OUTPUT"

      - name: Save the apt package cache (main)
        if: github.ref == 'refs/heads/main' && matrix.core == 'static' && steps.apt-keep.outputs.hash != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-element-modules-ubuntu-24.04-${{ steps.apt-keep.outputs.hash }}

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-element-modules-${{ matrix.core }}-ubuntu-24.04-${{ github.run_id }}
          restore-keys: |
            ccache-element-modules-${{ matrix.core }}-ubuntu-24.04-

      # A configure that keeps an application whose widgets are left out
      # must stop and name them (ultracanvas_require_widgets).
      - name: The configure refuses an application without its widgets
        run: |
          set -uo pipefail
          # MediaViewer stays compiled in, so the static core this makes has
          # every widget in one form or the other (the step below).
          if cmake -B build-refused -G Ninja \
               -DULTRACANVAS_WIDGETS=MediaViewer -DBUILD_ARTCREATOR_APP=ON \
               -DBUILD_ULTRAVIDEO=OFF -DBUILD_DEMO_APP=OFF -DBUILD_ULTRAPAINT_APP=OFF \
               > refused.log 2>&1; then
            echo "::error::the configure accepted ArtCreator with ColorPaletteManager and VectorCanvas left out"
            exit 1
          fi
          grep -q "ArtCreator needs ColorPaletteManager, VectorCanvas compiled into the core" refused.log
          rm -rf build-refused

      # A widget left out must exist as a module: a static core cannot have
      # MediaViewer's, so leaving it out there stops the configure.
      - name: The configure refuses a widget it could build in no form
        run: |
          set -uo pipefail
          if cmake -B build-nowhere -G Ninja \
               -DULTRACANVAS_BUILD_SHARED=OFF -DULTRACANVAS_WIDGETS= \
               -DBUILD_ULTRAVIDEO=OFF -DBUILD_DEMO_APP=OFF -DBUILD_ULTRAPAINT_APP=OFF \
               -DBUILD_ARTCREATOR_APP=OFF \
               > nowhere.log 2>&1; then
            echo "::error::the configure accepted MediaViewer with neither a module nor a place in the core"
            exit 1
          fi
          grep -q "MediaViewer would be neither compiled in nor built as a" nowhere.log
          rm -rf build-nowhere

      # Every widget and chart as a module - but MediaViewer's, built against
      # a shared core only, is compiled in on the static row.
      - name: Configure CMake (the widgets and charts as modules)
        run: |
          set -euo pipefail
          if [ "${{ matrix.core }}" = shared ]; then
            widgets=""
            expected="Widgets: compiled in \[\], modules \[VideoTimeline;Slideshow;Album;ColorPaletteManager;VectorCanvas;MediaViewer\]"
          else
            widgets="MediaViewer"
            expected="Widgets: compiled in \[MediaViewer\], modules \[VideoTimeline;Slideshow;Album;ColorPaletteManager;VectorCanvas\]"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=ON \
            -DULTRACANVAS_BUILD_SHARED=${{ matrix.core == 'shared' && 'ON' || 'OFF' }} \
            -DULTRACANVAS_WIDGETS="$widgets" \
            -DULTRACANVAS_CHARTS= \
            -DBUILD_ULTRAVIDEO=OFF \
            -DBUILD_DEMO_APP=OFF \
            -DBUILD_ULTRAPAINT_APP=OFF \
            -DBUILD_ARTCREATOR_APP=OFF \
            -DBUILD_ULTRAFILER_APP=OFF \
            -DBUILD_ULTRAVIEWER_APP=OFF \
            -DBUILD_ULTRAMAIL=OFF \
            -DBUILD_EMAILCLEANER=OFF \
            -DBUILD_CHATCUBE=OFF \
            -DBUILD_ULTRACLIPBOARD=OFF \
            -DBUILD_ULTRASNIP=OFF 2>&1 | tee configure.log
          grep -q "$expected" configure.log
          grep -q "Charts: compiled in \[\], modules \[ParallelCoordinate\]" configure.log

      - name: Build the core, the modules and the tests
        run: |
          ccache -z
          cmake --build build --target ElementModulesTest UltraCanvasThemeTest VectorEditTest -j"$(nproc)"
          ccache -s
          ls -la build/Plugins/Elements
          # The viewer's module is built against a shared core only; the
          # static row has it compiled in.
          if [ "${{ matrix.core }}" = shared ]; then
            test -f build/Plugins/Elements/ultracanvas-widget-media-viewer.so
          else
            test ! -e build/Plugins/Elements/ultracanvas-widget-media-viewer.so
          fi

      # A module archive with a static core has to carry its own dependencies:
      # the module's public name resolves to that archive alone, so a symbol it
      # forgot to ask for has to come from somewhere. In an ordinary build it
      # does - every application links several archives at once and they cover
      # for each other - and the gap shows only in a program whose link line is
      # short enough to miss it. uc-net had never named the UltraCanvasTextUtils
      # archive whose Trim() and Base64Encode() its UltraNetMime objects call,
      # and ultradbadmin-relay (UltraDatabase, UltraVault, UltraNet, UltraCrypt,
      # no core) failed to link months later, on a clean build (#1265). Each
      # probe is an empty main with one archive forced in whole and nothing else
      # of UltraCanvas on the line, so every object's undefined symbols must
      # resolve from that archive's own declared dependencies. Linking is the
      # whole test; the programs are never run. Static row only - a shared core
      # is deliberately the single home of its absorbed archives' symbols, so
      # there the question does not apply (see the CMakeLists comment).
      - name: Every module archive links on its own
        if: matrix.core == 'static'
        run: |
          set -euo pipefail
          cmake --build build --target ultracanvas-module-link-probes -j"$(nproc)"
          ls build/link-probes
          # A guard that probed nothing would pass in silence, so insist on
          # the archive this started with and on a plausible number of them.
          test -x build/link-probes/uc-link-probe-uc-net
          test "$(ls build/link-probes | wc -l)" -ge 8

      - name: Save ccache (main)
        if: always() && github.ref == 'refs/heads/main' && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Run the tests
        working-directory: build
        run: ctest --output-on-failure --no-tests=error -R "^(ElementModulesTest|UltraCanvasThemeTest|VectorEditTest)$"
