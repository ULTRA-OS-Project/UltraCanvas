# Checks that every window test runs on a display in CI and fails there
# rather than skip (scripts/check_window_tests.py, which explains the rule).
# A window test skips itself without a display, and a skip passes: under the
# Linux row's plain ctest, a window test that no "Run ... on a virtual
# display (Linux)" step selects passes by checking nothing. FileDialogTest
# failed on every display from 0.9.541 until 2026-11-15 that way, with 33
# more window tests in the same position. This fails a pull request that adds
# a window test no such step runs, a step that runs one without
# ULTRACANVAS_TEST_DISPLAY_REQUIRED, or a skip that does not honour it.
name: Window tests

on:
  push:
    branches: [main]
    paths:
      - 'Tests/**'
      - '**/tests/**'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '.github/workflows/**'
      - 'scripts/check_window_tests.py'
      - 'scripts/tests/test_check_window_tests.py'
  pull_request:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'Tests/**'
      - '**/tests/**'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '.github/workflows/**'
      - 'scripts/check_window_tests.py'
      - 'scripts/tests/test_check_window_tests.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-22.04   # the pool the build legs use; the ubuntu-latest (24.04) one held jobs for hours on 2026-10-21
    steps:
      - uses: actions/checkout@v5
      # The script reads the workflows with PyYAML, which GitHub's Ubuntu
      # images carry; a leaner runner gets it here.
      - name: PyYAML
        run: python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
      - name: Check that every window test runs on a display
        run: python3 scripts/check_window_tests.py
      - name: The check's own tests
        run: python3 -m unittest scripts/tests/test_check_window_tests.py -v
