# The ChatCube relay (Server/ChatCubeRelay): its tests, on every change
# to it. Pure Python, no system packages. On main - and when started by hand
# (Run workflow) - the tested sources are then copied to the live server, to
# ~/chatcube-relay-src of the deploy user, and nothing more: the operator
# logs in and runs deploy/update.sh there themselves (database backed up,
# code installed, restarted, rolled back when it does not answer with its
# new version), so the deploy user needs no root rights. Without the
# server's secrets (README: Deploying from CI) the copy fails here, naming
# the ones it cannot see - a copy that did nothing must not look like one
# that worked; a fork, which has no server, is only told.
name: ChatCube relay

on:
  push:
    branches: [main]
    paths: ['Server/ChatCubeRelay/**', '.github/workflows/chatcube-relay.yml']
  pull_request:
    paths: ['Server/ChatCubeRelay/**', '.github/workflows/chatcube-relay.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04   # the pool the build legs use; the ubuntu-latest (24.04) one held jobs for hours on 2026-10-21
    defaults:
      run:
        working-directory: Server/ChatCubeRelay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    # An environment of its own: a required reviewer can be set on it in
    # Settings > Environments, so a deploy waits for a click.
    environment: chatcube-relay
    concurrency:
      group: chatcube-relay-deploy
      cancel-in-progress: false
    env:
      SSH_KEY: ${{ secrets.CHATCUBE_RELAY_SSH_KEY }}
      SSH_HOST: ${{ secrets.CHATCUBE_RELAY_SSH_HOST }}
      SSH_USER: ${{ secrets.CHATCUBE_RELAY_SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.CHATCUBE_RELAY_SSH_KNOWN_HOSTS }}
      # The server's SSH port, when not 22: a secret or a variable (a port
      # is no secret), the secret first.
      SSH_PORT: ${{ secrets.CHATCUBE_RELAY_SSH_PORT || vars.CHATCUBE_RELAY_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Is the server set up?
        id: ready
        run: |
          missing=""
          [ -n "$SSH_KEY" ] || missing="$missing CHATCUBE_RELAY_SSH_KEY"
          [ -n "$SSH_HOST" ] || missing="$missing CHATCUBE_RELAY_SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing CHATCUBE_RELAY_SSH_USER"
          [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing CHATCUBE_RELAY_SSH_KNOWN_HOSTS"
          case "$SSH_PORT" in
            ''|*[!0-9]*) echo "::error::CHATCUBE_RELAY_SSH_PORT is '$SSH_PORT', not a port number"; exit 1 ;;
          esac
          if [ -z "$missing" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          why="The ChatCube relay was not copied to the server: this job cannot see$missing. They must be Actions secrets (not variables) of $GITHUB_REPOSITORY, or of its chatcube-relay environment - see Server/ChatCubeRelay/README.md, Deploying from CI."
          if [ "$GITHUB_REPOSITORY" = "ULTRA-OS-Project/UltraCanvas" ]; then
            echo "::error::$why"
            exit 1
          fi
          echo "::notice::$why"
      - name: Copy the tested sources to the server
        if: steps.ready.outputs.ok == '1'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/relay_deploy && chmod 600 ~/.ssh/relay_deploy
          # The server's key pinned: never trust on first use.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # This commit's sources replace the previous copy whole, so nothing
          # left from an older version is installed with the next.
          tar -C Server/ChatCubeRelay --exclude=__pycache__ -czf - . |
            ssh -i ~/.ssh/relay_deploy -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              'rm -rf ~/chatcube-relay-src && mkdir -p ~/chatcube-relay-src && tar -C ~/chatcube-relay-src -xzf -'
      - name: Say what to run on the server
        if: steps.ready.outputs.ok == '1'
        # Installing is the operator's, logged in on the server with their
        # own rights. The deploy user's name is a secret (masked in logs),
        # so the summary does not name it.
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Server/ChatCubeRelay/pyproject.toml | head -1)
          {
            echo "### ChatCube relay $version copied to the server"
            echo
            echo "The sources of $GITHUB_SHA are in ~/chatcube-relay-src of the deploy user. Nothing is installed yet. On the server, with the deploy user's home in place of /home/DEPLOY_USER:"
            echo
            echo '```bash'
            echo 'src=/home/DEPLOY_USER/chatcube-relay-src'
            echo 'sudo "$src/deploy/update.sh" "$src"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::ChatCube relay $version copied to ~/chatcube-relay-src of the deploy user - run its deploy/update.sh on the server to install it."
