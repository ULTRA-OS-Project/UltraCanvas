name: llms.txt sync

# Checks the generated docs a pull request DOES carry, and keeps out the two
# it must not.
#
# - The docs-tree mirrors of the module READMEs (Docs/Modules/<Name>/README.md,
#   from <Name>/README.md; the list is MIRRORED_READMES in
#   scripts/generate_llms_txt.py) must be in sync with their sources, and the
#   "## Contents" inventory of every document the demo app opens must be
#   current, and each such document must exist (scripts/generate_doc_toc.py).
# - llms.txt / llms-full.txt are NOT carried by pull requests: they are the
#   whole corpus, so two docs pull requests open at once always conflicted in
#   them. llms-regenerate.yml writes them on main after the merge, and this
#   job refuses a pull request that changes them.

# Trigger policy matches build.yml: `pull_request` covers feature branches, so
# listing them under `push` too would run this check twice per commit.
on:
  push:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'README.md'
      - 'UltraAI/README.md'
      - 'UltraNet/README.md'
      - 'VirtualFS/README.md'
      - 'Masterfile_modules.md'
      - 'scripts/generate_llms_txt.py'
      - 'scripts/generate_doc_toc.py'
      - 'Apps/DemoApp/*.cpp'
      - 'Apps/DemoApp/*.h'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.github/workflows/llms-txt.yml'
      - '.github/workflows/llms-regenerate.yml'
  pull_request:
    # Stacked pull requests. `branches` filters the BASE branch here - the
    # branch the pull request TARGETS - so `main` alone meant a pull request
    # based on another pull request's branch matched no trigger at all and
    # got zero checks. #455 reached 1059 changed lines that way without one
    # job ever running. Deliberately NOT added to `push` above: that would
    # build every commit on every claude/** branch whether or not a pull
    # request exists, which is the double-building the note at the top of
    # build.yml describes.
    branches:
      - main
      - 'claude/**'
    paths:
      - 'Docs/**'
      - 'README.md'
      - 'UltraAI/README.md'
      - 'UltraNet/README.md'
      - 'VirtualFS/README.md'
      - 'Masterfile_modules.md'
      - 'scripts/generate_llms_txt.py'
      - 'scripts/generate_doc_toc.py'
      - 'Apps/DemoApp/*.cpp'
      - 'Apps/DemoApp/*.h'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.github/workflows/llms-txt.yml'
      - '.github/workflows/llms-regenerate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The pull request's own changes are diffed against its merge base.
          fetch-depth: 0
      - name: The pull request leaves llms.txt / llms-full.txt to main
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet --no-tags origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- llms.txt llms-full.txt)
          if [ -n "$changed" ]; then
            echo "::error::This pull request changes $changed. Those are written on main after the merge (llms-regenerate.yml); a pull request that carries them conflicts with every other docs pull request."
            echo "Drop them from the branch:  git checkout $base -- llms.txt llms-full.txt  && git commit"
            exit 1
          fi
      - name: Demo-app documents exist and have a current inventory
        run: python3 scripts/generate_doc_toc.py --check
      - name: The generator runs, and the README mirrors are current
        run: |
          python3 scripts/generate_llms_txt.py
          mirrors=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from generate_llms_txt import MIRRORED_READMES as m; print(' '.join(m.values()))")
          if ! git diff --exit-code -- $mirrors; then
            echo '::error::A Docs/ mirror of a module README is out of date.'
            echo 'Edit the module copy, run: python3 scripts/generate_llms_txt.py, and commit the mirror (not llms.txt / llms-full.txt).'
            exit 1
          fi
