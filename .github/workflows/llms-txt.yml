name: llms.txt sync

# Keeps the generated LLM docs exports (llms.txt / llms-full.txt) in sync
# with the markdown corpus. Fails when a docs change was committed without
# rerunning scripts/generate_llms_txt.py.

# Trigger policy matches build.yml: `pull_request` covers feature branches, so
# listing them under `push` too would run this check twice per commit.
on:
  push:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'README.md'
      - 'Masterfile_modules.md'
      - 'scripts/generate_llms_txt.py'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.github/workflows/llms-txt.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'README.md'
      - 'Masterfile_modules.md'
      - 'scripts/generate_llms_txt.py'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.github/workflows/llms-txt.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate llms.txt / llms-full.txt
        run: python3 scripts/generate_llms_txt.py
      - name: Verify committed files are up to date
        run: |
          if ! git diff --exit-code -- llms.txt llms-full.txt; then
            echo '::error::llms.txt / llms-full.txt are out of date.'
            echo 'Run: python3 scripts/generate_llms_txt.py  and commit the result.'
            exit 1
          fi
