name: Changelog fold

# Assigns the version numbers, once, on main.
#
# Line 1 of a product's CHANGELOG.md IS its version — cmake reads it and every
# project(VERSION …), compile definition and packaging script follows — so
# every branch wanted to write that one line and two open at once always
# collided. Branches now drop their bullets in a changelog.d/ beside the
# changelog (Docs/UltraCanvas/changelog.d/ for the framework,
# Docs/<App>/changelog.d/ for an application) with no number — two files never
# conflict — and this job folds whatever is pending into each CHANGELOG.md under
# that product's next version after it lands. Folding UltraFiler or UltraTexter
# also rewrites their Windows .rc / .manifest (the script runs set-version.sh),
# and those go into the same commit.
#
# The fold is a second commit on main. That is deliberate: the merge commit
# itself still has the entry pending, so line 1 of the changelog there is the
# PREVIOUS release, and a release build there would package new code under an
# already-published number. build.yml's `gate` job skips the release build for
# exactly that commit and lets this one — which carries the right numbers —
# produce the artifacts, through the dispatch in the last step (the fold's own
# push starts no workflow: it is made with GITHUB_TOKEN).
#
# An application-only entry is gated and dispatched the same way. The release
# artifacts carry every app, each stamped with its own changelog's line 1, so
# building the merge commit would ship that app under its previous, published
# number. The fold commit is built instead — once, as for a framework entry.
# Its framework number is unchanged, exactly as for a merge that edits only an
# app changelog by hand (build.yml's publish-sdk then refreshes the existing
# v<framework> release's assets, as it always has for such merges): an app
# release is not a framework release, and the fold never bumps the framework
# to make one. What the gate guarantees is one
# release build per merge, on the commit whose line 1s are all current, so no
# merge is built twice under one number.
#
# If the push below is refused (branch protection, or a race with another
# merge), nothing is lost: the entries stay pending and the next push to main
# folds them. A red run here is the signal to look, not a reason to hand-edit
# line 1.
#
# Merges that land within minutes of each other are folded together: the
# scheduled run folds only once main has been quiet (see "Is it time to
# fold" for the numbers), so a burst of merges makes one fold commit and one
# release build, not one each.

on:
  # Every ten minutes, off the hour (the top of the hour is when GitHub's
  # schedules queue). A run with nothing pending, or with main still moving,
  # takes a runner for the checkout and the look and is done; see "Is it time
  # to fold" for when it folds. It used to run on every push that added an
  # entry (Docs/**/changelog.d/**) and fold at once, which made one release
  # build per merge however close together the merges landed.
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

# Never cancel a fold: it commits and pushes, and a half-run that is killed
# between the two would leave the entries pending with the changelog rewritten.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # dispatch build.yml for the release (see the last step)

jobs:
  fold:
    runs-on: ubuntu-22.04   # the pool the build legs use; the ubuntu-latest (24.04) one held jobs for hours on 2026-10-21
    steps:
      - uses: actions/checkout@v5
        with:
          # The push below needs a real ref, not the detached single commit
          # the default checkout leaves behind.
          ref: main
          fetch-depth: 0

      # Merges land in bursts: five between 19:00 and 20:03 on 2026-11-12,
      # each folded and built on its own, so five release builds of six legs
      # ran at once, saved 15 GB of caches into a 10 GB budget and held every
      # macOS runner while the pull requests queued behind them. A scheduled
      # run folds only once main has been quiet for QUIET_MINUTES, unless the
      # oldest pending entry has waited MAX_MINUTES already - so a burst makes
      # one fold commit and one release build, and a lone merge is folded by
      # the second run after it. The merges themselves are gated off
      # build.yml either way, so this delays only the release artifacts, by
      # minutes against the half hour to two hours their build takes. A
      # dispatch by hand folds at once.
      - name: Is it time to fold
        id: when
        env:
          QUIET_MINUTES: 10
          MAX_MINUTES: 20
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          pending=$(find Docs -path '*/changelog.d/*.md' ! -name 'README.md' 2>/dev/null)
          if [ -z "$pending" ]; then
            echo "fold=false" >> "$GITHUB_OUTPUT"
            echo "nothing pending"
            exit 0
          fi
          if [ "$BY_HAND" = "true" ]; then
            echo "fold=true" >> "$GITHUB_OUTPUT"
            echo "dispatched by hand: folding now"
            exit 0
          fi
          now=$(date +%s)
          quiet=$(( (now - $(git log -1 --format=%ct HEAD)) / 60 ))
          # When the oldest pending entry landed: the first commit that added
          # any of them.
          oldest=$now
          for f in $pending; do
            t=$(git log --diff-filter=A --format=%ct -- "$f" | tail -1)
            [ -n "$t" ] && [ "$t" -lt "$oldest" ] && oldest=$t
          done
          waited=$(( (now - oldest) / 60 ))
          n=$(printf '%s\n' "$pending" | wc -l)
          if [ "$quiet" -ge "$QUIET_MINUTES" ]; then
            echo "fold=true" >> "$GITHUB_OUTPUT"
            echo "$n entr(y/ies) pending, main quiet for $quiet minutes: folding"
          elif [ "$waited" -ge "$MAX_MINUTES" ]; then
            echo "fold=true" >> "$GITHUB_OUTPUT"
            echo "$n entr(y/ies) pending, the oldest for $waited minutes: folding what has landed"
          else
            echo "fold=false" >> "$GITHUB_OUTPUT"
            echo "$n entr(y/ies) pending, main moved $quiet minutes ago: the next run folds"
          fi

      - name: Fold pending entries
        id: fold
        if: steps.when.outputs.fold == 'true'
        run: |
          set -o pipefail
          python3 scripts/fold_changelog.py | tee fold.log
          # One ::folded:: line per product the script changed -
          # `::folded::0.9.365` for the framework, `::folded::UltraFiler 1.89.0`
          # for an app - and none when nothing was pending, the normal case.
          # Joined: "0.9.365, UltraFiler 1.89.0".
          if grep -q '^::folded::' fold.log; then
            echo "versions=$(sed -nE 's/^::folded:://p' fold.log | paste -sd ',' - | sed 's/,/, /g')" >> "$GITHUB_OUTPUT"
          fi
          rm -f fold.log

      - name: Commit and push
        id: push
        if: steps.fold.outputs.versions != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every changelog and changelog.d (-A stages the deleted entries too),
          # plus the Windows resource files set-version.sh rewrote. The fold
          # touches nothing else.
          git add -A -- ':(glob)Docs/**/CHANGELOG.md' ':(glob)Docs/**/changelog.d/**' \
            Apps/Texter/UltraTexter.rc Apps/Texter/UltraTexter.manifest \
            Apps/UltraFiler/UltraFiler.rc Apps/UltraFiler/UltraFiler.manifest
          git commit -m "Changelog: ${{ steps.fold.outputs.versions }}" \
                     -m "Folded from the changelog.d directories by changelog-fold.yml."
          # Another merge may have landed while this ran. Rebase once and try
          # again; if it still fails, the entries stay pending and the next
          # push to main folds them.
          git pull --rebase --no-tags origin main
          git push origin HEAD:main
          # The commit that carries the new number - built by the step below.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The push above is made with GITHUB_TOKEN, and GitHub starts no workflow
      # for such a push - so build.yml never ran on a fold commit, the merge
      # commit before it is gated off, and main produced no release at all
      # (0.9.72 to 0.9.75 were never built). A workflow_dispatch is the one
      # event that token may still trigger; release=true makes it the release
      # build the push would have been. It names the fold commit itself, so a
      # merge that lands on main in the meantime cannot become this release.
      - name: Start the release build
        if: steps.fold.outputs.versions != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --repo "${{ github.repository }}" --ref main \
            -f release=true -f sha=${{ steps.push.outputs.sha }}
