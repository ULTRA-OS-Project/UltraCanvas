name: Label identifiers

# Blocks a label built from one string that is its text. One string is an
# element's IDENTIFIER - UltraCanvasContainer("Row"),
# UltraCanvasLabel("CountLabel") - and a text comes second or from SetText.
# UltraCanvasLabel was the exception until 2026-11: its one string was the
# text, eleven callers had handed it a name (the dialog's icon, Texter's
# status bar, the HTML builder, LabelBuilder) and one a text. The
# constructor takes the identifier now, which made the eleven right, but it
# cannot refuse the old use: `make_shared<UltraCanvasLabel>(Tr("Hint"))`
# still compiles, and makes a label that shows nothing. This check refuses
# it - a one-string label whose string is a Tr call or reads as words - and
# the same for the checkbox, the radio button and the switch, which were
# built like the label. It also reads the framework's headers and refuses an
# element whose one-string constructor takes a text, so that a fifth does
# not appear. See "Core conventions" in AGENTS.md and
# Docs/UltraCanvas/UltraCanvasLabelExamples.md.
#
# No baseline: the tree is clean. An identifier that really reads as text
# says so with `// label-identifier-ok: <why>`.

# Trigger policy matches build.yml / callback-cycles.yml: `pull_request`
# covers feature branches, so listing them under `push` too would run this
# check twice per commit.
on:
  push:
    branches: [main]
    paths: &paths
      - 'UltraCanvas/core/**'
      - 'UltraCanvas/include/**'
      - 'UltraCanvas/dialogs/**'
      - 'UltraCanvas/Plugins/**'
      - 'UltraCanvas/OS/**'
      - 'UltraCanvas/libspecific/**'
      - 'Apps/**'
      - 'SmartHome/**'
      - 'UltraAI/**'
      - 'UltraCloud/**'
      - 'UltraWeb/**'
      - 'Tests/**'
      - 'scripts/check_label_identifiers.py'
      - 'scripts/tests/test_check_label_identifiers.py'
      - '.github/workflows/label-identifiers.yml'
  pull_request:
    # `branches` filters the BASE branch -- the branch the pull request
    # TARGETS; see locale-numbers.yml for why `claude/**` is listed too.
    branches:
      - main
      - 'claude/**'
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-22.04   # the pool the build legs use; the ubuntu-latest (24.04) one held jobs for hours on 2026-10-21
    steps:
      - uses: actions/checkout@v5
      - name: Check for elements built from one string that is their text
        run: python3 scripts/check_label_identifiers.py --strict
      - name: The check's own tests
        run: python3 -m unittest scripts/tests/test_check_label_identifiers.py -v
