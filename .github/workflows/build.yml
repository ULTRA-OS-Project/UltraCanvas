name: Build

on:
  # Exactly one 3-OS build per commit. `pull_request` already covers feature
  # branches (including 'claude/**') from the moment a PR opens, and rebuilds on
  # every later push to it via the implicit `synchronize` event. Listing those
  # branches under `push` as well double-built every commit — two full matrices,
  # with macOS runners billed at 10x and Windows at 2x the Linux rate.
  # To validate a branch that has no PR yet: open a draft PR, or run this
  # workflow manually against the branch via workflow_dispatch.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede in-flight runs for the same branch when newer commits arrive, so a
# rapid series of pushes to an open PR costs one build rather than one each.
# The group key deliberately collapses to the same value for a branch's
# `pull_request` runs (github.head_ref) and any `push`/dispatch run on it
# (github.ref_name). Pushes to main are never cancelled — those runs produce the
# signed, notarized release artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # NOTE: macos-13 is the last GitHub-hosted Intel (x86_64) macOS runner.
        # When GitHub deprecates it, options are: drop Intel builds, use
        # self-hosted runners, or cross-compile universal binaries.
        os: [macos-latest, ubuntu-22.04, windows-latest]
        build_type: [Release]
        include:
          - os: macos-latest
            arch_label: arm64
            install_deps: |
              # The GitHub macOS runner image pre-taps aws/tap (for aws-sam-cli).
              # Homebrew's tap-trust check prints a multi-line "not trusted"
              # warning on *every* brew invocation while it is present. We install
              # nothing from it, so drop the tap — that is Homebrew's own first
              # suggestion, and it is preferable to `brew trust aws/tap` (grants
              # blanket trust to a tap we never use) or
              # HOMEBREW_NO_REQUIRE_TAP_TRUST=1 (deprecated, disables the check
              # for taps we *do* use). Tolerate the tap being absent so a future
              # runner image that drops it cannot fail this step.
              brew untap aws/tap 2>/dev/null || true
              brew install cmake pkg-config
              brew install cairo pango harfbuzz vips glib freetype tinyxml2
              brew install libcdr librevenge
              brew install zbar
              brew install mupdf
              brew install c-ares
              brew install leptonica tesseract
              # Optional audio codecs (FLAC/OGG/Opus/MP3 encode, OGG/Opus decode)
              brew install flac libvorbis opus opusfile libopusenc lame
              # libcurl: use Apple's system libcurl (SecureTransport-family
              # backend) — already present on every macOS install, so we add
              # no extra dependency for UltraNet on this platform.
          - os: ubuntu-22.04
            arch_label: x86_64
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config build-essential
              sudo apt-get install -y libcairo2-dev libpango1.0-dev libharfbuzz-dev
              sudo apt-get install -y libvips-dev libglib2.0-dev libfreetype6-dev
              sudo apt-get install -y libtinyxml2-dev libfmt-dev
              sudo apt-get install -y libx11-dev libxcursor-dev libgl1-mesa-dev libgtk-3-dev
              sudo apt-get install -y libcdr-dev librevenge-dev zlib1g-dev
              sudo apt-get install -y libzbar-dev libmupdf-dev
              # ImageMagick runtime: not a build dep, but package-linux.sh bundles
              # it as libvips' delegate (coder modules + config), so the files must
              # be present on the runner to match the developer package.
              sudo apt-get install -y imagemagick libmagickcore-6.q16-6-extra
              # MuPDF third-party deps: Ubuntu's libmupdf.a is built with
              # USE_SYSTEM_LIBS and ships no libmupdf-third, so jbig2dec/mujs/gumbo
              # must be linked from system -dev packages (find_library needs the .so).
              sudo apt-get install -y libjbig2dec0-dev libmujs-dev libgumbo-dev libopenjp2-7-dev
              # libunwind-dev: on the ubuntu-22.04 runner libgstreamer1.0-dev
              # depends on it, but apt won't auto-pull it (the pre-installed LLVM
              # toolchain ships a conflicting libunwind), failing with "held broken
              # packages". Installing it explicitly lets apt resolve the set.
              sudo apt-get install -y libunwind-dev
              sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
              # Optional audio codecs (FLAC/OGG/Opus/MP3 encode, OGG/Opus decode)
              sudo apt-get install -y libflac-dev libvorbis-dev libogg-dev libopus-dev libopusfile-dev libmp3lame-dev
              # libopusenc-dev is not packaged for Ubuntu 22.04 (added in 24.04),
              # so build the release tarball from source to keep Opus-file encode
              # support. Depends only on libopus (installed above); the dist tarball
              # ships a prebuilt ./configure, so no autotools are needed. Install to
              # /usr so pkg-config + package-linux.sh find/bundle it like a distro lib.
              OPUSENC_VER=0.3
              
              curl -fsSL "https://github.com/xiph/libopusenc/releases/download/v${OPUSENC_VER}/libopusenc-${OPUSENC_VER}.tar.gz" | tar xz
              ( cd "libopusenc-${OPUSENC_VER}" && ./configure --prefix=/usr && make -j"$(nproc)" && sudo make install )
              # libcurl4-openssl-dev provides the SYSTEM libcurl used for the
              # WebSocket-capability probe. On ubuntu-22.04 that libcurl is 7.81,
              # which predates WebSockets (curl_ws_* arrived in 7.86), so UltraNet
              # falls back to building the vendored third_party/curl (8.21). That
              # build needs libpsl (curl's CURL_USE_LIBPSL defaults ON).
              sudo apt-get install -y libcurl4-openssl-dev libpsl-dev
              sudo apt-get install -y libc-ares-dev
          - os: windows-latest
            arch_label: x86_64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Extract version from changelog
        shell: bash
        run: |
          VERSION=$(sed -nE '1s/^#### [0-9-]+ \*([0-9]+\.[0-9]+\.[0-9]+)\*.*/\1/p' Docs/UltraCanvas/CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "Error: could not parse version from Docs/UltraCanvas/CHANGELOG.md (expected '#### YYYY-MM-DD *x.y.z*')" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ===== Windows: MSYS2/MinGW dependency management =====
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-tinyxml2
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-fmt
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-libheif
            mingw-w64-x86_64-zbar
            mingw-w64-x86_64-mupdf
            mingw-w64-x86_64-libmupdf
            mingw-w64-x86_64-curl-winssl
            mingw-w64-x86_64-c-ares
            mingw-w64-x86_64-leptonica
            mingw-w64-x86_64-tesseract-ocr
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-libopusenc
            mingw-w64-x86_64-lame
            zip
            
      # ===== macOS / Linux: system package manager =====
      - name: Install dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        run: ${{ matrix.install_deps }}

      # ===== Rust toolchain — Vectorizer plugin (raster→SVG via VTracer) =====
      # Windows installs the native mingw-w64-x86_64-rust package above (gnu ABI,
      # matching the MinGW compiler; MSYS2's /usr/bin POSIX rust breaks Corrosion
      # with 'failed to join paths from $LD_LIBRARY_PATH'). On macOS/Linux use the
      # runner's preinstalled rustup to pin a current stable, so the version-pinned
      # vtracer / visioncortex crates build with a new-enough compiler.
      - name: Install Rust toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      # ===== Python `websockets` for UltraNet WS loopback test =====
      # Cheap to install; the test SKIPs cleanly if missing, but enabling
      # it lets the receiver-thread / frame-handling paths actually run
      # in CI (where libcurl has WS support).
      - name: Install python websockets package
        if: runner.os != 'Windows'
        run: pip3 install --user --break-system-packages websockets || pip3 install --user websockets

      # ===== Configure & Build =====
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_DEMO_APP=ON \
            -DULTRACANVAS_PLUGIN_CDR=OFF \
            -DULTRACANVAS_PLUGIN_XAR=ON \
            -DULTRACANVAS_BUILD_NET_TESTS=ON 2>&1 | tee configure.log

      - name: Configure CMake (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_DEMO_APP=ON \
            -DULTRACANVAS_PLUGIN_CDR=ON \
            -DULTRACANVAS_PLUGIN_XAR=ON \
            -DULTRACANVAS_BUILD_SHARED=${{ runner.os == 'Linux' && 'ON' || 'OFF' }} \
            -DULTRACANVAS_BUILD_NET_TESTS=ON 2>&1 | tee configure.log

      # Fail loudly if the OpenGL surface backend was silently disabled
      # (e.g. a missing GLEW on Windows) so a green build can't hide it.
      - name: Verify OpenGL backend enabled
        shell: bash
        run: |
          set -eu
          if ! grep -q "OpenGL Surface: ENABLED" configure.log; then
            echo "::error::OpenGL surface support was not enabled during configure"
            exit 1
          fi
          case "${{ runner.os }}" in
            Windows) backend="WGL" ;;
            macOS)   backend="CGL" ;;
            Linux)   backend="EGL|GLX" ;;
          esac
          if ! grep -qE "($backend) backend: YES" configure.log; then
            echo "::error::Expected GL backend ($backend) not active on ${{ runner.os }}"
            exit 1
          fi
          echo "OpenGL backend verified on ${{ runner.os }}"

      # libcurl selection is asserted per platform so a silent regression is caught:
      #  - Linux (ubuntu-22.04, chosen for glibc portability): its system libcurl is
      #    7.81, which predates WebSocket support (curl_ws_* arrived in 7.86), so
      #    UltraNet MUST fall back to the vendored third_party/curl (8.21, WS-capable,
      #    stamped with the distro's CURL_OPENSSL_4 version node). The bundle ships
      #    that libcurl alongside libvips/libhdf5 built on the same runner, so the
      #    CURL_OPENSSL_4 node is self-consistent within the package.
      #  - macOS / Windows: the platform's system libcurl already supports WebSockets.
      - name: Verify libcurl selection
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Linux" ]; then
            if ! grep -q "UltraNet libcurl: VENDORED" configure.log; then
              echo "::error::Expected the vendored third_party/curl build on the ubuntu-22.04 runner (its system libcurl 7.81 predates WebSockets), but configure selected system libcurl."
              exit 1
            fi
            echo "Confirmed: Linux links the vendored WS-capable libcurl (CURL_OPENSSL_4 version node)."
          else
            if grep -q "UltraNet libcurl: VENDORED" configure.log; then
              echo "::error::CI selected the vendored third_party/curl build on ${{ runner.os }}; the platform system libcurl should provide WebSocket support here."
              exit 1
            fi
            echo "Confirmed: ${{ runner.os }} links the system libcurl."
          fi

      # The Vectorizer plugin (raster→SVG via VTracer) needs a Rust toolchain. Its
      # parent gate only prints a status line when cargo is missing/incompatible and
      # keeps configuring, so a broken toolchain would otherwise ship artifacts with
      # no vectorization support. Fail loudly instead.
      - name: Verify Vectorizer plugin enabled
        shell: bash
        run: |
          set -eu
          if ! grep -q "Vectorizer Plugin - ENABLED" configure.log; then
            echo "::error::Vectorizer plugin was not enabled during configure (Rust toolchain missing or incompatible)"
            grep -i "vectorizer" configure.log || true
            exit 1
          fi
          echo "Vectorizer plugin enabled on ${{ runner.os }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Run UltraNet tests
        if: runner.os != 'Windows'
        working-directory: build
        run: ctest --output-on-failure -R UltraNet

      # Bundle all apps into the portable multi-executable tree. Reuses the
      # already-built shared `build` dir (SKIP_BUILD=1) rather than rebuilding.
      - name: Package portable Linux bundle (Linux)
        if: runner.os == 'Linux'
        run: BUILDDIR="$PWD/build" SKIP_BUILD=1 ./package-linux.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: ./package-win.sh --no-sign

      - name: Import code signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Decode base64 .p12 from the secret
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create + unlock a temporary keychain (avoids touching the runner's login keychain)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain
          security set-keychain-settings -lut 21600 $RUNNER_TEMP/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain

          # Import the cert and grant codesign access without UI prompts
          security import $RUNNER_TEMP/certificate.p12 \
            -k $RUNNER_TEMP/build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain

          # Make the temp keychain searchable for codesign (prepend to existing search list)
          security list-keychains -d user -s $RUNNER_TEMP/build.keychain $(security list-keychains -d user | sed s/\"//g)

          rm $RUNNER_TEMP/certificate.p12

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./package-macos.sh --notarize

      - name: Cleanup keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true

      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: UCDemo-Windows-${{ env.VERSION }}-${{ matrix.arch_label }}
          path: |
            dist/
          retention-days: 7

      - name: Upload build artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: UCDemo-MacOS-${{ env.VERSION }}-${{ matrix.arch_label }}
          path: |
            dist-macos/
          retention-days: 7

      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: UltraCanvas-Linux-${{ env.VERSION }}-${{ matrix.arch_label }}
          path: dist/UltraCanvas-Linux-${{ env.VERSION }}-x86_64.tar.gz
          retention-days: 7
