name: Build

on:
  # Exactly one 3-OS build per commit. `pull_request` already covers feature
  # branches (including 'claude/**') from the moment a PR opens, and rebuilds on
  # every later push to it via the implicit `synchronize` event. Listing those
  # branches under `push` as well double-built every commit — two full matrices,
  # with macOS runners billed at 10x and Windows at 2x the Linux rate.
  # To validate a branch that has no PR yet: open a draft PR, or run this
  # workflow manually against the branch via workflow_dispatch.
  push:
    branches: [main]
  pull_request:
    # Stacked pull requests. `branches` filters the BASE branch here - the
    # branch the pull request TARGETS - so `main` alone meant a pull request
    # based on another pull request's branch matched no trigger at all and
    # got zero checks. #455 reached 1059 changed lines that way without one
    # job ever running. Deliberately NOT added to `push` above: that would
    # build every commit on every claude/** branch whether or not a pull
    # request exists, which is the double-building the note at the top of
    # build.yml describes.
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      # Set only by changelog-fold.yml. Its "Changelog: x.y.z" commit is pushed
      # with GITHUB_TOKEN, and GitHub starts no workflow for a push made with
      # that token - so the fold dispatches this workflow instead, and this
      # input makes that run the release build the push would have been. A
      # dispatch by hand leaves it false: a validation run, as before.
      release:
        description: "Release build (signed, notarized artifacts) - main only"
        type: boolean
        default: false
      # The exact commit to build - the fold passes its own version commit.
      # Building "main" instead would take whatever head main has by the time
      # the runner starts, which may already be a later merge. Must be on
      # main (the gate checks); empty = the head of the ref dispatched on.
      sha:
        description: "Commit to build (empty = branch head)"
        type: string
        default: ""

# Supersede in-flight runs for the same branch when newer commits arrive, so a
# rapid series of pushes to an open PR costs one build rather than one each.
# The group key deliberately collapses to the same value for a branch's
# `pull_request` runs (github.head_ref) and any `push`/dispatch run on it
# (github.ref_name). Pushes to main are never cancelled — those runs produce the
# signed, notarized release artifacts.
#
# A release dispatch is keyed by its commit as well: GitHub keeps only ONE
# pending run per group, so with a shared key a third release dispatched while
# one builds and one waits would silently replace the waiting one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}${{ inputs.sha && format('-{0}', inputs.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A merge commit that brings in a pending changelog entry does not carry its
  # version yet: changelog-fold.yml assigns it in the commit that follows, and
  # line 1 of CHANGELOG.md here is still the PREVIOUS release. Building the
  # release from this commit would package new code under an already-published
  # number, so the release build waits for the fold commit - which carries the
  # right one - and this gate skips the commit before it.
  #
  # Only pushes are gated. A pull request always builds: its entry is pending
  # by design, and nothing it produces is published.
  gate:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      # A named commit is built only if main contains it, so a dispatch cannot
      # sign and publish a commit that never landed.
      - name: The commit to build is on main
        if: inputs.sha != ''
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" origin/main; then
            echo "::error::${{ inputs.sha }} is not on main - refusing to build it"
            exit 1
          fi
      - id: check
        shell: bash
        run: |
          count=$(find Docs/UltraCanvas/changelog.d -maxdepth 1 -name '*.md' \
                       ! -name 'README.md' 2>/dev/null | wc -l)
          # A release dispatch is gated like a push. It names the fold commit,
          # so nothing is pending there - unless the fold had to rebase onto
          # a merge that landed meanwhile: then that merge's entry is still
          # unfolded in it, and that merge's own fold builds the release.
          release="${{ github.event_name == 'push' || inputs.release == true }}"
          if [ "$release" = "true" ] && [ "$count" -gt 0 ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$count changelog entr(y/ies) still pending - the release " \
                 "build runs on the fold commit that changelog-fold.yml is about to push."
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.pending == 'false'
    strategy:
      fail-fast: false
      matrix:
        # NOTE: GitHub retired macos-13 (the last x86_64 image of the
        # macos-NN series) in December 2025. `macos-15-intel` is its
        # designated replacement label for Intel builds, supported until
        # macOS 15 leaves Apple support (~2027). When that goes too, the
        # options are: drop Intel builds, use self-hosted runners, or
        # cross-compile universal binaries.
        #
        # Both macOS legs name their macOS version, never macos-latest, so a
        # new runner image (and its Xcode and SDK) arrives by a change here and
        # not on GitHub's schedule. While the libraries came from Homebrew the
        # runner's version was also the oldest macOS the apps ran on: when
        # macos-latest moved to macOS 26 in July 2026 the arm64 apps started
        # only on macOS 26, while their Info.plist still said 12.0. The
        # libraries are now built for MACOSX_DEPLOYMENT_TARGET (below).
        os: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-11-arm]
        build_type: [Release]
        include:
          - os: macos-15
            arch_label: arm64
          - os: macos-15-intel
            arch_label: x86_64
          - os: ubuntu-22.04
            arch_label: x86_64
          # Linux/aarch64 on GitHub-hosted arm64 runners (free for public
          # repos). Same 22.04 base as the x86_64 row, so both Linux
          # artifacts carry the same glibc floor, and the dependency
          # install below is shared verbatim between them.
          - os: ubuntu-22.04-arm
            arch_label: arm64
          - os: windows-latest
            arch_label: x86_64
            msystem: CLANG64
            msys_prefix: mingw-w64-clang-x86_64
            msys_toolchain: mingw-w64-clang-x86_64-clang
          - os: windows-11-arm
            arch_label: arm64
            msystem: CLANGARM64
            msys_prefix: mingw-w64-clang-aarch64
            msys_toolchain: mingw-w64-clang-aarch64-clang

    runs-on: ${{ matrix.os }}

    # Normal jobs finish in ~30 minutes. Without a cap, a hang burns the
    # default 6-hour job timeout (seen once: MSYS2 ldd deadlocking while
    # loading an ImageMagick coder DLL during Windows-on-ARM packaging).
    # The macOS legs get longer: the first run after MacOS/deps changes
    # builds every bundled library from source before the apps (the vcpkg
    # binary cache makes later runs restore them in a minute or two).
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 300 || 120 }}

    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}

    # Is this run producing release artifacts, or checking a change?
    #
    # Only main builds releases: a push to it, or the release dispatch that
    # changelog-fold.yml sends after its version commit (a push made with
    # GITHUB_TOKEN starts no workflow). A pull_request run and a hand-started
    # workflow_dispatch validation run are not, and the macOS signing and
    # notarization steps below are skipped for them - see the comment on
    # "Package (macOS)" for why that matters.
    env:
      RELEASE_BUILD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release == true) }}

      # ccache. There is no incremental state between runs on a hosted runner,
      # so without this every leg compiles all ~1136 objects from scratch even
      # when a pull request changed one file. The cache below carries the
      # compiled objects across runs instead; a run that changes nothing but a
      # changelog entry or a doc should hit on nearly all of them.
      #
      # CCACHE_DIR is pinned inside the workspace so one path works on all three
      # platforms, MSYS2 included, and so actions/cache can name it directly.
      # CCACHE_MAXSIZE is deliberately small: GitHub allows 10 GB of cache per
      # REPOSITORY and evicts least-recently-used, and this matrix saves six
      # caches per run, so a default 5 GB per leg would evict the other legs'
      # entries (and llms-txt's, and ui-reuse's) on every push. 500 MB x 6 legs
      # leaves the budget with room.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # Compare the compiler by content rather than mtime: the runner image
      # reinstalls the toolchain each run, so an mtime check would treat an
      # identical compiler as a different one and miss on every object.
      CCACHE_COMPILERCHECK: content
      # The Clang the Linux legs build with. See the install step below for
      # why it does not come from the distribution.
      ULTRACANVAS_CLANG_VERSION: "19"

      # The oldest macOS the macOS apps run on (empty on the other legs).
      # CMake seeds CMAKE_OSX_DEPLOYMENT_TARGET from it and cargo and clang
      # read it directly, so all of our own code is compiled for it; without
      # it clang targets the SDK's version, which on a macOS 26 runner is 26.
      # The libraries the apps bundle are built for it too, by vcpkg
      # (scripts/macos-deps.sh), whose triplets in MacOS/deps/triplets carry
      # the same number - the script refuses to run when they disagree.
      # Homebrew's bottles could not be used for this: each carries the macOS
      # of the machine that built it, Homebrew 7.0 (September 2026) builds no
      # more for macOS 14 or for Intel, and dyld refuses a library built for a
      # newer macOS than the running one. package-macos.sh checks every binary
      # in the suite against this number, writes it as LSMinimumSystemVersion,
      # and fails the job if anything needs a newer macOS.
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.os, 'macos') && '14.0' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}   # the fold's version commit; empty = the event's commit
          submodules: recursive
          # Full history, not the default single commit. GitRepositoryTest
          # walks this repository's own commits, so under a shallow checkout it
          # finds one commit with no parents and fails on every paging
          # assertion. The cost is small — 504 commits, ~92 MB, no submodules —
          # and the alternative is leaving that suite permanently ungated.
          fetch-depth: 0

      - name: Extract version from changelog
        shell: bash
        run: |
          VERSION=$(sed -nE '1s/^#### [0-9-]+ \*([0-9]+\.[0-9]+\.[0-9]+)\*.*/\1/p' Docs/UltraCanvas/CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "Error: could not parse version from Docs/UltraCanvas/CHANGELOG.md (expected '#### YYYY-MM-DD *x.y.z*')" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ===== Windows: MSYS2/MinGW dependency management =====
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        # Normally 2-5 min; 7 at most in the runs of 2026-10-06/07.
        timeout-minutes: 30
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.msys_toolchain }}
            ${{ matrix.msys_prefix }}-cmake
            ${{ matrix.msys_prefix }}-ccache
            ${{ matrix.msys_prefix }}-ninja
            ${{ matrix.msys_prefix }}-pkgconf
            ${{ matrix.msys_prefix }}-cppwinrt
            ${{ matrix.msys_prefix }}-rust
            ${{ matrix.msys_prefix }}-cairo
            ${{ matrix.msys_prefix }}-pango
            ${{ matrix.msys_prefix }}-harfbuzz
            ${{ matrix.msys_prefix }}-glib2
            ${{ matrix.msys_prefix }}-freetype
            ${{ matrix.msys_prefix }}-tinyxml2
            ${{ matrix.msys_prefix }}-libiconv
            ${{ matrix.msys_prefix }}-zlib
            ${{ matrix.msys_prefix }}-libvips
            ${{ matrix.msys_prefix }}-glew
            ${{ matrix.msys_prefix }}-fmt
            ${{ matrix.msys_prefix }}-imagemagick
            ${{ matrix.msys_prefix }}-libheif
            ${{ matrix.msys_prefix }}-zbar
            ${{ matrix.msys_prefix }}-libsodium
            ${{ matrix.msys_prefix }}-mupdf
            ${{ matrix.msys_prefix }}-libmupdf
            ${{ matrix.msys_prefix }}-curl-winssl
            ${{ matrix.msys_prefix }}-c-ares
            ${{ matrix.msys_prefix }}-leptonica
            ${{ matrix.msys_prefix }}-tesseract-ocr
            ${{ matrix.msys_prefix }}-flac
            ${{ matrix.msys_prefix }}-libvorbis
            ${{ matrix.msys_prefix }}-libogg
            ${{ matrix.msys_prefix }}-opus
            ${{ matrix.msys_prefix }}-opusfile
            ${{ matrix.msys_prefix }}-libopusenc
            ${{ matrix.msys_prefix }}-lame
            ${{ matrix.msys_prefix }}-librevenge
            ${{ matrix.msys_prefix }}-libcdr
            ${{ matrix.msys_prefix }}-lcms2
            ${{ matrix.msys_prefix }}-icu
            ${{ matrix.msys_prefix }}-boost
            ${{ matrix.msys_prefix }}-python
            zip

      # ===== macOS: build tools from Homebrew, libraries from vcpkg (shared
      # by the arm64 and x86_64 jobs; Homebrew lives at /opt/homebrew on Apple
      # Silicon and /usr/local on Intel). vcpkg's checkout and binary cache sit
      # in .vcpkg/; the libraries install outside the workspace, in
      # ~/.cache/ultracanvas/vcpkg-installed (scripts/macos-deps.sh's default),
      # because CMake refuses to export link directories from inside the
      # source tree. =====
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        # Normally under 30 s; Homebrew's own auto-update can add minutes.
        timeout-minutes: 15
        run: |
          # The GitHub macOS runner image pre-taps aws/tap (for aws-sam-cli).
          # Homebrew's tap-trust check prints a multi-line "not trusted"
          # warning on *every* brew invocation while it is present. We install
          # nothing from it, so drop the tap — that is Homebrew's own first
          # suggestion, and it is preferable to `brew trust aws/tap` (grants
          # blanket trust to a tap we never use) or
          # HOMEBREW_NO_REQUIRE_TAP_TRUST=1 (deprecated, disables the check
          # for taps we *do* use). Tolerate the tap being absent so a future
          # runner image that drops it cannot fail this step.
          brew untap aws/tap 2>/dev/null || true
          # Build tools only. The libraries the apps link and package-macos.sh
          # bundles come from vcpkg, two steps down, built for
          # MACOSX_DEPLOYMENT_TARGET; these are what its ports need on macOS.
          brew install cmake pkg-config ccache autoconf autoconf-archive automake libtool nasm
          # libcurl: use Apple's system libcurl (SecureTransport-family
          # backend) — already present on every macOS install, so we add
          # no extra dependency for UltraNet on this platform.

      # vcpkg's binary cache: each library it has built, as one archive per
      # package and configuration. Keyed by MacOS/deps and the script (which
      # pins the vcpkg commit) and saved under a fresh key by every run that
      # built something, so a change rebuilds only the packages it touches;
      # `restore-keys` falls back to the newest cache for this leg.
      - name: Restore vcpkg binary cache (macOS)
        if: runner.os == 'macOS'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg/binary-cache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('MacOS/deps/**', 'scripts/macos-deps.sh') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ hashFiles('MacOS/deps/**', 'scripts/macos-deps.sh') }}-
            vcpkg-${{ matrix.os }}-

      - name: Build the bundled libraries for macOS ${{ env.MACOSX_DEPLOYMENT_TARGET }} (macOS)
        if: runner.os == 'macOS'
        id: macos-deps
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg/binary-cache,readwrite
          # Report every port that fails in one run, not just the first.
          UC_VCPKG_KEEP_GOING: "1"
        run: |
          mkdir -p .vcpkg/binary-cache
          cached_before=$(find .vcpkg/binary-cache -type f | wc -l)
          prefix=$(scripts/macos-deps.sh)
          cached_after=$(find .vcpkg/binary-cache -type f | wc -l)
          echo "built=$([ "$cached_after" -gt "$cached_before" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Libraries for macOS $MACOSX_DEPLOYMENT_TARGET in $prefix"
          # pkg-config sees only this prefix, so nothing can fall back to a
          # library Homebrew installed for one of the tools above.
          {
            echo "UC_MACOS_DEPS_PREFIX=$prefix"
            echo "PKG_CONFIG_LIBDIR=$prefix/lib/pkgconfig:$prefix/share/pkgconfig"
            echo "CMAKE_PREFIX_PATH=$prefix"
          } >> "$GITHUB_ENV"

      # Right after the build, and whether or not it succeeded: a run that
      # built half the libraries keeps them for the next one.
      - name: Save vcpkg binary cache (macOS)
        if: always() && runner.os == 'macOS' && steps.vcpkg-cache.outcome == 'success' && steps.macos-deps.outputs.built != 'false'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg/binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # ===== Linux: system package manager =====
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # A mirror that crawls still finishes (15-27 min on 2026-10-07, against
        # about 3 normally); anything slower is not worth waiting out.
        timeout-minutes: 45
        run: |
          # Shared by both Linux rows (x86_64 and arm64): the package set is
          # identical on Ubuntu ports, so the only architecture-dependent bit
          # is the multiarch libdir the from-source builds install into.
          # Every apt-get goes through scripts/ci-apt.sh: a download that stops
          # dead is stopped and retried rather than holding the job for an hour.
          scripts/ci-apt.sh update
          # No `clang` here on purpose: jammy's is 14, below this project's
          # floor, and it is installed from LLVM's own repository just below.
          scripts/ci-apt.sh install cmake pkg-config build-essential ccache
          # dpkg-architecture comes with dpkg-dev (pulled in by build-essential
          # above), so this is resolved only after that install.
          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null \
            || gcc -print-multiarch)
          echo "Building Linux dependencies for $MULTIARCH ($(uname -m))"
          scripts/ci-apt.sh install libcairo2-dev libpango1.0-dev libharfbuzz-dev
          scripts/ci-apt.sh install libvips-dev libglib2.0-dev libfreetype6-dev dbus
          scripts/ci-apt.sh install libtinyxml2-dev libfmt-dev
          scripts/ci-apt.sh install libx11-dev libxcursor-dev libgl1-mesa-dev libgtk-3-dev
          scripts/ci-apt.sh install libcdr-dev librevenge-dev zlib1g-dev
          # Build dependencies of the patched libcdr in UltraCanvas/third_party/libcdr.
          scripts/ci-apt.sh install libboost-dev liblcms2-dev libicu-dev
          scripts/ci-apt.sh install libzbar-dev
          # IODeviceManager's optional backends are compiled only when configure
          # finds their library; without these CI never builds them and a
          # compile error in one goes unseen. libudev: the hot-plug watcher
          # (OS/Linux/UltraCanvasLinuxIODeviceWatcher.cpp). libcups: the CUPS
          # printer backend (core/IODeviceManager/UltraCanvasIODevicePrinterCUPS.cpp).
          # libsane: the SANE scanner backend (OS/Linux/UltraCanvasLinuxIODeviceScanner.cpp).
          scripts/ci-apt.sh install libudev-dev libcups2-dev libsane-dev
          # CUPS's reference IPP Everywhere printer, for IODevicePrinterIPPLiveTest -
          # over ipp://, and over ipps:// with the self-signed certificate it makes,
          # which exercises trusting a device on first use (UltraCanvasIODeviceTlsTrust) -
          # and the DNS-SD daemon it needs to start at all (even with -r off).
          # The test skips without them, and "Run unit tests" turns that skip
          # into a failure, so it cannot quietly stop running.
          scripts/ci-apt.sh install cups-ipp-utils avahi-daemon
          # UltraWin RemoteApp client (VM tier): FreeRDP is optional but
          # CI should compile it. 22.04 ships freerdp2; newer runners
          # will pick freerdp3-dev automatically once available.
          if apt-cache show freerdp2-dev >/dev/null 2>&1; then
            scripts/ci-apt.sh install freerdp2-dev
          else
            scripts/ci-apt.sh install freerdp3-dev
          fi
          # ImageMagick runtime: not a build dep, but package-linux.sh bundles
          # it as libvips' delegate (coder modules + config), so the files must
          # be present on the runner to match the developer package.
          scripts/ci-apt.sh install imagemagick libmagickcore-6.q16-6-extra
          # MuPDF: Ubuntu 22.04 ships 1.19, too old for the PDF plugin, which uses
          # 1.23-era APIs (FZ_IMAGE_PSD, FZ_META_INFO_SUBJECT/KEYWORDS/*DATE,
          # pdf_page_label, pdf_apply_redaction, the 7-arg fz_search_page_number).
          # Build 1.23.10 from source to match the version Ubuntu 24.04 packages
          # (what the code is written against). Bundle MuPDF's own third-party libs
          # EXCEPT the ones ALSO used by cairo/pango/libvips in the same process:
          # freetype+harfbuzz (cairo/pango) and libjpeg+openjpeg (libvips). Using the
          # SYSTEM copies of these avoids two instances of the same library in one
          # process. Two concrete failures this prevents:
          #   * libjpeg: MuPDF vendors libjpeg 9 (JPEG_LIB_VERSION=90); without
          #     USE_SYSTEM_LIBJPEG its global jpeg_CreateDecompress interposes libvips's
          #     system libjpeg 8 and breaks every JPEG/AVIF thumbnail ("Wrong JPEG
          #     library version: library is 90, caller expects 80").
          #   * openjpeg: MuPDF compiles its bundled thirdparty with hidden ELF
          #     visibility; a hidden opj_* symbol in the app collides with libvips's
          #     reference to system libopenjp2 ("hidden symbol ... referenced by DSO").
          # XCFLAGS=-fPIC so the static archives link into the shared libUltraCanvas.so.
          # The companion -dev libs below satisfy both the plugin's find_library() probes
          # and MuPDF's USE_SYSTEM_* builds.
          scripts/ci-apt.sh install libjbig2dec0-dev libmujs-dev libgumbo-dev libopenjp2-7-dev libjpeg-dev
          MUPDF_VER=1.23.10
          curl -fsSL "https://mupdf.com/downloads/archive/mupdf-${MUPDF_VER}-source.tar.gz" | tar xz
          make -C "mupdf-${MUPDF_VER}-source" -j"$(nproc)" \
            HAVE_X11=no HAVE_GLUT=no \
            USE_SYSTEM_FREETYPE=yes USE_SYSTEM_HARFBUZZ=yes USE_SYSTEM_LIBJPEG=yes USE_SYSTEM_OPENJPEG=yes \
            XCFLAGS=-fPIC build=release
          sudo make -C "mupdf-${MUPDF_VER}-source" \
            HAVE_X11=no HAVE_GLUT=no \
            USE_SYSTEM_FREETYPE=yes USE_SYSTEM_HARFBUZZ=yes USE_SYSTEM_LIBJPEG=yes USE_SYSTEM_OPENJPEG=yes \
            XCFLAGS=-fPIC build=release prefix=/usr install
          # Some MuPDF install targets omit the static third-party archive; make
          # sure find_library(mupdf-third) can see it.
          sudo cp "mupdf-${MUPDF_VER}-source/build/release/libmupdf-third.a" /usr/lib/ 2>/dev/null || true
          # libunwind-dev: on the ubuntu-22.04 runner libgstreamer1.0-dev
          # depends on it, but apt won't auto-pull it (the pre-installed LLVM
          # toolchain ships a conflicting libunwind), failing with "held broken
          # packages". Installing it explicitly lets apt resolve the set.
          scripts/ci-apt.sh install libunwind-dev
          scripts/ci-apt.sh install libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          # VideoFX's engine (FFmpeg 4.4 on 22.04). Without it the module builds
          # from its stub and VideoFXTest checks only the filter-text half.
          scripts/ci-apt.sh install libavformat-dev libavcodec-dev libavfilter-dev libavutil-dev libswscale-dev
          # Optional audio codecs (FLAC/OGG/Opus/MP3 encode, OGG/Opus decode)
          scripts/ci-apt.sh install libflac-dev libvorbis-dev libogg-dev libopus-dev libopusfile-dev libmp3lame-dev
          # libopusenc-dev is not packaged for Ubuntu 22.04 (added in 24.04),
          # so build the release tarball from source to keep Opus-file encode
          # support. Depends only on libopus (installed above); the dist tarball
          # ships a prebuilt ./configure, so no autotools are needed. Install to
          # /usr so pkg-config + package-linux.sh find/bundle it like a distro lib.
          OPUSENC_VER=0.3

          curl -fsSL "https://github.com/xiph/libopusenc/releases/download/v${OPUSENC_VER}/libopusenc-${OPUSENC_VER}.tar.gz" | tar xz
          ( cd "libopusenc-${OPUSENC_VER}" && ./configure --prefix=/usr && make -j"$(nproc)" && sudo make install )
          # libcurl4-openssl-dev provides the SYSTEM libcurl used for the
          # WebSocket-capability probe. On ubuntu-22.04 that libcurl is 7.81,
          # which predates WebSockets (curl_ws_* arrived in 7.86), so UltraNet
          # falls back to building the vendored third_party/curl (8.21). That
          # build needs libpsl (curl's CURL_USE_LIBPSL defaults ON).
          scripts/ci-apt.sh install libcurl4-openssl-dev libpsl-dev
          # libsodium: cryptographic backend for UltraCrypt
          scripts/ci-apt.sh install libsodium-dev
          # UltraDatabase: SQLite is the single-user store, libpq the
          # multi-user one. Both are named explicitly rather than relied on
          # from the runner image, because UltraDatabase soft-disables itself
          # when a header is missing - and a silently disabled database layer
          # takes the whole UltraFIBU bookkeeping suite out of CI with it.
          scripts/ci-apt.sh install libsqlite3-dev libpq-dev
          # c-ares: UltraNet's async DNS uses the event-thread API
          # (ARES_OPT_EVENT_THREAD / ares_channel_t / evsys), added in c-ares
          # 1.26. Ubuntu 22.04 ships 1.18, so build a current release from
          # source. The dist tarball ships a prebuilt ./configure; install into
          # the multiarch libdir so pkg-config + package-linux.sh find/bundle it
          # like a distro lib.
          CARES_VER=1.34.5
          curl -fsSL "https://github.com/c-ares/c-ares/releases/download/v${CARES_VER}/c-ares-${CARES_VER}.tar.gz" | tar xz
          ( cd "c-ares-${CARES_VER}" && ./configure --prefix=/usr --libdir="/usr/lib/$MULTIARCH" && make -j"$(nproc)" && sudo make install )

      # ===== Linux: the C++20 compiler =====
      # UltraCanvas is built as C++20 and uses P1091 (capturing a structured
      # binding in a lambda), which Clang implements from 16. Ubuntu 22.04 has
      # nothing new enough: its archives stop at clang-14 and the runner image
      # preinstalls 13, so `apt-get install clang` yields a compiler that
      # rejects the tree - and does it with "'x' in capture list does not name
      # a variable", which points at the lambda and never mentions the
      # compiler. The Clang therefore comes from LLVM's own apt repository,
      # installed through their maintained llvm.sh so the suite name for this
      # distribution is chosen by upstream rather than hard-coded here.
      #
      # The runner is deliberately NOT moved to ubuntu-24.04, which does ship
      # Clang 16: this leg is pinned to 22.04 for glibc 2.35, which is what
      # makes the portable Linux bundle portable, and 24.04 would raise that
      # floor to 2.39 for everyone who installs it.
      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        # Normally 20 s; 2.5 min on the slow mirror day of 2026-10-07.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          V="${ULTRACANVAS_CLANG_VERSION}"
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$V"
          # Fail here, loudly, rather than twenty minutes into a compile: if the
          # repository did not carry this version for this distribution or
          # architecture, that is the thing to report, not whatever the build
          # would have said next.
          if ! command -v "clang++-$V" >/dev/null 2>&1; then
            echo "::error::clang++-$V was not installed. apt.llvm.org may not" \
                 "carry Clang $V for $(lsb_release -cs) on $(uname -m)." \
                 "Pick a version it does carry via ULTRACANVAS_CLANG_VERSION."
            exit 1
          fi
          echo "Using $(clang++-$V --version | head -1)"
          # CC/CXX win over the root CMakeLists' own Clang search, so this is
          # the single place the CI compiler is decided.
          echo "CC=clang-$V"    >> "$GITHUB_ENV"
          echo "CXX=clang++-$V" >> "$GITHUB_ENV"

      # ===== Rust toolchain — Vectorizer plugin (raster→SVG via VTracer) =====
      # Windows installs MSYS2's native rust package above (gnu/gnullvm ABI,
      # matching the CLANG64/CLANGARM64 clang compiler (both use the *-windows-gnullvm ABI); MSYS2's /usr/bin POSIX rust breaks
      # Corrosion with 'failed to join paths from $LD_LIBRARY_PATH'). On macOS/Linux use the
      # runner's preinstalled rustup to pin a current stable, so the version-pinned
      # vtracer / visioncortex crates build with a new-enough compiler.
      - name: Install Rust toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        # Normally under 20 s; 35 s at most in the runs of 2026-10-06/07.
        timeout-minutes: 10
        shell: bash
        run: |
          set -eu
          # The Linux arm64 runner image ships a smaller toolset than the
          # x86_64 one and may not preinstall rustup; bootstrap it when it is
          # missing so the Vectorizer gate below can't fail for that reason.
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      # ===== Python `websockets` for UltraNet WS loopback test =====
      # Cheap to install; the test SKIPs cleanly if missing, but enabling
      # it lets the receiver-thread / frame-handling paths actually run
      # in CI (where libcurl has WS support).
      - name: Install python websockets package
        if: runner.os != 'Windows'
        # Normally a few seconds.
        timeout-minutes: 5
        run: pip3 install --user --break-system-packages websockets || pip3 install --user websockets

      # ===== Configure & Build =====

      # Restore the previous run's compiled objects. `key` is unique per run, so
      # every run saves a fresh cache at the end; `restore-keys` is the prefix,
      # so a run that finds no exact match falls back to the most recent cache
      # for the same leg and starts from those objects rather than from nothing.
      # Keyed per os AND build_type because the compile lines differ.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.os }}-${{ matrix.build_type }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.build_type }}-

      # Zero the counters so the summary printed after the build describes THIS
      # run, and show the resolved configuration. If CCACHE_DIR came out wrong
      # (the MSYS2 leg is the one that could), the cache silently does nothing
      # and every object misses - printing the directory makes that visible
      # here rather than leaving a mystery 40-minute build.
      - name: Prepare ccache
        # No `shell:` - inherit the job default, which is the MSYS2 shell on the
        # Windows legs. `shell: bash` there is Git Bash, a different environment
        # that has no mingw ccache on its PATH.
        run: |
          ccache --version | head -1
          ccache -p 2>/dev/null | grep -E 'cache_dir|max_size' || true
          ccache -z

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_DEMO_APP=ON \
            -DULTRACANVAS_PLUGIN_CDR=ON \
            -DULTRACANVAS_PLUGIN_XAR=ON \
            -DULTRACANVAS_BUILD_SHARED=ON \
            -DULTRACANVAS_BUILD_NET_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRACLOUD_TESTS=ON \
            -DULTRACANVAS_BUILD_EMAILCLEANER_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRAMAIL_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRAFIBU_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRAMESSAGE_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRACANVASSTART_TESTS=ON \
            -DULTRACANVAS_BUILD_VECTOR_FORMAT_TESTS=ON \
            -DULTRACANVAS_BUILD_FILER_TESTS=ON \
            -DULTRACANVAS_BUILD_VAULT_TESTS=ON \
            -DULTRACANVAS_BUILD_DATABASE_TESTS=ON 2>&1 | tee configure.log

      - name: Configure CMake (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          # On macOS, UC_MACOS_DEPS_PREFIX is the vcpkg prefix built above
          # (cmake/UltraCanvasMacOSDeps.cmake); on Linux it is unset.
          cmake -B build \
            ${UC_MACOS_DEPS_PREFIX:+-DULTRACANVAS_MACOS_DEPS_PREFIX="$UC_MACOS_DEPS_PREFIX"} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_DEMO_APP=ON \
            -DULTRACANVAS_PLUGIN_CDR=ON \
            -DULTRACANVAS_PLUGIN_XAR=ON \
            -DULTRACANVAS_BUILD_SHARED=ON \
            -DULTRACANVAS_BUILD_NET_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRACLOUD_TESTS=ON \
            -DULTRACANVAS_BUILD_EMAILCLEANER_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRAMAIL_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRAFIBU_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRAMESSAGE_TESTS=ON \
            -DULTRACANVAS_BUILD_ULTRACANVASSTART_TESTS=ON \
            -DULTRACANVAS_BUILD_DATABASE_TESTS=ON \
            -DULTRACANVAS_BUILD_VECTOR_FORMAT_TESTS=ON \
            -DBUILD_TESTS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }} 2>&1 | tee configure.log

      # Fail loudly if the OpenGL surface backend was silently disabled
      # (e.g. a missing GLEW on Windows) so a green build can't hide it.
      - name: Verify OpenGL backend enabled
        shell: bash
        run: |
          set -eu
          if ! grep -q "OpenGL Surface: ENABLED" configure.log; then
            echo "::error::OpenGL surface support was not enabled during configure"
            exit 1
          fi
          case "${{ runner.os }}" in
            Windows) backend="WGL" ;;
            macOS)   backend="CGL" ;;
            Linux)   backend="EGL|GLX" ;;
          esac
          if ! grep -qE "($backend) backend: YES" configure.log; then
            echo "::error::Expected GL backend ($backend) not active on ${{ runner.os }}"
            exit 1
          fi
          echo "OpenGL backend verified on ${{ runner.os }}"

      # UltraDatabase degrades quietly by design: no libsqlite3 and the whole
      # module is skipped, no libpq and it builds SQLite-only. Both are
      # reasonable for a contributor and neither is acceptable here, because a
      # skipped module takes its tests with it - which is how the multi-user
      # bug below could have shipped. So configure has to say it got both.
      - name: Verify UltraDatabase built with PostgreSQL (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          if ! grep -q "UltraDatabase - ENABLED" configure.log; then
            echo "::error::UltraDatabase was disabled during configure (libsqlite3-dev missing?)"
            exit 1
          fi
          if ! grep -q "UltraDatabase - ENABLED.*PostgreSQL" configure.log; then
            echo "::error::UltraDatabase configured without PostgreSQL (libpq-dev missing?) - the multi-user tests would silently not run"
            exit 1
          fi
          echo "UltraDatabase verified: SQLite + PostgreSQL"

      # libcurl selection is asserted per platform so a silent regression is caught:
      #  - Linux (ubuntu-22.04, chosen for glibc portability): its system libcurl is
      #    7.81, which predates WebSocket support (curl_ws_* arrived in 7.86), so
      #    UltraNet MUST fall back to the vendored third_party/curl (8.21, WS-capable,
      #    stamped with the distro's CURL_OPENSSL_4 version node). The bundle ships
      #    that libcurl alongside libvips/libhdf5 built on the same runner, so the
      #    CURL_OPENSSL_4 node is self-consistent within the package.
      #  - macOS / Windows: the platform's system libcurl already supports WebSockets.
      - name: Verify libcurl selection
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Linux" ]; then
            if ! grep -q "UltraNet libcurl: VENDORED" configure.log; then
              echo "::error::Expected the vendored third_party/curl build on the ubuntu-22.04 runner (its system libcurl 7.81 predates WebSockets), but configure selected system libcurl."
              exit 1
            fi
            echo "Confirmed: Linux links the vendored WS-capable libcurl (CURL_OPENSSL_4 version node)."
          else
            if grep -q "UltraNet libcurl: VENDORED" configure.log; then
              echo "::error::CI selected the vendored third_party/curl build on ${{ runner.os }}; the platform system libcurl should provide WebSocket support here."
              exit 1
            fi
            echo "Confirmed: ${{ runner.os }} links the system libcurl."
          fi

      # The Vectorizer plugin (raster→SVG via VTracer) needs a Rust toolchain. Its
      # parent gate only prints a status line when cargo is missing/incompatible and
      # keeps configuring, so a broken toolchain would otherwise ship artifacts with
      # no vectorization support. Fail loudly instead.
      - name: Verify Vectorizer plugin enabled
        shell: bash
        run: |
          set -eu
          if ! grep -q "Vectorizer Plugin - ENABLED" configure.log; then
            echo "::error::Vectorizer plugin was not enabled during configure (Rust toolchain missing or incompatible)"
            grep -i "vectorizer" configure.log || true
            exit 1
          fi
          echo "Vectorizer plugin enabled on ${{ runner.os }}"

      # CorelDRAW import needs the CDR plugin built on the patched libcdr in
      # UltraCanvas/third_party/libcdr (bitmap transparency, PowerClip). Its gate
      # only prints a status line when librevenge/lcms2/ICU/Boost are missing,
      # so a lost dependency would ship without CDR import. Fail loudly instead.
      - name: Verify CDR plugin enabled
        shell: bash
        run: |
          set -eu
          if ! grep -q "CDR Plugin - ENABLED" configure.log; then
            echo "::error::CDR plugin was not enabled during configure (librevenge/libcdr dependencies missing?)"
            grep -i "cdr\|revenge" configure.log || true
            exit 1
          fi
          if ! grep -q "libcdr version: .*vendored" configure.log; then
            echo "::error::CDR plugin built without the patched libcdr in third_party/libcdr (lcms2, ICU, zlib or Boost missing?)"
            grep -i "libcdr" configure.log || true
            exit 1
          fi
          echo "CDR plugin enabled with the vendored libcdr on ${{ runner.os }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      # The installed CMake package is what an application outside this tree
      # builds against (Docs/GettingStarted.md, the out-of-tree route), and the
      # install prefix is what the SDK artifact below ships. Install into a
      # scratch prefix and build Tests/PackageConsumer with nothing but
      # find_package(UltraCanvas): an export CMake refuses to generate, a
      # header that reaches outside the install, or a dependency the config
      # forgets fails here, on this pull request, rather than on a user's
      # machine. Every leg, because every leg produces an SDK.
      - name: Install and build against the CMake package
        run: |
          set -eu
          SDK="UltraCanvas-SDK-${{ runner.os == 'macOS' && 'MacOS' || runner.os }}-${{ env.VERSION }}-${{ matrix.arch_label }}"
          echo "SDK_NAME=$SDK" >> "$GITHUB_ENV"
          cmake --install build --prefix "$PWD/$SDK" > install.log
          test -f "$SDK/lib/cmake/UltraCanvas/UltraCanvasConfig.cmake" \
            || { echo "::error::cmake --install wrote no UltraCanvasConfig.cmake"; tail -20 install.log; exit 1; }
          # Windows and macOS: add the headers, import libraries / dylibs
          # and .pc files of the libraries the framework uses, so the SDK
          # builds an application on a machine without MSYS2's or
          # Homebrew's packages (scripts/sdk-bundle-deps.sh; a no-op on Linux).
          bash scripts/sdk-bundle-deps.sh "$PWD/$SDK"
          cmake -S Tests/PackageConsumer -B build-package-consumer \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$PWD/$SDK"
          cmake --build build-package-consumer --parallel 2
          exe=build-package-consumer/PackageConsumer
          [ "${{ runner.os }}" = "Windows" ] && exe="$exe.exe"
          # A program that will not start says nothing on its own: under MSYS2
          # bash a DLL the loader cannot find or resolve is a bare exit code
          # 127. Print what the executable depends on and how it ended, so the
          # log names the cause rather than a number.
          if command -v ldd > /dev/null 2>&1; then
            echo "--- dependencies of $exe"
            ldd "$exe" || true
          elif command -v otool > /dev/null 2>&1; then
            echo "--- dependencies of $exe"
            otool -L "$exe" || true
          fi
          # The shared core lives in lib/ on Linux and, as a DLL, in bin/ on
          # Windows; the consumer finds it the way an application would.
          set +e
          PATH="$PWD/$SDK/bin:$PATH" LD_LIBRARY_PATH="$PWD/$SDK/lib" "$exe"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::PackageConsumer exited with status $status"
            exit "$status"
          fi
          # The same consumer once more against the bundled development
          # files alone: PKG_CONFIG_LIBDIR pointed at an empty directory
          # hides every .pc file of the runner, so cairo, pango, glib and
          # the rest can only come from the SDK's deps/. The run puts the
          # bundled DLLs on PATH on Windows; on macOS the rpath the package
          # adds finds the bundled dylibs.
          if [ "${{ runner.os }}" != "Linux" ]; then
            echo "--- consumer against the bundled development files only"
            mkdir -p "$PWD/no-pkgconfig"
            PKG_CONFIG_LIBDIR="$PWD/no-pkgconfig" PKG_CONFIG_PATH="" \
              cmake -S Tests/PackageConsumer -B build-package-consumer-bundled \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_PREFIX_PATH="$PWD/$SDK"
            cmake --build build-package-consumer-bundled --parallel 2
            exe2=build-package-consumer-bundled/PackageConsumer
            [ "${{ runner.os }}" = "Windows" ] && exe2="$exe2.exe"
            set +e
            PATH="$PWD/$SDK/bin:$PWD/$SDK/deps/bin:$PATH" "$exe2"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "::error::PackageConsumer built against the bundled files exited with status $status"
              exit "$status"
            fi
          fi

      # The SDK: that install prefix, with the page that explains it, the
      # licenses and the consumer example, packed so an application outside
      # this repository - or UltraCanvasStart setting a machine up - gets the
      # framework built without building it (Docs/UltraCanvasSDK.md). tar on
      # Unix so file permissions survive; upload-artifact's own zip loses them.
      - name: Pack the SDK
        run: |
          set -eu
          cp Docs/UltraCanvasSDK.md "$SDK_NAME/README.md"
          cp LICENSE THIRD_PARTY_LICENSES.md "$SDK_NAME/"
          mkdir -p "$SDK_NAME/examples"
          cp -R Tests/PackageConsumer "$SDK_NAME/examples/PackageConsumer"
          mkdir -p sdk-dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            zip -qr "sdk-dist/$SDK_NAME.zip" "$SDK_NAME"
          else
            tar czf "sdk-dist/$SDK_NAME.tar.gz" "$SDK_NAME"
          fi
          ls -la sdk-dist

      - name: Upload the SDK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SDK_NAME }}
          path: sdk-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # What the cache actually did, in the log where anyone can see it. A
      # leg still at a 0% hit rate on a second run of the same commit is
      # misconfigured rather than merely cold, and the counters are the only
      # way to tell those apart. `always()` so a failed build reports them
      # too - "did it even use the cache" is the first question there as well.
      - name: ccache statistics
        if: always()
        run: ccache -s

      # UltraCanvasStart's engine tests, then the app's headless --check on
      # this leg's platform: it detects the runner, finds its package manager
      # and checks the toolchain and core libraries, which the leg has by
      # construction, so a non-zero status names a detection or check bug.
      # The engine test binary is a ctest entry (UltraCanvasStartEngine);
      # Linux runs it again with the rest of the suite below, which is fine.
      # The job's default shell: the MSYS2 shell on Windows, where the DLLs
      # the executable needs are on PATH.
      - name: UltraCanvasStart engine tests and --check smoke run
        run: |
          set -eu
          (cd build && ctest --output-on-failure --no-tests=error -R "^UltraCanvasStartEngine$")
          exe=build/UltraCanvasStart
          [ "${{ runner.os }}" = "Windows" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --check
          "$exe" --plan --for ${{ runner.os == 'Linux' && 'windows' || 'linux' }} > /dev/null

      - name: Run UltraNet tests
        if: runner.os != 'Windows'
        working-directory: build
        run: ctest --output-on-failure -R UltraNet

      # ULTRACANVAS_BUILD_ULTRAMAIL_TESTS likewise (UltraMailEngine): it was
      # built by nobody until 2026-09-28, and a test expecting Gmail to take a
      # typed password had been failing unseen for five days. Its vault tests
      # need libsodium, which every row installs.
      #
      # ULTRACANVAS_BUILD_EMAILCLEANER_TESTS is on for every row, not just the
      # Linux one that runs ctest (Windows runs it and UltraMail's, in their own step below):
      # the suite is headless (no display, no network), so building it on
      # macOS and Windows costs seconds and gates
      # the thing those rows uniquely exercise — the STATIC UltraCanvas link,
      # where the core archive has to follow UltraNet on the link line.
      #
      # Everything else registered with CTest. Until now only UltraNet ran, so
      # the crypto, authenticator, document and diagram suites — several hundred
      # assertions, including the RFC vectors behind TOTP and the vault's
      # tamper-detection checks — were built by nobody and run by nobody. A
      # refactor could have broken any of them silently.
      #
      # Deliberately not filtered to a list of known-good suites: a new suite
      # should be gated the moment it is added, rather than waiting for someone
      # to remember to add it here.
      #
      # Linux only for now. The suites are platform-independent algorithms, so
      # one platform gates the logic; the other runners still prove the code
      # builds everywhere.
      # The multi-user acceptance test forks two clients at one database and
      # checks that no document number is handed out twice. It needs a real
      # server: SQLite serialises writers, so the bug it catches - two
      # transactions reading one counter and both writing back the same
      # successor - cannot occur there and did not, for as long as the suite
      # was SQLite-only. Without these variables the test reports SKIP and
      # passes, so the step after ctest asserts it actually ran.
      - name: Start PostgreSQL for the multi-user tests (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo systemctl start postgresql || sudo service postgresql start
          # **The role must be named after the OS user.** Ubuntu ships
          # `local all all peer` in pg_hba.conf, so a unix-socket connection is
          # authenticated by the operating-system account and a role with any
          # other name is refused before a password is even considered. The
          # first run of this step created `fibuci`, which existed and could
          # not be used: "Peer authentication failed".
          #
          # The name is taken from the runner rather than written as `runner`,
          # so a change of account surfaces as this step failing instead of as
          # a test that quietly cannot connect.
          PGUSER_NAME="$(whoami)"
          sudo -u postgres createuser --createdb "$PGUSER_NAME"
          sudo -u postgres createdb -O "$PGUSER_NAME" ultrafibu_ci
          echo "ULTRAFIBU_TEST_PG_USER=$PGUSER_NAME" >> "$GITHUB_ENV"
          # Prove the connection the tests will make actually works, here,
          # where the error names the cause - rather than inside ctest, where
          # it arrives as one line with no diagnosis.
          psql -h /var/run/postgresql -p 5432 -d ultrafibu_ci -c 'SELECT 1' >/dev/null

      # macOS and Windows build no full test suite (BUILD_TESTS is Linux-only);
      # ULTRACANVAS_BUILD_VECTOR_FORMAT_TESTS builds these two anyway, so the
      # vendored libcdr is exercised there on real files: detailed.cdr has to
      # arrive with its masked bitmaps and PowerClips (VectorFormatsPluginTest),
      # and our CDR writer's output has to parse (CDRWriterTest). Linux runs
      # them in the full pass below.
      - name: Run CDR tests (macOS/Windows)
        if: runner.os != 'Linux'
        working-directory: build
        run: ctest --output-on-failure --no-tests=error -R "^(VectorFormatsPluginTest|CDRWriterTest)$"

      # The file display against Thai, CJK and emoji names, on Windows: the
      # name-encoding test writes such files to a real folder and lists it
      # through UltraCanvasFilerWidget, which on Windows goes through the
      # UTF-16 file APIs - and through the runner's code page 1252 wherever a
      # conversion was missed. The host-icons test asks the real shell for
      # its icons, the shortcut test reads .lnk files on the system they
      # come from, and the history test keeps UltraFiler's recently-used lists
      # under %APPDATA%. ULTRACANVAS_BUILD_FILER_TESTS builds the five without
      # the Linux-only BUILD_TESTS; Linux runs them in the full pass.
      - name: Run Filer tests (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: ctest --output-on-failure --no-tests=error -R "^(FilerFolderPreviewTest|FilerNameEncodingTest|FilerHostIconsTest|FilerShortcutEntryTest|FilerHistoryTest)$"

      # EmailCleaner's and UltraMail's engine suites on Windows. Both were
      # built here (see the note above "Run UltraNet tests") but only Linux
      # ran them, so the code that most needs Windows - account, mail, body
      # and attachment cache paths with Thai and emoji names, opened through
      # the UTF-16 file APIs on a code page 1252 runner - was checked on the
      # platform where it cannot fail. Both suites are headless: no display,
      # no network, temp folders only.
      #
      # UltraNetPluginHostImports reads each plug-in DLL's import table: a
      # plug-in must import nothing from the core (libUltraCanvas, UltraNet)
      # and no core function from any DLL - everything reaches the core
      # through the UltraNetPluginHost table. Python comes from MSYS2 (the
      # test is registered only when CMake finds it, hence --no-tests=error).
      - name: Run EmailCleaner, UltraMail and plug-in import tests (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: ctest --output-on-failure --no-tests=error -R "^(EmailCleanerEngine|UltraMailEngine|UltraNetPluginHostImports|UltraNetPluginHostImportsSelfTest)$"

      # The credential vault every app keeps its passwords in (UltraVault's
      # DeviceKeyVault): its device key's path reached the filesystem through
      # the ANSI code page until 2026-10, so a profile folder named in Thai or
      # Cyrillic never opened its vault. The suite creates and reopens a vault
      # in a Thai-and-emoji folder - a test only on this code page 1252
      # runner - and checks the unlock status on every path. Headless, temp
      # folders only; libsodium is installed above.
      - name: Run UltraVaultTests (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: ctest --output-on-failure --no-tests=error -R "^UltraVaultTests$"

      # PathToUtf8 / PathFromUtf8 exist for Windows: with this toolchain's
      # libc++, `path.string()` threw "__wide_to_char: Illegal byte sequence"
      # on a name outside the ANSI code page and quit UltraFiler. The runner's
      # code page is 1252, which has no Thai or emoji, so creating, listing
      # and opening the test's Thai-and-emoji file here runs that exact case.
      # The test is header-only, so it compiles in one line instead of
      # needing the Linux-only BUILD_TESTS.
      - name: Run PathUtf8Test (Windows)
        if: runner.os == 'Windows'
        run: |
          clang++ -std=c++17 -Wall -Wextra -IUltraCanvas/include \
              Tests/PathUtf8Test.cpp -o build/PathUtf8Test.exe
          ./build/PathUtf8Test.exe

      # UCZipPackageReader (CorelDRAW thumbnails, ODT/DOCX/XLSX import) opens
      # its file through OpenFileUtf8. miniz's own open, used before, made a
      # Thai or emoji name depend on the toolchain, and on this one opened
      # with _wfopen_s, which locks other programs out of writing the file
      # while it is read - the test writes it from a second handle to prove
      # that is gone. Compiled by hand like PathUtf8Test, on code page 1252.
      - name: Run ZipPackageTest (Windows)
        if: runner.os == 'Windows'
        run: |
          clang -c UltraCanvas/third_party/miniz/miniz.c -o build/ZipPackageTest-miniz.o
          clang++ -std=c++20 -Wall -Wextra -IUltraCanvas/include \
              -IUltraCanvas/third_party/miniz \
              Tests/ZipPackageTest.cpp UltraCanvas/core/UltraCanvasZipPackage.cpp \
              build/ZipPackageTest-miniz.o -o build/ZipPackageTest.exe
          ./build/ZipPackageTest.exe

      # ippeveprinter stops with "Unable to initialize DNS-SD" when no daemon is
      # running, so IODevicePrinterIPPLiveTest needs Avahi up. Installing the
      # package normally starts it; this makes sure, and fails here - where the
      # cause is named - rather than as a skip inside ctest.
      - name: Start Avahi for the live IPP printer test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo systemctl start avahi-daemon || sudo service avahi-daemon start
          avahi-daemon --check
          # ippeveprinter also listens on IPv6 and exits if it cannot; say so
          # here if the runner has no IPv6 loopback.
          ip -6 addr show dev lo | grep -q '::1' || echo "::warning::no IPv6 loopback - ippeveprinter will not start"

      - name: Run unit tests
        if: runner.os == 'Linux'
        working-directory: build
        env:
          # IODevicePrinterIPPLiveTest prints to a real ippeveprinter; a skip
          # would look like a pass, so forbid it, as for the database test.
          ULTRACANVAS_TEST_IPP_REQUIRED: 1
          ULTRAFIBU_TEST_PG_HOST: /var/run/postgresql
          ULTRAFIBU_TEST_PG_PORT: 5432
          # ULTRAFIBU_TEST_PG_USER comes from the step above via GITHUB_ENV:
          # naming it here would override it, which is how it ends up wrong.
          ULTRAFIBU_TEST_PG_DB: ultrafibu_ci
          # A skip here is indistinguishable from a pass, so forbid it.
          ULTRAFIBU_TEST_PG_REQUIRED: 1
        run: ctest --output-on-failure 2>&1 | tee ctest.log

      # ULTRAFIBU_TEST_PG_REQUIRED above turns a skip into a failure, so ctest
      # already covers "it ran". What it cannot cover is the test not existing
      # at all, which is what happens when libpq is missing at configure time.
      - name: Verify the multi-user test was registered (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        shell: bash
        run: |
          set -eu
          # [ .] after the name, so UltraFIBUServerLogin cannot stand in for it.
          for t in UltraFIBUServer UltraFIBUServerLogin; do
            if ! grep -qE "${t}[ .]" ctest.log; then
              echo "::error::the $t test was not registered - libpq missing at configure time?"
              exit 1
            fi
          done
          echo "multi-user acceptance test and server-login test are registered and ran"

      # VideoFX builds from a stub when FFmpeg is missing, and its test then
      # passes on the filter-text checks alone - a green run that exercised no
      # engine. Make the Linux rows prove the engine was built and tested.
      - name: Verify the VideoFX engine was built and tested (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          if ! grep -q "VideoFX: FFmpeg .* found - engine enabled" configure.log; then
            echo "::error::VideoFX was configured without FFmpeg - are the libav*-dev packages installed?"
            exit 1
          fi
          if ! grep -qE "VideoFXTest[ .]" build/ctest.log; then
            echo "::error::VideoFXTest did not run"
            exit 1
          fi
          echo "VideoFX engine built and VideoFXTest ran"

      # AnchorPoint is its own CMake project and not part of the build above,
      # so nothing here built it: its standalone link broke (UltraCrypt had
      # started calling the shared Base32 codec) and nobody saw. Build the core
      # and CLI the way its README says, and run the protocol tests - they
      # replay hostile file names against the receiver. Needs only libsodium,
      # which is installed above.
      - name: AnchorPoint core, CLI and protocol tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          cmake -S Apps/AnchorPoint -B build-anchorpoint \
            -DANCHORPOINT_BUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-anchorpoint --parallel
          ctest --test-dir build-anchorpoint --output-on-failure

      # Bundle all apps into the portable multi-executable tree. Reuses the
      # already-built shared `build` dir (SKIP_BUILD=1) rather than rebuilding.
      - name: Package portable Linux bundle (Linux)
        if: runner.os == 'Linux'
        run: BUILDDIR="$PWD/build" SKIP_BUILD=1 ./package-linux.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: ./package-win.sh --no-sign

      # What the package weighs, and where the weight is: the core library
      # (one shared copy of the framework and the modules folded into it), the
      # application executables in total and each one. In the job summary
      # next to the macOS suite table, so an app that has grown a second copy
      # of the framework - a module archive linked beside the shared core, a
      # static core - shows up on the run page as a fat executable.
      - name: Package sizes (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            pkg=dist; core=$(ls dist/libUltraCanvas.dll dist/UltraCanvas.dll 2>/dev/null | head -1 || true)
            apps=$(find dist -maxdepth 1 -name '*.exe' | sort)
            archive=$(ls UCDemo-Windows-*.zip 2>/dev/null | head -1 || true)
          else
            pkg=$(ls -d dist/UltraCanvas-Linux-*/ | head -1); pkg=${pkg%/}
            core=$(ls "$pkg"/lib/libUltraCanvas.so.* 2>/dev/null | grep -v '\.so\.[0-9]*$' | head -1 || true)
            [ -n "$core" ] || core=$(ls "$pkg"/lib/libUltraCanvas.so* 2>/dev/null | head -1 || true)
            apps=$(find "$pkg/bin" -maxdepth 1 -type f -perm -u+x ! -name '*.so*' | sort)
            archive=$(ls dist/UltraCanvas-Linux-*.tar.gz 2>/dev/null | head -1 || true)
          fi
          kb() { du -sk "$1" | cut -f1; }
          mb() { awk -v k="$1" 'BEGIN { printf "%.1f MB", k / 1024 }'; }
          total=0; rows=""
          for app in $apps; do
            k=$(kb "$app"); total=$((total + k))
            rows+="| $(basename "$app") | $(mb "$k") |"$'\n'
          done
          {
            echo "### Package sizes (${{ runner.os }} ${{ matrix.arch_label }})"
            echo ""
            echo "| Item | Size |"
            echo "|---|---:|"
            [ -n "$archive" ] && echo "| **$(basename "$archive")** (download) | $(mb "$(kb "$archive")") |"
            echo "| $pkg/ (unpacked) | $(mb "$(kb "$pkg")") |"
            if [ -n "$core" ]; then
              echo "| $(basename "$core") (the shared core) | $(mb "$(kb "$core")") |"
            else
              echo "| (no shared core library in the package) | |"
            fi
            echo "| application executables, $(echo "$apps" | wc -l | tr -d ' ') in total | $(mb "$total") |"
            printf '%s' "$rows"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Release builds only, so a pull request never decodes the signing
      # certificate onto a runner it does not need it on.
      - name: Import code signing certificate (macOS)
        if: runner.os == 'macOS' && env.RELEASE_BUILD == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Decode base64 .p12 from the secret
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create + unlock a temporary keychain (avoids touching the runner's login keychain)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain
          security set-keychain-settings -lut 21600 $RUNNER_TEMP/build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain

          # Import the cert and grant codesign access without UI prompts
          security import $RUNNER_TEMP/certificate.p12 \
            -k $RUNNER_TEMP/build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/build.keychain

          # Make the temp keychain searchable for codesign (prepend to existing search list)
          security list-keychains -d user -s $RUNNER_TEMP/build.keychain $(security list-keychains -d user | sed s/\"//g)

          rm $RUNNER_TEMP/certificate.p12

      # A pull request packages the same bundle without the Developer ID -
      # which is what the Windows row above has always done with --no-sign.
      # On macOS --no-sign signs ad hoc (no certificate, no network), so the
      # bundles are still sealed and `codesign --verify --strict` still checks
      # them here rather than first on main. A browser-downloaded ad-hoc app
      # is refused by Gatekeeper ("is damaged" on Apple silicon), so the image
      # and the artifact are named *-unsigned and the image says how to open
      # it - see "Unsigned builds" in package-macos.sh.
      #
      # Signing and notarization are network calls to Apple: `codesign`
      # contacts the timestamp service, and `notarytool submit --wait` uploads
      # the bundle and then polls appstoreconnect until Apple answers. Both
      # ran on every PR build, and on 2026-09-11 they failed four times in one
      # afternoon across four different pull requests - twice on the timestamp
      # service and twice on the notary, each time with the build and the whole
      # test suite already green. A red check that says nothing about the diff
      # trains reviewers to ignore red checks, and each one cost a re-run of a
      # 40-minute macOS job.
      #
      # Nothing about the packaging itself is skipped: the app bundles are
      # still assembled, the dylibs still collected and relinked, the artifact
      # still uploaded. Only the two steps that ask Apple a question are gone,
      # so a PR still proves package-macos.sh runs end to end.
      - name: Package (macOS, unsigned - pull requests and manual runs)
        if: runner.os == 'macOS' && env.RELEASE_BUILD != 'true'
        run: ./package-macos.sh --no-sign --dmg

      - name: Package (macOS, signed and notarized - push to main)
        if: runner.os == 'macOS' && env.RELEASE_BUILD == 'true'
        env:
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./package-macos.sh --notarize --dmg

      # Unconditional on macOS, and `|| true` inside: on a run that never
      # imported a certificate there is no keychain to delete, and this must
      # not be the step that turns such a run red.
      - name: Cleanup keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true

      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: UCDemo-Windows-${{ env.VERSION }}-${{ matrix.arch_label }}
          path: |
            dist/
          retention-days: 7

      # The disk image only, not the dist-macos/ folders: upload-artifact
      # does not keep file permissions, so an app unpacked from a zip of the
      # .app folders has lost its executable bit and does not start. The DMG
      # keeps it, is already LZMA-compressed (hence compression-level 0 -
      # zipping it again only costs time) and is signed, and on main
      # notarized and stapled, as one file. Anywhere but main it is not, and
      # the name says so: a pull request's image used to carry the release's
      # exact name, so UCDemo-MacOS-0.9.147-arm64 was both a notarized build
      # and one macOS calls "damaged".
      - name: Upload build artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: UCDemo-MacOS-${{ env.VERSION }}-${{ matrix.arch_label }}${{ env.RELEASE_BUILD != 'true' && '-unsigned' || '' }}
          path: dist-macos/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: UltraCanvas-Linux-${{ env.VERSION }}-${{ matrix.arch_label }}
          path: dist/UltraCanvas-Linux-${{ env.VERSION }}-${{ matrix.arch_label }}.tar.gz
          retention-days: 7

  # ===== ANDROID BACKEND CHECK =====
  # Separate job, not a matrix row (investigation §5): there is no
  # cross-compiled dependency sysroot yet, so a full Android build is not
  # possible in CI. Until it exists, this is the anti-rot gate the plan
  # requires (§6 lesson 1): every OS/Android translation unit is type-checked
  # with the REAL NDK toolchain/headers (the runner preinstalls an NDK), and
  # the Android CMake arms are exercised in a configure-only pass. Catches
  # base-class signature drift, NDK API misuse, __linux__/__ANDROID__
  # ordering regressions, and CMake breakage - not link errors.
  android-check:
    name: Android backend check
    needs: gate
    if: needs.gate.outputs.pending == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Install host dependency headers
        # Normally 20 s; 8 min on a slow mirror day (2026-10-07).
        timeout-minutes: 20
        run: |
          scripts/ci-apt.sh update
          scripts/ci-apt.sh install cmake pkg-config \
            libcairo2-dev libpango1.0-dev libfontconfig-dev libglib2.0-dev \
            libtinyxml2-dev libfreetype-dev libfmt-dev libssl-dev \
            libcurl4-openssl-dev libc-ares-dev

      - name: Syntax-check OS/Android against the NDK
        run: scripts/android-syntax-check.sh "$ANDROID_NDK_LATEST_HOME"

      - name: Compile the Android backend's Java against android.jar
        # UltraCanvasActivity is loaded by name and called over JNI, so no
        # other build step ever type-checks it (the runner preinstalls an SDK).
        run: scripts/android-java-check.sh

      - name: Configure-only test of the Android CMake arms
        # -DANDROID=1 stands in for the toolchain file (host compilers, host
        # pkg-config deps): validates platform detection, the glue-source
        # wiring, forced-off GL/plugins, and the UltraNet Android arm with
        # c-ares present. A full toolchain configure needs the dep sysroot.
        run: |
          cmake -B build-android-cfgtest \
            -DANDROID=1 \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" \
            -DULTRACANVAS_ENABLE_NET=ON
