name: Doc examples

# Compiles the C++ in the docs (Docs/UltraCanvas/*.md, but the changelog,
# and the module docs CHECKED_MODULE_DOCS lists) against the public headers,
# so a doc cannot drift from the API it describes: a renamed function, a
# changed signature or a removed field in a header fails here instead of in
# the next reader's build. A header's usage example is compiled too when it
# is marked `// doc-check: example`.
# scripts/check_doc_examples.py says what it checks and how a doc or a
# header declares what its snippets assume.
#
# A finding fails unless it is listed in scripts/doc_examples_baseline.txt.
# Every component doc passes and must stay that way: fix the doc, or declare
# what its snippets assume in a <!-- doc-check: ... --> comment. What the
# baseline lists is the design documents (Proposal, Plan, Investigation),
# whose code is of APIs not written yet; an entry that stops being found
# means its API now exists, and fails the check until the file is rewritten
# (--all --update-baseline), so the file stays the list of what the
# proposals still wait for.
#
# Pinned to ubuntu-24.04: the docs pass against clang 18 and that release's
# library headers; a baseline entry, should one ever be needed, is clang's
# wording, which another clang words differently.

# Trigger policy matches path-strings.yml: `pull_request` covers feature
# branches, so listing them under `push` too would run this check twice per
# commit. The paths are what the docs are checked against.
on:
  push:
    branches: [main]
    paths: &paths
      - 'Docs/UltraCanvas/*.md'
      - 'Docs/Modules/FileLoader/*.md'   # scripts/check_doc_examples.py CHECKED_MODULE_DOCS
      - 'UltraCanvas/include/**'
      - 'UltraCanvas/Plugins/**/*.h'
      - 'UltraCanvas/third_party/**/*.h'
      - 'VirtualFS/include/**'
      - 'Apps/DemoApp/**/*.h'
      - 'scripts/check_doc_examples.py'
      - 'scripts/doc_examples_baseline.txt'
      - '.github/workflows/doc-examples.yml'
  pull_request:
    branches:
      - main
      - 'claude/**'
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The system headers the public headers include (found with clang -M
      # on the checker's umbrella header), plus FreeType, which pkg-config is
      # asked for, and the GL headers two docs include.
      - name: Install clang and the headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config \
            libglib2.0-dev libcairo2-dev libpango1.0-dev libharfbuzz-dev \
            libfreetype6-dev libvips-dev libcurl4-openssl-dev libx11-dev \
            libgl1-mesa-dev
      # The precompiled header of all public headers takes the checker about
      # a minute to build and is the same for every run on the same headers,
      # flags and clang - which is what --pch-key digests, and what the checker
      # reuses a header by, after one compile against it to be sure. Clang
      # holds a precompiled header to the mtime of every file it read, and a
      # checkout stamps every file with the time of the checkout, so every
      # tracked file is given one fixed mtime first: the restored header then
      # sees the files it was built from. The entry is small (the header
      # compresses well) and a pull request that changes headers reuses its
      # own on the next push, so every run saves on a miss - unlike ccache in
      # build.yml, whose gigabyte entries from pull requests evicted main's.
      - name: Give every tracked file one fixed mtime
        run: git ls-files -z | xargs -0 touch -h -d '2000-01-01T00:00:00Z'
      - name: Key of the precompiled header
        id: pch
        run: echo "key=doc-examples-pch-$(python3 scripts/check_doc_examples.py --pch-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the precompiled header
        id: pch-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/doc-examples/umbrella.h
            build/doc-examples/umbrella.h.pch
            build/doc-examples/umbrella.stamp
          key: ${{ steps.pch.outputs.key }}
      - name: Check the docs' C++
        run: python3 scripts/check_doc_examples.py --all --strict
      - name: Save the precompiled header
        if: always() && steps.pch-cache.outputs.cache-hit != 'true' && hashFiles('build/doc-examples/umbrella.stamp') != ''
        uses: actions/cache/save@v5
        with:
          path: |
            build/doc-examples/umbrella.h
            build/doc-examples/umbrella.h.pch
            build/doc-examples/umbrella.stamp
          key: ${{ steps.pch.outputs.key }}
