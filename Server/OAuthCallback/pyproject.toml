[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultraos-oauth-callback"
version = "1.0.0"
description = "The ULTRA OS OAuth sign-in service: holds the mail providers' OAuth client registrations and receives their redirects for UltraMail"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
oauth-callback = "oauth_callback.__main__:main"

[tool.setuptools.packages.find]
include = ["oauth_callback*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
