# nginx in front of the ULTRA OS OAuth sign-in service.
#
#   /etc/nginx/sites-available/oauth-callback.ultraos.eu  ->  sites-enabled/
#
# TLS: `certbot --nginx -d oauth-callback.ultraos.eu` fills the certificate
# lines in; the server block below is what certbot starts from. The service
# itself listens on 127.0.0.1:8787 (deploy/oauth-callback.service).

limit_req_zone $binary_remote_addr zone=oauth_callback:1m rate=30r/m;

# The providers' redirects carry the authorization code in the query string:
# those requests stay out of the access log. The log itself is deleted after
# 14 days by deploy/logrotate, which is what the privacy notice promises.
map $request_uri $oauth_callback_loggable {
    default        1;
    ~^/callback/   0;
}

server {
    listen 80;
    listen [::]:80;
    server_name oauth-callback.ultraos.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oauth-callback.ultraos.eu;

    # ssl_certificate     /etc/letsencrypt/live/oauth-callback.ultraos.eu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/oauth-callback.ultraos.eu/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # The pages carry no scripts, so nothing may run.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;

    access_log /var/log/nginx/oauth-callback.access.log combined if=$oauth_callback_loggable;
    error_log  /var/log/nginx/oauth-callback.error.log;

    location / {
        # Starting a sign-in and exchanging a token are what a stranger could
        # hammer; the burst lets one application's two or three calls through.
        limit_req zone=oauth_callback burst=20 nodelay;

        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # A session poll holds the connection for up to 30 s (?wait=30).
        proxy_read_timeout 60s;
        client_max_body_size 16k;
    }
}
