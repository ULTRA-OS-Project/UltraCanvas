# /etc/nginx/sites-available/chatcube-relay
server {
    listen 443 ssl http2;
    server_name relay.chatcube.example.org;

    ssl_certificate     /etc/letsencrypt/live/relay.chatcube.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.chatcube.example.org/privkey.pem;

    client_max_body_size 16m;   # a batch of group copies, not files

    location /v1/ws {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
