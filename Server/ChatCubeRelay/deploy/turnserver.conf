# coturn for ChatCube: STUN, and TURN only when no direct path exists.
# It stores nothing and knows no users; the relay mints short-lived
# credentials with the shared secret below (CHATCUBE_RELAY_TURN_SECRET).
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=change-me
realm=turn.chatcube.example.org
cert=/etc/letsencrypt/live/turn.chatcube.example.org/fullchain.pem
pkey=/etc/letsencrypt/live/turn.chatcube.example.org/privkey.pem
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
