# The UltraAI model server behind nginx. Model files are tens of gigabytes:
# no body size limit and no request buffering on the admin API, so an
# upload streams straight through to the service, which hashes it as it
# arrives.
server {
    listen 443 ssl http2;
    server_name models.example.org;

    ssl_certificate     /etc/letsencrypt/live/models.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/models.example.org/privkey.pem;

    location /v1/admin/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The gallery, the catalogue, the topics and the files: read by every
    # client, answered by the service (a file only while a published model
    # offers it), cached by nginx for a few minutes.
    location / {
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
