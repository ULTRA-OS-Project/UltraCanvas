[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultraai-model-server"
version = "0.2.0"
description = "The UltraAI model server: the engines, models and topics UltraAI clients install from, managed by UltraAI ServerAdmin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ultraai-model-server = "ultraai_models.__main__:main"

[tool.setuptools.packages.find]
include = ["ultraai_models*"]

[tool.setuptools.package-data]
ultraai_models = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
