# Inside the store's server block (Server/UltraStorePay/deploy/nginx.conf):
# the marketplace service behind /market/.
location /market/ {
    proxy_pass http://127.0.0.1:8792/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A package uploaded with a submission comes through here: the service's
    # ULTRASTORE_MARKET_MAX_PACKAGE_MB, plus a little.
    client_max_body_size 520m;
    proxy_request_buffering off;
}
