[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrastore-market"
version = "0.2.0"
description = "The UltraStore marketplace service: the operator tier's merchants, submissions, reports, notices, terms and the hash-chained audit log"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42",
    "ultrastore-db>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]

[project.scripts]
ultrastore-market = "ultrastore_market.__main__:main"

[tool.setuptools.packages.find]
include = ["ultrastore_market*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
