[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrastore-pay"
version = "0.1.0"
description = "The UltraStore payment service: a Skrill Quick Checkout session per purchase, the status report verified, the code redeemed, the licence and the receipt issued, the sales handed to the admin backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ultrastore-pay = "ultrastore_pay.__main__:main"

[tool.setuptools.packages.find]
include = ["ultrastore_pay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
