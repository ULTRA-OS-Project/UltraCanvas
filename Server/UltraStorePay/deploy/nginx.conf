# The store's web server: the publish folder as the document root, the
# payment service behind /pay and /v1, and restricted/ served only with a
# signed URL the payment service made (secure_link_md5, the secret in
# ULTRASTORE_PAY_RESTRICTED_SECRET). Adjust the names and the certificate.
server {
    listen 443 ssl http2;
    server_name store.example;
    ssl_certificate     /etc/letsencrypt/live/store.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.example/privkey.pem;

    root /srv/store;                       # the publish folder: v1/catalog.json, v1/packages/, v1/media/, v1/go/

    # The packages of paid apps: a URL signed by the payment service, for ten minutes.
    location /v1/restricted/ {
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri nginx-secret";   # the same secret as ULTRASTORE_PAY_RESTRICTED_SECRET
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }
    }

    # The payment service (ultrastore-pay.service on 127.0.0.1:8791).
    location /pay/ { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /v1/skrill/ { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /v1/checkout { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /v1/orders/ { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /v1/sales { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /v1/keys { proxy_pass http://127.0.0.1:8791; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /healthz { proxy_pass http://127.0.0.1:8791; }
}
