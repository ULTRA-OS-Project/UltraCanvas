# The store's web server: one host, https://store.ultraos.eu, and everything
# under it. nginx serves the files (the pictures, the stylesheet, the
# packages of published releases) and hands the rest to the portal
# (ultrastore-portal.service on 127.0.0.1:8794). Adjust the certificate.
server {
    listen 80;
    server_name store.ultraos.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name store.ultraos.eu;
    ssl_certificate     /etc/letsencrypt/live/store.ultraos.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.ultraos.eu/privkey.pem;

    # Icons and screenshots (ULTRASTORE_PORTAL_DATA_DIR/media): uploaded by
    # publishers, so never run or guessed at - pictures only.
    location /media/ {
        alias /var/lib/ultrastore-portal/media/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'";
        expires 30d;
    }
    location /static/ {
        alias /var/lib/ultrastore-portal/static/;
        expires 1d;
    }

    # The packages of published releases, laid out by the publish under
    # their hash: the name is the content, so they are cached for good.
    location /v1/packages/ {
        alias /var/lib/ultrastore-portal/public/v1/packages/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # The packages of paid apps without a trial: to nobody, until the portal
    # sells and hands a buyer a signed link.
    location /v1/restricted/ {
        return 403;
    }

    # Everything else is the portal: the store's pages, the console, the
    # operator's pages, /v1/catalog.json and the rest of the JSON service.
    location / {
        proxy_pass http://127.0.0.1:8794;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A package upload comes through here: ULTRASTORE_PORTAL_MAX_PACKAGE_MB, plus a little.
        client_max_body_size 520m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
