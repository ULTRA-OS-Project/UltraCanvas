[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrastore-portal"
version = "0.10.0"
description = "The UltraStore portal: the publishers' console, the operator's review, the store's web pages, buying, the catalog as a JSON service, and the account every ULTRA OS service signs in with (OpenID Connect), in one Django application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Django>=5.2,<5.3",
    "cryptography>=42",
    "Pillow>=10",
]

[project.optional-dependencies]
server = ["gunicorn>=22"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["mysqlclient>=2.2"]

[project.scripts]
ultrastore-portal = "ultrastore_portal.__main__:main"

[tool.setuptools.packages.find]
include = ["ultrastore_portal*"]

[tool.setuptools.package-data]
ultrastore_portal = ["templates/**/*", "static/**/*"]
