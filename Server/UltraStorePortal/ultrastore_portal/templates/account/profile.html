{% extends "base.html" %}
{% block title %}Your account - UltraStore{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Your account</h1>
  <p class="text-secondary">Signed in as {{ user.email }}.</p>
  <form method="post" class="mt-4">
    {% csrf_token %}{% include "_form.html" %}
    <button class="btn btn-primary">Save</button>
  </form>
  <div class="mt-4 d-grid gap-1 small">
    <div><a href="{% url 'account:password_change' %}">Change the password</a></div>
    <div><a href="{% url 'console:home' %}">Developer console</a></div>
  </div>
</div>
{% endblock %}
