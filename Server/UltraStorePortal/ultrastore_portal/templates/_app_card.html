<a class="card" href="{{ app.get_absolute_url }}">
  {% if app.icon %}<img class="icon s64" src="{{ app.icon.url }}" alt="" width="64" height="64" loading="lazy">{% else %}<span class="icon s64">{{ app.name|slice:":1" }}</span>{% endif %}
  <span>
    <span class="name">{{ app.name }}</span>
    <span class="line">{{ app.summary }}</span>
    <span class="meta"><span>{{ app.publisher.name }}</span><span class="price">{{ app.price_label }}</span></span>
  </span>
</a>
