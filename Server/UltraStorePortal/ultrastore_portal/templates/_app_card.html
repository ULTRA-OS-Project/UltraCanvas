<a class="card app-card h-100" href="{{ app.get_absolute_url }}">
  {% if app.icon %}<img class="app-icon" src="{{ app.icon.url }}" alt="" width="64" height="64" loading="lazy">{% else %}<span class="app-icon">{{ app.name|slice:":1" }}</span>{% endif %}
  <span class="min-w-0">
    <span class="name d-block">{{ app.name }}</span>
    <span class="line">{{ app.summary }}</span>
    <span class="d-flex flex-wrap gap-2 align-items-center small text-secondary"><span>{{ app.publisher.name }}</span><span class="price">{{ app.price_label }}</span></span>
  </span>
</a>
