[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrastore-db"
version = "0.2.0"
description = "The database layer of the UltraStore services: one interface over MySQL, PostgreSQL and SQLite (tests and development only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]

[tool.setuptools.packages.find]
include = ["ultrastore_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
