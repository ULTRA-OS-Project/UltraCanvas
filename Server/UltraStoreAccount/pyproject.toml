[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrastore-account"
version = "0.2.0"
description = "The UltraStore account service: the people with an account, their machines, two-factor sign-in, the licences that follow them, their notices, archive and deletion, and the operator's users page"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42",
    "ultrastore-db>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]

[project.scripts]
ultrastore-account = "ultrastore_account.__main__:main"

[tool.setuptools.packages.find]
include = ["ultrastore_account*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
