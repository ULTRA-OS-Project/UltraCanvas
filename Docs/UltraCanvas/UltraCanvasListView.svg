<svg width="100%" viewBox="0 0 680 604" role="img" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>UltraCanvasListView three-piece architecture</title>
<desc>UltraCanvasListView is built from three independent pieces: a model supplies the data, a delegate decides how a single row is drawn, and a selection object defines what the user can select. Swapping any one of them yields a different list without touching the other two.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-size:14px;font-weight:400}
.ts{font-size:12px;font-weight:400}
.th{font-size:14px;font-weight:500}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray text{fill:#2C2C2A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}
.c-purple text{fill:#26215C}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal text{fill:#04342C}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}
.c-coral text{fill:#4A1B0C}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
</defs>

<g class="c-gray">
<rect x="40" y="40" width="600" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">UltraCanvasListView</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">The view owns layout, scrolling and input — nothing more</text>
</g>
<line x1="340" y1="88" x2="340" y2="112" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="40" y="112" width="600" height="216" rx="12" stroke-width="0.5"/>
</g>
<text class="th" x="56" y="134" dominant-baseline="central" fill="#26215C">Three pieces, wired one by one</text>
<text class="ts" x="624" y="134" text-anchor="end" dominant-baseline="central" fill="#3C3489">SetModel() · SetDelegate() · SetSelection()</text>

<g class="c-purple"><rect x="56" y="150" width="184" height="44" rx="8" stroke-width="0.5"/><text class="th" x="148" y="165" text-anchor="middle" dominant-baseline="central">IListModel</text><text class="ts" x="148" y="181" text-anchor="middle" dominant-baseline="central">Supplies the data</text></g>
<g class="c-purple"><rect x="248" y="150" width="184" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="165" text-anchor="middle" dominant-baseline="central">IItemDelegate</text><text class="ts" x="340" y="181" text-anchor="middle" dominant-baseline="central">Draws a single row</text></g>
<g class="c-purple"><rect x="440" y="150" width="184" height="44" rx="8" stroke-width="0.5"/><text class="th" x="532" y="165" text-anchor="middle" dominant-baseline="central">IListSelection</text><text class="ts" x="532" y="181" text-anchor="middle" dominant-baseline="central">Defines what selects</text></g>

<g class="c-purple"><rect x="56" y="204" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="148" y="215" text-anchor="middle" dominant-baseline="central">GetRowCount · GetColumnCount</text></g>
<g class="c-purple"><rect x="248" y="204" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="340" y="215" text-anchor="middle" dominant-baseline="central">RenderItem(ctx, model, row)</text></g>
<g class="c-purple"><rect x="440" y="204" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="532" y="215" text-anchor="middle" dominant-baseline="central">Select · SelectRange · Clear</text></g>

<g class="c-purple"><rect x="56" y="230" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="148" y="241" text-anchor="middle" dominant-baseline="central">GetData(index, role)</text></g>
<g class="c-purple"><rect x="248" y="230" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="340" y="241" text-anchor="middle" dominant-baseline="central">GetRowHeight(model, row)</text></g>
<g class="c-purple"><rect x="440" y="230" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="532" y="241" text-anchor="middle" dominant-baseline="central">IsSelected · GetSelectedRows</text></g>

<g class="c-purple"><rect x="56" y="256" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="148" y="267" text-anchor="middle" dominant-baseline="central">SetData(index, role, value)</text></g>
<g class="c-purple"><rect x="248" y="256" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="340" y="267" text-anchor="middle" dominant-baseline="central">selected · hovered · focused</text></g>
<g class="c-purple"><rect x="440" y="256" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="532" y="267" text-anchor="middle" dominant-baseline="central">onSelectionChanged</text></g>

<g class="c-purple"><rect x="56" y="288" width="568" height="26" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="340" y="301" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Swap any one piece — the other two and the view stay untouched</text></g>

<line x1="340" y1="328" x2="340" y2="352" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="40" y="352" width="600" height="104" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="372" text-anchor="middle" dominant-baseline="central">Ready-made pieces — or implement the interface yourself</text>
</g>
<g class="c-teal"><rect x="56" y="386" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="148" y="397" text-anchor="middle" dominant-baseline="central">SimpleListModel</text></g>
<g class="c-teal"><rect x="248" y="386" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="340" y="397" text-anchor="middle" dominant-baseline="central">DefaultListDelegate</text></g>
<g class="c-teal"><rect x="440" y="386" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="532" y="397" text-anchor="middle" dominant-baseline="central">SingleSelection</text></g>

<g class="c-teal"><rect x="56" y="414" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="148" y="425" text-anchor="middle" dominant-baseline="central">MultiColumnListModel</text></g>
<g class="c-teal"><rect x="248" y="414" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="340" y="425" text-anchor="middle" dominant-baseline="central">Your own IItemDelegate</text></g>
<g class="c-teal"><rect x="440" y="414" width="184" height="22" rx="6" stroke-width="0.5"/><text class="ts" x="532" y="425" text-anchor="middle" dominant-baseline="central">MultiSelection</text></g>

<line x1="133" y1="456" x2="133" y2="496" class="arr" marker-end="url(#arrow)"/>
<line x1="547" y1="456" x2="547" y2="496" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="476" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">same view code — a different list</text>

<g class="c-coral"><rect x="40" y="496" width="186" height="68" rx="12" stroke-width="0.5"/><text class="th" x="133" y="518" text-anchor="middle" dominant-baseline="central">Plain picker</text><text class="ts" x="133" y="538" text-anchor="middle" dominant-baseline="central">Simple · Default · Single</text><text class="ts" x="133" y="554" text-anchor="middle" dominant-baseline="central" fill="#7A3117">no custom code</text></g>
<g class="c-coral"><rect x="247" y="496" width="186" height="68" rx="12" stroke-width="0.5"/><text class="th" x="340" y="518" text-anchor="middle" dominant-baseline="central">File browser</text><text class="ts" x="340" y="538" text-anchor="middle" dominant-baseline="central">MultiColumn · Icon · Multi</text><text class="ts" x="340" y="554" text-anchor="middle" dominant-baseline="central" fill="#7A3117">all three swapped</text></g>
<g class="c-coral"><rect x="454" y="496" width="186" height="68" rx="12" stroke-width="0.5"/><text class="th" x="547" y="518" text-anchor="middle" dominant-baseline="central">Colour palette</text><text class="ts" x="547" y="538" text-anchor="middle" dominant-baseline="central">Simple · Swatch · Multi</text><text class="ts" x="547" y="554" text-anchor="middle" dominant-baseline="central" fill="#7A3117">delegate swapped only</text></g>
</svg>
