<text x="394" y="436" font-size="16" font-weight="bold" fill="#0f766e" text-anchor="start">UltraCloud</text>
<text x="394" y="458" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Accounts, upload, download, share links</text>
<text x="394" y="476" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Nextcloud/ownCloud · WebDAV · FTP/SFTP</text>
<text x="394" y="494" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Dropbox · OneDrive · Google Drive (OAuth2)</text>
<text x="394" y="512" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Provider plug-ins (dlopen)</text>
<rect x="760" y="412" width="250" height="84" rx="10" fill="#e7f4ea" stroke="#15803d" stroke-width="1.6"/>
<text x="774" y="436" font-size="16" font-weight="bold" fill="#15803d" text-anchor="start">UltraMessage</text>
<text x="774" y="458" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Message bus between apps</text>
<text x="774" y="476" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">journal in UltraDatabase</text>
<text x="24" y="574" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">FOUNDATION MODULES</text>
<rect x="40" y="586" width="340" height="160" rx="10" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="54" y="610" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="start">UltraNet</text>
<text x="54" y="632" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">HTTP(S) with any verb and header, SSE</text>
<text x="54" y="650" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">OAuth2 + PKCE, shared app registry</text>
<text x="54" y="668" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">DNS incl. SRV · TLS verified by default</text>
<text x="54" y="686" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">TCP/UDP sockets, WebSocket, FTP</text>
<text x="54" y="704" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Plug-ins: webdav, smtp, imap, jmap, pop3,</text>
<text x="54" y="722" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">ssh, mqtt, amqp, sip, rtsp, mdns, …</text>
<text x="368" y="610" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">client side only</text>
<rect x="540" y="586" width="290" height="110" rx="10" fill="#fbf0e1" stroke="#b45309" stroke-width="1.6"/>
<text x="554" y="610" font-size="16" font-weight="bold" fill="#b45309" text-anchor="start">UltraDatabase</text>
<text x="554" y="632" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Named connections, migrations</text>
<text x="554" y="650" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">SQLite (local) · PostgreSQL (server)</text>
<text x="554" y="668" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">password = UltraVault key (vault:…)</text>
<rect x="990" y="586" width="280" height="110" rx="10" fill="#f1ebfd" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1004" y="610" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="start">UltraVault</text>
<text x="1004" y="632" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Secrets by key; memory + file backends</text>
<text x="1004" y="650" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">DeviceKeyVault: per-app vault that</text>
<text x="1004" y="668" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">unlocks with the device key</text>
