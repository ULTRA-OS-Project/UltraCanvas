<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>ULTRA OS IODeviceManager module overview (16:9)</title>
<desc>Structural diagram of the IODeviceManager: a full-width manager and SmartHome control layer over six sub-protocols, feeding ten device control categories arranged in two rows of five.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:15px;font-weight:500}
.ts{font-size:13px;font-weight:400}
.blue-fill{fill:#E6F1FB;stroke:#185FA5}
.blue-t{fill:#0C447C}.blue-s{fill:#185FA5}
.teal-fill{fill:#E1F5EE;stroke:#0F6E56}
.teal-sub{fill:#9FE1CB;stroke:#0F6E56}
.teal-t{fill:#085041}.teal-s{fill:#0F6E56}
.coral-fill{fill:#FAECE7;stroke:#993C1D}
.coral-sub{fill:#F3CFC2;stroke:#993C1D}
.coral-t{fill:#712B13}.coral-s{fill:#993C1D}
.amber-fill{fill:#FAEEDA;stroke:#854F0B}
.amber-sub{fill:#F2D9A6;stroke:#854F0B}
.amber-t{fill:#633806}.amber-s{fill:#854F0B}
.purple-fill{fill:#EEEDFE;stroke:#534AB7}
.purple-sub{fill:#CECBF6;stroke:#534AB7}
.purple-t{fill:#3C3489}.purple-s{fill:#534AB7}
.pchip{font-size:13px;font-weight:500}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
</defs>

<!-- Manager (full width) -->
<rect class="blue-fill" x="40" y="30" width="1200" height="64" rx="10" stroke-width="0.5"/>
<text class="th blue-t" x="640" y="52" text-anchor="middle" dominant-baseline="central">IODeviceManager</text>
<text class="ts blue-s" x="640" y="73" text-anchor="middle" dominant-baseline="central">Device discovery &amp; control</text>

<line x1="640" y1="94" x2="640" y2="122" class="arr" marker-end="url(#arrow)"/>

<!-- SmartHome control layer (full width) -->
<rect class="blue-fill" x="40" y="124" width="1200" height="64" rx="10" stroke-width="0.5"/>
<text class="th blue-t" x="640" y="146" text-anchor="middle" dominant-baseline="central">SmartHome control layer</text>
<text class="ts blue-s" x="640" y="167" text-anchor="middle" dominant-baseline="central">Pairing, scenes, automation, status</text>

<line x1="640" y1="188" x2="640" y2="216" class="arr" marker-end="url(#arrow)"/>

<!-- Protocol layer (full width) -->
<rect class="teal-fill" x="40" y="218" width="1200" height="206" rx="10" stroke-width="0.5"/>
<text class="th teal-t" x="62" y="241" dominant-baseline="central">Protocol layer<tspan class="ts teal-s" dx="14">Six sub-protocols, pluggable per device</tspan></text>
<rect class="purple-fill" x="60" y="262" width="376" height="60" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="248" y="282" text-anchor="middle" dominant-baseline="central">Matter</text>
<text class="ts purple-s" x="248" y="302" text-anchor="middle" dominant-baseline="central">IP unifying standard</text>
<rect class="purple-fill" x="452" y="262" width="376" height="60" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="640" y="282" text-anchor="middle" dominant-baseline="central">Thread</text>
<text class="ts purple-s" x="640" y="302" text-anchor="middle" dominant-baseline="central">Low-power IP mesh</text>
<rect class="purple-fill" x="844" y="262" width="376" height="60" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="1032" y="282" text-anchor="middle" dominant-baseline="central">Zigbee</text>
<text class="ts purple-s" x="1032" y="302" text-anchor="middle" dominant-baseline="central">802.15.4 mesh</text>

<rect class="purple-fill" x="60" y="338" width="376" height="60" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="248" y="358" text-anchor="middle" dominant-baseline="central">Z-Wave</text>
<text class="ts purple-s" x="248" y="378" text-anchor="middle" dominant-baseline="central">Sub-GHz mesh</text>
<rect class="purple-fill" x="452" y="338" width="376" height="60" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="640" y="358" text-anchor="middle" dominant-baseline="central">WiFi</text>
<text class="ts purple-s" x="640" y="378" text-anchor="middle" dominant-baseline="central">Direct IP devices</text>
<rect class="purple-fill" x="844" y="338" width="376" height="60" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="1032" y="358" text-anchor="middle" dominant-baseline="central">Bluetooth</text>
<text class="ts purple-s" x="1032" y="378" text-anchor="middle" dominant-baseline="central">BLE short-range</text>

<line x1="640" y1="424" x2="640" y2="452" class="arr" marker-end="url(#arrow)"/>

<!-- Device controls (full width) -->
<rect class="amber-fill" x="40" y="454" width="1200" height="236" rx="10" stroke-width="0.5"/>
<text class="th amber-t" x="62" y="477" dominant-baseline="central">Device controls<tspan class="ts amber-s" dx="14">Per-category widgets</tspan></text>
<rect class="amber-sub" x="60" y="498" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="170" y="525" text-anchor="middle" dominant-baseline="central">Lights</text>
<rect class="amber-sub" x="295" y="498" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="405" y="525" text-anchor="middle" dominant-baseline="central">Thermostats</text>
<rect class="amber-sub" x="530" y="498" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="640" y="525" text-anchor="middle" dominant-baseline="central">Locks</text>
<rect class="amber-sub" x="765" y="498" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="875" y="525" text-anchor="middle" dominant-baseline="central">Blinds</text>
<rect class="amber-sub" x="1000" y="498" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="1110" y="525" text-anchor="middle" dominant-baseline="central">Sensors</text>

<rect class="amber-sub" x="60" y="566" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="170" y="593" text-anchor="middle" dominant-baseline="central">Cameras</text>
<rect class="amber-sub" x="295" y="566" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="405" y="593" text-anchor="middle" dominant-baseline="central">Vacuums</text>
<rect class="amber-sub" x="530" y="566" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="640" y="593" text-anchor="middle" dominant-baseline="central">Plugs</text>
<rect class="amber-sub" x="765" y="566" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="875" y="593" text-anchor="middle" dominant-baseline="central">Speakers</text>
<rect class="amber-sub" x="1000" y="566" width="220" height="54" rx="6" stroke-width="0.5"/>
<text class="th amber-t" x="1110" y="593" text-anchor="middle" dominant-baseline="central">More…</text>

<text class="ts amber-s" x="640" y="660" text-anchor="middle" dominant-baseline="central">Each control maps to devices on any of the protocols above</text>
</svg>
