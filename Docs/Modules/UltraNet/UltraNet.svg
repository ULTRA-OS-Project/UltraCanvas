<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>UltraNet module overview (16:9)</title>
<desc>UltraNet network module organised as peer capability blocks (API surface, core protocols, plugins, credentials) sitting on top of a shared third-party dependency layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:15px;font-weight:500}
.ts{font-size:13px;font-weight:400}
.blue-fill{fill:#E6F1FB;stroke:#185FA5}
.blue-t{fill:#0C447C}.blue-s{fill:#185FA5}
.teal-fill{fill:#E1F5EE;stroke:#0F6E56}
.teal-sub{fill:#9FE1CB;stroke:#0F6E56}
.teal-t{fill:#085041}.teal-s{fill:#0F6E56}
.coral-fill{fill:#FAECE7;stroke:#993C1D}
.coral-sub{fill:#F3CFC2;stroke:#993C1D}
.coral-t{fill:#712B13}.coral-s{fill:#993C1D}
.amber-fill{fill:#FAEEDA;stroke:#854F0B}
.amber-sub{fill:#F2D9A6;stroke:#854F0B}
.amber-t{fill:#633806}.amber-s{fill:#854F0B}
.purple-fill{fill:#EEEDFE;stroke:#534AB7}
.purple-sub{fill:#CECBF6;stroke:#534AB7}
.purple-t{fill:#3C3489}.purple-s{fill:#534AB7}
.pchip{font-size:13px;font-weight:500}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
</defs>

<!-- API surface (full width) -->
<rect class="blue-fill" x="40" y="30" width="1200" height="58" rx="10" stroke-width="0.5"/>
<text class="th blue-t" x="640" y="53" text-anchor="middle" dominant-baseline="central">UltraNet_* API surface</text>
<text class="ts blue-s" x="640" y="72" text-anchor="middle" dominant-baseline="central">C-style entrypoints · opaque handles · sync + async · UltraNetResult</text>

<!-- Core protocols (full width) -->
<rect class="teal-fill" x="40" y="106" width="1200" height="176" rx="10" stroke-width="0.5"/>
<text class="th teal-t" x="62" y="129" dominant-baseline="central">Core protocols</text>
<rect class="teal-sub" x="60" y="146" width="183" height="58" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="151.5" y="165" text-anchor="middle" dominant-baseline="central">HTTP / HTTPS</text>
<text class="ts teal-s" x="151.5" y="185" text-anchor="middle" dominant-baseline="central">REST, streaming, download</text>
<rect class="teal-sub" x="255" y="146" width="183" height="58" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="346.5" y="165" text-anchor="middle" dominant-baseline="central">WebSocket</text>
<text class="ts teal-s" x="346.5" y="185" text-anchor="middle" dominant-baseline="central">ws / wss real-time</text>
<rect class="teal-sub" x="451" y="146" width="183" height="58" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="542.5" y="165" text-anchor="middle" dominant-baseline="central">FTP / FTPS / SFTP</text>
<text class="ts teal-s" x="542.5" y="185" text-anchor="middle" dominant-baseline="central">File transfer</text>
<rect class="teal-sub" x="646" y="146" width="183" height="58" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="737.5" y="165" text-anchor="middle" dominant-baseline="central">TCP / UDP</text>
<text class="ts teal-s" x="737.5" y="185" text-anchor="middle" dominant-baseline="central">Raw transport sockets</text>
<rect class="teal-sub" x="841" y="146" width="183" height="58" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="932.5" y="165" text-anchor="middle" dominant-baseline="central">TLS</text>
<text class="ts teal-s" x="932.5" y="185" text-anchor="middle" dominant-baseline="central">1.2 / 1.3 · custom CA</text>
<rect class="teal-sub" x="1037" y="146" width="183" height="58" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="1128.5" y="165" text-anchor="middle" dominant-baseline="central">DNS</text>
<text class="ts teal-s" x="1128.5" y="185" text-anchor="middle" dominant-baseline="central">A / AAAA / MX / SRV…</text>
<rect class="teal-sub" x="60" y="218" width="379" height="46" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="249.5" y="241" text-anchor="middle" dominant-baseline="central">Cookies / Sessions</text>
<rect class="teal-sub" x="451" y="218" width="379" height="46" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="640.5" y="241" text-anchor="middle" dominant-baseline="central">Proxy</text>
<rect class="teal-sub" x="841" y="218" width="379" height="46" rx="6" stroke-width="0.5"/>
<text class="th teal-t" x="1030.5" y="241" text-anchor="middle" dominant-baseline="central">URL parse / build</text>

<!-- Plugins + credentials -->
<rect class="coral-fill" x="40" y="306" width="880" height="124" rx="10" stroke-width="0.5"/>
<text class="th coral-t" x="62" y="329" dominant-baseline="central">Plugins<tspan class="ts coral-s" dx="14">I&lt;Category&gt;ProtocolPlugin — core binary unchanged</tspan></text>
<text class="ts coral-s" x="62" y="361" dominant-baseline="central">SMTP · IMAP · POP3 · MQTT · gRPC · WebDAV</text>
<text class="ts coral-s" x="62" y="383" dominant-baseline="central">SSH · LDAP · Telnet · RTSP · RTMP · RTP</text>
<text class="ts coral-s" x="62" y="405" dominant-baseline="central">SIP · CoAP · mDNS · SNMP</text>

<rect class="amber-fill" x="936" y="306" width="304" height="124" rx="10" stroke-width="0.5"/>
<text class="th amber-t" x="1088" y="329" text-anchor="middle" dominant-baseline="central">UltraVault</text>
<text class="ts amber-s" x="1088" y="361" text-anchor="middle" dominant-baseline="central">Opt-in credential lookup —</text>
<text class="ts amber-s" x="1088" y="383" text-anchor="middle" dominant-baseline="central">keys, certs, tokens</text>

<line x1="640" y1="430" x2="640" y2="466" class="arr" marker-end="url(#arrow)"/>

<!-- Third-party dependencies (full width) -->
<rect class="purple-fill" x="40" y="468" width="1200" height="218" rx="10" stroke-width="0.5"/>
<text class="th purple-t" x="62" y="491" dominant-baseline="central">Third-party dependencies</text>
<rect class="purple-sub" x="60" y="508" width="379" height="58" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="249.5" y="527" text-anchor="middle" dominant-baseline="central">libcurl</text>
<text class="ts purple-s" x="249.5" y="547" text-anchor="middle" dominant-baseline="central">HTTP, FTP, WS, SMTP…</text>
<rect class="purple-sub" x="451" y="508" width="379" height="58" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="640.5" y="527" text-anchor="middle" dominant-baseline="central">OpenSSL</text>
<text class="ts purple-s" x="640.5" y="547" text-anchor="middle" dominant-baseline="central">TLS, certs, crypto</text>
<rect class="purple-sub" x="841" y="508" width="379" height="58" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="1030.5" y="527" text-anchor="middle" dominant-baseline="central">c-ares / DNS lib</text>
<text class="ts purple-s" x="1030.5" y="547" text-anchor="middle" dominant-baseline="central">Record-type resolution</text>
<rect class="purple-sub" x="60" y="578" width="379" height="58" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="249.5" y="597" text-anchor="middle" dominant-baseline="central">libssh2 / libssh</text>
<text class="ts purple-s" x="249.5" y="617" text-anchor="middle" dominant-baseline="central">SFTP, SSH</text>
<rect class="purple-sub" x="451" y="578" width="379" height="58" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="640.5" y="597" text-anchor="middle" dominant-baseline="central">Platform sockets</text>
<text class="ts purple-s" x="640.5" y="617" text-anchor="middle" dominant-baseline="central">BSD / Winsock · TCP/UDP</text>
<rect class="purple-sub" x="841" y="578" width="379" height="58" rx="6" stroke-width="0.5"/>
<text class="th purple-t" x="1030.5" y="597" text-anchor="middle" dominant-baseline="central">Protocol libs</text>
<text class="ts purple-s" x="1030.5" y="617" text-anchor="middle" dominant-baseline="central">MQTT, gRPC, RTP…</text>
<text class="ts purple-s" x="62" y="662" dominant-baseline="central">Platform glue — Linux · macOS · Windows · ULTRA OS native</text>
</svg>
