<text class="th purple-t" x="1127" y="589" text-anchor="middle" dominant-baseline="central">Cairo / UltraCanvas</text>
<text class="ts purple-s" x="1127" y="609" text-anchor="middle" dominant-baseline="central">Overlay raster · preview</text>
