<text class="ts coral-s" x="932" y="325" text-anchor="middle" dominant-baseline="central">Fade, wipe, dissolve</text>
<rect class="coral-sub" x="1035" y="284" width="184" height="58" rx="6" stroke-width="0.5"/>
<text class="th coral-t" x="1127" y="305" text-anchor="middle" dominant-baseline="central">Codecs</text>
<text class="ts coral-s" x="1127" y="325" text-anchor="middle" dominant-baseline="central">H.264/265, AV1, VP9</text>
