<text class="th purple-t" x="932" y="589" text-anchor="middle" dominant-baseline="central">zimg / libplacebo</text>
<text class="ts purple-s" x="932" y="609" text-anchor="middle" dominant-baseline="central">Scaling · color · HDR</text>
