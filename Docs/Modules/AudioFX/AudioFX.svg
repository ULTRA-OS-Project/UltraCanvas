<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>AudioFX module overview (16:9)</title>
<desc>AudioFX audio engine organised as the AudioFX_* API surface, operation categories, plugin extension and credential layer, sitting on top of a shared third-party dependency layer.</desc>
