<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563eb","options":["#2563eb","#0f172a","#7c3aed","#0f766e"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { campaign: 'poster-berlin', copied: false };
    this.codes = {};

  // The QR code of a text as an SVG path: byte mode, error correction Q, versions 1 to 10 - the portal's qr.py in small.

    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach((b) => put(b, 8));
    put(0, Math.min(4, room - bits.length)); put(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < room; pad ^= 0xFD) put(pad, 8);
    const data = []; bits.forEach((b, i) => { data[i >> 3] = (data[i >> 3] || 0) | (b << (7 - (i & 7))); });
    const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >> 7) * 0x11D); z ^= ((y >> i) & 1) * x; } return z; };
    const eccLen = ECC[ver], nBlocks = BLOCKS[ver], rawCw = Math.floor(raw(ver) / 8), shortN = nBlocks - rawCw % nBlocks, shortLen = Math.floor(rawCw / nBlocks);
    const div = new Array(eccLen).fill(0); div[eccLen - 1] = 1;
    for (let i = 0, root = 1; i < eccLen; i++) { for (let j = 0; j < eccLen; j++) { div[j] = mul(div[j], root); if (j + 1 < eccLen) div[j] ^= div[j + 1]; } root = mul(root, 2); }
    const blocks = [];
    for (let i = 0, k = 0; i < nBlocks; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < shortN ? 0 : 1)); k += dat.length;
      const rem = new Array(eccLen).fill(0);
      dat.forEach((b) => { const f = b ^ rem.shift(); rem.push(0); div.forEach((c, x) => { rem[x] ^= mul(c, f); }); });
      if (i < shortN) dat.push(0);
      blocks.push(dat.concat(rem));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= shortN) all.push(b[i]); });
    const size = ver * 4 + 17, m = [], fn = [];
    for (let y = 0; y < size; y++) { m.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    const set = (x, y, dark) => { m[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(([cx, cy]) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const x = cx + dx, y = cy + dy, dist = Math.max(Math.abs(dx), Math.abs(dy)); if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, dist !== 2 && dist !== 4); } });
    if (ver > 1) { const n = Math.floor(ver / 7) + 2, step = Math.floor((ver * 8 + n * 3 + 5) / (n * 4 - 4)) * 2, pos = [6]; for (let i = n - 2; i >= 0; i--) pos.push(size - 7 - i * step);
      pos.forEach((px, i) => pos.forEach((py, j) => { if (!((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0))) for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(px + dx, py + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); })); }
    const format = (mask) => { const d = (3 << 3) | mask; let rem = d; for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >> 9) * 0x537); const b = ((d << 10) | rem) ^ 0x5412, bit = (i) => ((b >> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i)); set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8)); for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i)); for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i)); set(8, size - 8, true); };
    format(0);
    if (ver >= 7) { let rem = ver; for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >> 11) * 0x1F25); const b = (ver << 12) | rem; for (let i = 0; i < 18; i++) { const dark = ((b >> i) & 1) !== 0, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, dark); set(c, a, dark); } }
    for (let right = size - 1, i = 0; right >= 1; right -= 2) { if (right === 6) right = 5; for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) { const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert; if (!fn[y][x] && i < all.length * 8) { m[y][x] = ((all[i >> 3] >> (7 - (i & 7))) & 1) !== 0; i++; } } }
    const tests = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0, (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const flip = (k) => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && tests[k](x, y)) m[y][x] = !m[y][x]; };

      const line = (cells) => { let score = 0, colour = false, run = 0; const h = [0, 0, 0, 0, 0, 0, 0];
        const add = (r) => { if (h[0] === 0) r += size; h.pop(); h.unshift(r); };

        if (colour) { add(run); run = 0; } add(run + size); return score + count() * 40; };
      for (let y = 0; y < size; y++) res += line(m[y]);
      for (let x = 0; x < size; x++) res += line(m.map((row) => row[x]));
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) if (m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) res += 3;
      let dark = 0; m.forEach((row) => row.forEach((c) => { if (c) dark++; })); const total = size * size;
      return res + (Math.floor((Math.abs(dark * 20 - total * 10) + total - 1) / total) - 1) * 10; };

    for (let k = 0; k < 8; k++) { flip(k); format(k); const p = penalty(); if (p < low) { low = p; best = k; } flip(k); }
    flip(best); format(best);
    let d = '';
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (m[y][x]) { let s = x; while (x < size && m[y][x]) x++; d += 'M' + (s + 4) + ',' + (y + 4) + 'h' + (x - s) + 'v1h-' + (x - s) + 'z'; }
    return { d, side: size + 8 };
  }
  renderVals() {
    const s = this.state;
    const campaigns = ['poster-berlin', 'newsletter-may', 'youtube-review', ''].map((name) => ({
      label: name || 'None', selected: s.campaign === name, pick: () => this.setState({ campaign: name, copied: false }),
      style: 'flex: 0 0 auto; height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; ' +
        (s.campaign === name ? 'border: 1px solid #0f172a; background: #0f172a; color: #ffffff' : 'border: 1px solid #cbd5e1; background: #ffffff; color: #334155')
    }));
    const link = 'https://store.ultraos.eu/r/anna/org.ultraos.ultravideo/' + (s.campaign ? '?s=' + s.campaign : '');
    const code = this.codes[link] || (this.codes[link] = this.qr(link));
    return {
      accent: this.props.accent ?? '#2563eb', campaigns, link, qrPath: code.d, qrSide: code.side, qrBox: '0 0 ' + code.side + ' ' + code.side,
      copy: () => this.setState({ copied: true }), copyLabel: s.copied ? 'Copied' : 'Copy the link'

  }
}
</script>
