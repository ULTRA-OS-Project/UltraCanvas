<text x="60" y="208" font-size="14" fill="#111827">Hello Maria,</text>
<text x="60" y="232" font-size="14" fill="#111827"></text>
<text x="60" y="256" font-size="14" fill="#111827">the invoice for October is attached. The amount</text>
<text x="60" y="280" font-size="14" fill="#111827">is 1,240.00 EUR, due on 20 October.</text>
<text x="60" y="304" font-size="14" fill="#111827"></text>
<text x="60" y="328" font-size="14" fill="#111827">Kind regards,</text>
<text x="60" y="352" font-size="14" fill="#111827">Jonas</text>
