<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img">
<title>UltraClipboard - edit dialog (proposal)</title>
<desc>Editing a clipboard entry. Left: a text entry in a text area, with plain text, trim, case, join lines and replace. Right: an image entry with crop, rotate, resize, text recognition and a hand-off to UltraPaint. Both keep the original entry by default and offer Save and Save and copy.</desc>
