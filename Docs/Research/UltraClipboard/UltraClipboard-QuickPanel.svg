<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img">
<title>UltraClipboard - quick panel on the ULTRA OS desktop (proposal)</title>
<desc>The right bar of the ULTRA OS desktop with its clipboard button active, and the quick panel it opens: a search field, pinned entries, recent entries with thumbnails, copy, edit and delete on the selected and hovered rows, the recording switch and a button that opens the full application.</desc>
