<!doctype html>
<!-- Apps/UltraDBAdmin/web/shell.html
     The page Emscripten wraps UltraDBAdmin in for the browser
     (Apps/UltraDBAdmin/CMakeLists.txt: -\-shell-file). The window fills the
     viewport; until it is up, one status line while the .data bundle
     downloads. The page talks to its relay (ultradbadmin-relay) at
     wss://<this host>/relay unless ?relay=... names another, and needs the
     cross-origin isolation headers for its threads - serve it with
     UltraCanvas/OS/WASM/demo/serve.py, or as Apps/UltraDBAdmin/README.md
     shows for a server. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UltraDBAdmin</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%;
                     background: #f0f2f6; overflow: hidden;
                     font: 14px/1.4 system-ui, sans-serif; color: #1f2329; }
        #uc-status { position: absolute; left: 0; right: 0; top: 45%;
                     text-align: center; white-space: pre-line; }
        #uc-status.hidden { display: none; }
        #uc-status .bar { display: inline-block; width: 240px; height: 4px;
                          margin-top: 12px; background: #dfe3ea; border-radius: 2px;
                          overflow: hidden; }
        #uc-status .bar span { display: block; height: 100%; width: 0;
                               background: #2f6fd6; transition: width 0.2s; }
    </style>
</head>
<body>
    <div id="uc-status">Loading UltraDBAdmin<div class="bar"><span id="uc-bar"></span></div></div>
    <script>
        var Module = {
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); },
            setStatus: function(text) {
                var status = document.getElementById('uc-status');
                if (!status) return;
                var m = text.match(/\(([0-9]+(?:\.[0-9]+)?)\/([0-9]+(?:\.[0-9]+)?)\)/);
                if (m) {
                    document.getElementById('uc-bar').style.width =
                        Math.round(100 * parseFloat(m[1]) / parseFloat(m[2])) + '%';
                }
                status.firstChild.nodeValue = text || 'Starting';
            },
            onRuntimeInitialized: function() {
                var status = document.getElementById('uc-status');
                if (status) status.classList.add('hidden');
            },
            onAbort: function(what) {
                var status = document.getElementById('uc-status');
                if (!status) return;
                status.classList.remove('hidden');
                status.firstChild.nodeValue = 'UltraDBAdmin could not start: ' + what;
            }
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
