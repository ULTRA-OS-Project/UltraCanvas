# master_dependencies.yaml
# Authoritative dependency manifest for ULTRA OS / UltraCanvas modules.
# Section structure follows the "core / advanced" two-tier convention.
# This file is consumed by package-scripts, CI, and module integrators.
# Version: 0.1.0
# Author: UltraCanvas Framework / ULTRA OS

# ===== NETWORK COMMUNICATION (UltraNet) =====
#
# TLS backend strategy: UltraNet uses whichever TLS backend libcurl was built
# against; we never call OpenSSL directly. To minimise impact on existing
# platforms we prefer the OS-native backend wherever it is shipped by default:
#
#   Linux   -> libcurl built against OpenSSL  (system default on Debian/Ubuntu)
#   Windows -> libcurl built against Schannel (no extra DLL — uses Win32 crypto)
#   macOS   -> Apple's system libcurl         (SecureTransport family backend)
#
# This means OpenSSL is only an explicit dependency on Linux; Windows and
# macOS pull TLS, the certificate trust store, and the cipher policy from
# the OS itself.
# ===== CRYPTOGRAPHY (UltraCrypt) =====
#
# UltraCrypt wraps libsodium for all data-at-rest cryptography: hashing, HMAC,
# authenticated encryption, key derivation, secure random and secure memory.
# It is a separate concern from TLS, which stays OS-native per the networking
# policy below (Schannel on Windows, SecureTransport on macOS).
#
# libsodium was chosen because it is the only candidate providing both of the
# algorithms the framework standardised on — XChaCha20-Poly1305 and Argon2id —
# neither of which is offered by OpenSSL 3.0 (the current LTS version),
# Windows CNG or macOS CommonCrypto. See Docs/Modules/UltraCrypt/README.md §3.
#
# Absence is tolerated at build time but never silently: UltraCrypt still
# compiles and every operation then fails with BackendUnavailable, so no data
# is ever written unprotected while reporting success.
cryptography:
  core:
    libsodium:
      min_version: "1.0.18"           # the version on Ubuntu 24.04 LTS
      purpose: "Cryptographic backend for UltraCrypt (Tier 1 core)"
      required: false                 # builds without it; all crypto then fails closed
      platforms: ["all"]
      pkg_config: "libsodium"
      apt: "libsodium-dev"
      brew: "libsodium"
      msys2: "mingw-w64-x86_64-libsodium"
      vcpkg: "libsodium"
      # 1.0.19+ additionally provides crypto_kdf_hkdf_*; until the floor is
      # raised, HKDF must be built on top of the HMAC primitives.

networking:
  core:
    libcurl:
      min_version: "7.86"             # 7.86 ships the curl_ws_* API
      purpose: "HTTP/HTTPS, FTP/FTPS, WebSocket transport (Tier 1 core)"
      required: true
      platforms: ["all"]
      cmake_module: "CURL"
      pkg_config: "libcurl"
      apt: "libcurl4-openssl-dev"      # OpenSSL backend
      vcpkg: "curl[schannel,websockets]"     # Schannel + WS on Windows
      brew: "(system)"                 # Apple ships libcurl with macOS
      msys2: "mingw-w64-x86_64-curl-winssl"  # Schannel-flavoured MinGW build
      # WebSocket support requires libcurl built with --enable-websockets.
      # UltraNet_WebSocketConnect detects this at runtime; if the linked
      # libcurl doesn't list ws/wss in Protocols, it returns InvalidHandle
      # with a clear error explaining how to fix the build.
      # Distro packages vary: Ubuntu 24.04's libcurl4-openssl-dev 8.5 ships
      # WITHOUT WS; vcpkg's curl[websockets] explicitly opts in.

    openssl:
      min_version: "1.1.1"
      purpose: "TLS 1.2/1.3 backend for libcurl on Linux"
      required: true
      platforms: ["Linux"]
      cmake_module: "OpenSSL"
      pkg_config: "openssl"
      apt: "libssl-dev"
      # No vcpkg/brew entry: Windows uses Schannel, macOS uses the
      # SecureTransport-family backend in Apple's system libcurl.

    libssh2:
      min_version: "1.10"
      purpose: "SFTP / SSH file transfer support (Stage 3)"
      required: true
      platforms: ["all"]
      cmake_module: "Libssh2"
      pkg_config: "libssh2"
      apt: "libssh2-1-dev"
      vcpkg: "libssh2"
      brew: "libssh2"

    c-ares:
      min_version: "1.17"
      purpose: "Async DNS resolution (non-blocking) (Stage 2)"
      required: true
      platforms: ["all"]
      cmake_module: "c-ares"
      pkg_config: "libcares"
      apt: "libc-ares-dev"
      vcpkg: "c-ares"
      brew: "c-ares"

  advanced:
    libwebsockets:
      min_version: "4.3"
      purpose: "Lightweight WebSocket server / advanced WS scenarios"
      required: false
      priority: "medium"
      platforms: ["all"]
      pkg_config: "libwebsockets"
      apt: "libwebsockets-dev"

    nghttp2:
      min_version: "1.40"
      purpose: "HTTP/2 multiplexing acceleration"
      required: false
      priority: "high"
      platforms: ["all"]
      pkg_config: "libnghttp2"
      apt: "libnghttp2-dev"

    nghttp3:
      purpose: "HTTP/3 (QUIC) support - future"
      required: false
      priority: "low"
      platforms: ["all"]

    paho-mqtt:
      min_version: "1.3"
      purpose: "MQTT plugin (IoT messaging) - Tier 2 plugin"
      required: false
      priority: "medium"
      platforms: ["all"]
      cmake_module: "PahoMqttC"
      apt: "libpaho-mqtt-dev"

    libssh:
      min_version: "0.9"
      purpose: "Interactive SSH / shell plugin - Tier 3 plugin"
      required: false
      priority: "low"
      platforms: ["all"]
      pkg_config: "libssh"
      apt: "libssh-dev"

    avahi:
      min_version: "0.8"
      purpose: "mDNS / Zeroconf service discovery (Linux) - Tier 2 plugin"
      required: false
      priority: "low"
      platforms: ["Linux"]
      pkg_config: "avahi-client"
      apt: "libavahi-client-dev"

    openldap:
      min_version: "2.4"
      purpose: "LDAP / LDAPS plugin - Tier 3 plugin"
      required: false
      priority: "low"
      platforms: ["all"]
      apt: "libldap2-dev"

# ===== MEDIA (audio codecs) =====
#
# Audio playback/capture and WAV encode + WAV/MP3/FLAC decode come from the
# bundled miniaudio single-header backend and need no packages. The entries
# below are the OPTIONAL system codec libraries that unlock the remaining
# cells of the audio format matrix (encode FLAC/OGG/Opus/MP3, decode
# OGG/Opus). CMake detects each independently; anything missing simply
# leaves its format save- or load-disabled, exactly as reported at runtime
# by UltraCanvasSupportedFormats.
media:
  advanced:
    flac:
      min_version: "1.3"
      purpose: "FLAC encoding for UCAudio::SaveToFile - optional codec"
      required: false
      priority: "medium"
      platforms: ["all"]
      pkg_config: "flac"
      apt: "libflac-dev"
      vcpkg: "libflac"
      brew: "flac"
      msys2: "mingw-w64-x86_64-flac"

    libvorbis:
      min_version: "1.3"
      purpose: "Ogg Vorbis encoding + decoding (vorbisenc / vorbisfile) - optional codec"
      required: false
      priority: "medium"
      platforms: ["all"]
      pkg_config: "vorbisenc vorbisfile vorbis ogg"
      apt: "libvorbis-dev libogg-dev"
      vcpkg: "libvorbis"
      brew: "libvorbis"
      msys2: "mingw-w64-x86_64-libvorbis"

    libopusenc:
      min_version: "0.2"
      purpose: "Opus encoding (Ogg-encapsulated, resamples internally) - optional codec"
      required: false
      priority: "medium"
      platforms: ["all"]
      pkg_config: "libopusenc"
      apt: "libopusenc-dev libopus-dev"
      vcpkg: "libopusenc"
      brew: "libopusenc"
      msys2: "mingw-w64-x86_64-libopusenc"

    opusfile:
      min_version: "0.12"
      purpose: "Opus decoding (always 48 kHz output) - optional codec"
      required: false
      priority: "medium"
      platforms: ["all"]
      pkg_config: "opusfile"
      apt: "libopusfile-dev"
      vcpkg: "opusfile"
      brew: "opusfile"
      msys2: "mingw-w64-x86_64-opusfile"

    lame:
      min_version: "3.100"
      purpose: "MP3 encoding (LGPL, linked as a shared system library) - optional codec"
      required: false
      priority: "medium"
      platforms: ["all"]
      # LAME ships no pkg-config file; CMake uses find_library(mp3lame) +
      # find_path(lame/lame.h).
      apt: "libmp3lame-dev"
      vcpkg: "mp3lame"
      brew: "lame"
      msys2: "mingw-w64-x86_64-lame"

# ===== WINDOWS-APP COMPATIBILITY (UltraWin) =====
#
# UltraWin never links its engines: Wine (and, in Stage 2, QEMU) are spawned
# as child processes, keeping their LGPL/GPL licensing outside the framework
# binaries. Wine is therefore a *runtime* dependency only — the module builds
# everywhere on Linux and probes for the binary via UltraWin_GetCapabilities.
windows_compatibility:
  core:
    wine:
      min_version: "10.0"             # 11.0 recommended (ntsync, complete WoW64)
      purpose: "Wine tier: runs Windows apps as native windows (runtime, spawned — never linked)"
      required: false
      priority: "high"
      platforms: ["linux"]
      # No cmake_module / pkg_config: nothing is linked. Runtime probe only.
      apt: "wine"

    winetricks:
      min_version: "20240105"
      purpose: "Component installer for Wine environments: VC++ runtimes, fonts, .NET, DXVK (runtime, spawned — never linked)"
      required: false
      priority: "medium"
      platforms: ["linux"]
      # No cmake_module / pkg_config: nothing is linked. Runtime probe only.
      apt: "winetricks"

    qemu:
      min_version: "8.0"
      purpose: "VM tier (Stage 2): headless Windows guest via qemu-system-x86_64 + qemu-img, KVM-accelerated (runtime, spawned — never linked; controlled over QMP)"
      required: false
      priority: "medium"
      platforms: ["linux"]
      # No cmake_module / pkg_config: nothing is linked. Runtime probe only.
      apt: "qemu-system-x86 qemu-utils"

# ===== TEXT PROCESSING (spell checking) =====
#
# Every entry here is optional and none of them can fail the build. The service
# picks a backend at runtime in this order:
#
#   Linux   -> enchant-2, else Hunspell
#   Windows -> ISpellChecker (Windows 8+), else Hunspell
#   macOS   -> NSSpellChecker (always present)
#   other   -> Hunspell
#
# With none of them available the module still compiles and reports zero
# dictionaries, so spell checking simply does nothing rather than breaking a
# build or a run. Dictionaries themselves are runtime data, not a build
# dependency; see dictionary_data below.
text_processing:
  core:
    hunspell:
      min_version: "1.7"
      purpose: "Portable spell check engine and fallback backend (Tier 1 core)"
      required: false
      priority: "high"
      platforms: ["all"]
      pkg_config: "hunspell"
      build_flag: "ULTRACANVAS_HAS_HUNSPELL"
      apt: "libhunspell-dev"
      dnf: "hunspell-devel"
      pacman: "hunspell"
      brew: "hunspell"
      vcpkg: "hunspell"
      notes: >
        The only backend on Android and WebAssembly. Discovers .aff/.dic pairs
        from ULTRACANVAS_DICT_PATH, the user data directory, the application's
        own "dictionaries" folder and the standard system paths. Words are
        converted to the encoding each dictionary declares in its SET
        directive; a dictionary in an encoding the backend cannot represent is
        reported unavailable rather than loaded. Without the build flag the
        backend compiles to a stub reporting zero dictionaries.

  advanced:
    enchant:
      min_version: "2.2"
      purpose: "Native Linux spell check broker (wraps Hunspell/Aspell/Nuspell/Voikko)"
      required: false
      priority: "high"
      platforms: ["linux"]
      pkg_config: "enchant-2"
      build_flag: "ULTRACANVAS_HAS_ENCHANT"
      fallback: "hunspell"
      apt: "libenchant-2-dev"
      dnf: "enchant2-devel"
      pacman: "enchant"
      notes: >
        The same broker GTK, LibreOffice and Firefox use, so UltraCanvas sees
        the dictionaries the user already has installed. When absent,
        CreateNativeSpellCheckBackend() returns nullptr and the service falls
        back to the Hunspell backend.

    windows_spellcheck:
      min_version: "Windows 8"
      purpose: "Native Windows spell checking via the ISpellChecker COM API"
      required: false
      priority: "high"
      platforms: ["windows"]
      system_header: "spellcheck.h"
      build_flag: "ULTRACANVAS_HAS_WINSPELLCHECK"
      fallback: "hunspell"
      link_libraries: ["Ole32"]
      notes: >
        Ships with the OS - nothing to install. Shares dictionaries and the
        per-user custom word list with Word and Edge. Windows 7 has no
        spellcheck.h, so the CMake probe fails and the build falls back to
        Hunspell.

    macos_nsspellchecker:
      purpose: "Native macOS spell checking via NSSpellChecker"
      required: false
      priority: "high"
      platforms: ["macos"]
      frameworks: ["AppKit", "Foundation"]
      notes: >
        Ships with the OS and needs no feature flag. Inherits the user's
        installed languages, their learned words and any third-party
        dictionaries, so no dictionary files are shipped.

  # Runtime data, not a build dependency. Searched in this order; the first
  # directory holding a given language code wins.
  dictionary_data:
    format: "Hunspell .aff + .dic pairs, named <language_code>.aff / <language_code>.dic"
    search_order:
      - "$ULTRACANVAS_DICT_PATH (colon-separated; semicolon on Windows)"
      - "$XDG_DATA_HOME/UltraCanvas/dictionaries"
      - "$HOME/.local/share/UltraCanvas/dictionaries"
      - "$HOME/.local/share/hunspell"
      - "$HOME/Library/Spelling"
      - "$APPDATA/UltraCanvas/dictionaries"
      - "./dictionaries"
      - "./Resources/dictionaries"
      - "/usr/share/hunspell"
      - "/usr/share/myspell"
      - "/usr/share/myspell/dicts"
      - "/usr/local/share/hunspell"
      - "/Library/Spelling"
      - "/System/Library/Spelling"
    packages:
      apt: "hunspell-en-us (and hunspell-<lang> for others)"
      dnf: "hunspell-en"
      pacman: "hunspell-en_us"
    user_dictionary:
      linux:   "$XDG_DATA_HOME/UltraCanvas/UserDictionary.txt"
      macos:   "$HOME/.local/share/UltraCanvas/UserDictionary.txt"
      windows: "%APPDATA%\\UltraCanvas\\UserDictionary.txt"
      format: "One lower-cased word per line; # starts a comment"
      notes: >
        Only used when the active backend does not own a persistent user
        dictionary of its own. enchant, NSSpellChecker and ISpellChecker all
        do, so on those the word goes to the system list instead and no second
        copy is kept here.

# ===== AI CAPABILITIES (UltraAI) =====
#
# The interfaces, registry, mock adapters, and shared adapter infrastructure
# have no third-party dependencies. Individual provider adapters are opt-in
# and bring their own:
#
#   - Anthropic adapter: JSON via the repo-vendored nlohmann/json
#     (UltraCanvas/third_party/nlohmann; already licensed) — nothing to
#     install.
#   - llama.cpp adapter: vendors the inference engine at configure time.
ai:
  advanced:
    llama_cpp:
      min_version: "pinned commit (see ULTRAAI_LLAMACPP_GIT_TAG in UltraAI/adapters/llamacpp/CMakeLists.txt)"
      purpose: "Local GGUF inference for the UltraAI llama-cpp adapter (llama.cpp + ggml, MIT)"
      required: false
      priority: "medium"
      platforms: ["linux", "macos", "windows"]
      # Not a system package: fetched via CMake FetchContent (or an existing
      # checkout via ULTRAAI_LLAMACPP_SOURCE_DIR) and built as static libs
      # when ULTRAAI_ADAPTER_LLAMACPP=ON. Off by default.
